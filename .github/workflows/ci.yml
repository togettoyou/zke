name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      ZKE_TEST_DATABASE_URL: postgres://zke_test:zke_test@localhost:5432/zke_test?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zke_test
          POSTGRES_USER: zke_test
          POSTGRES_PASSWORD: zke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zke_test -d zke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - run: go vet ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    env:
      ZKE_TEST_DATABASE_URL: postgres://zke_test:zke_test@localhost:5432/zke_test?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zke_test
          POSTGRES_USER: zke_test
          POSTGRES_PASSWORD: zke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zke_test -d zke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race tests
        run: go test -race ./...

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify generated OpenAPI types
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  release:
    name: Release
    needs:
      - go
      - race
      - console
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
