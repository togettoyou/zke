name: Images and Helm chart

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server
            image: togettoyou/zke-server
            file: build/server/Dockerfile
            target: server
          - name: Server with PostgreSQL
            image: togettoyou/zke-server-pg
            file: build/server/Dockerfile
            target: server-pg
          - name: Agent
            image: togettoyou/zke-agent
            file: build/agent/Dockerfile
            target: agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr
      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Lint chart
        run: helm lint deploy/chart
      - name: Render chart
        run: helm template zke deploy/chart --namespace zke-system > /dev/null
      - name: Resolve chart and image versions
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            echo "chart_version=0.0.0-latest" >> "$GITHUB_OUTPUT"
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chart_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$chart_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Git tag ${GITHUB_REF_NAME} is not a semantic version" >&2
            exit 1
          fi
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Package and publish chart
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p dist
          helm package deploy/chart \
            --destination dist \
            --version "${{ steps.version.outputs.chart_version }}" \
            --app-version "${{ steps.version.outputs.image_tag }}"
          helm push "dist/zke-${{ steps.version.outputs.chart_version }}.tgz" \
            oci://ghcr.io/togettoyou/charts
