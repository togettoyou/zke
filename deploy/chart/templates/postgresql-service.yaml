apiVersion: v1
kind: Service
metadata:
  name: {{ include "zke.postgresql.fullname" . }}
  labels:
    {{- include "zke.labels" . | nindent 4 }}
    {{- include "zke.postgresql.selectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "zke.postgresql.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
