services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: zke
      POSTGRES_USER: zke_dev
      POSTGRES_PASSWORD: zke_local_development_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zke_dev -d zke"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - zke-postgres-data:/var/lib/postgresql/data

volumes:
  zke-postgres-data:
