http:
  address: 127.0.0.1:8080
  # Optional native HTTPS for the HTTP API. QUIC uses agent_listener TLS instead.
  tls_certificate_file: ""
  tls_private_key_file: ""
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

database:
  url: postgres://zke_dev:zke_local_development_only@127.0.0.1:5432/zke?sslmode=disable
  connect_timeout: 5s
  migration_timeout: 2m

auth:
  session_idle_timeout: 30m
  session_absolute_timeout: 8h
  operation_timeout: 10s
  # Each password check uses the Argon2id memory setting (currently 64 MiB).
  max_concurrent_password_checks: 4
  # Local HTTP development only. TLS deployments must set this to true.
  cookie_secure: false
  login_rate_limit:
    window: 1m
    max_attempts_per_account: 5
    max_attempts_per_source: 20

agent_enrollment:
  # Run hack/generate-dev-certificates.sh once for local development.
  signing_ca_certificate_file: .local/development/agent-ca.crt
  signing_ca_private_key_file: .local/development/agent-ca.key
  certificate_ttl: 720h
  operation_timeout: 10s
  rate_limit:
    window: 1m
    max_attempts_per_source: 30

agent_listener:
  # QUIC listens on UDP using the host and port from http.address.
  tls_certificate_file: .local/development/zke-server.crt
  tls_private_key_file: .local/development/zke-server.key
  handshake_timeout: 10s
  heartbeat_interval: 10s
  heartbeat_timeout: 30s
  # Heartbeats update in-memory liveness immediately and persist at this cadence.
  last_seen_write_interval: 1m
  operation_timeout: 10s

shutdown_timeout: 10s
log_level: debug
