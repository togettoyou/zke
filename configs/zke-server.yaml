http:
  # HTTP API and Console endpoint. The container image serves the built Console
  # from this directory; mount another file at /etc/zke/zke-server.yaml to
  # replace this complete configuration.
  address: 0.0.0.0:8080
  console_directory: /usr/share/zke/console
  # Optional native HTTPS. Leave this block omitted for loopback HTTP or when
  # an upstream gateway terminates TLS. These files are independent from the
  # Agent QUIC/mTLS certificates below and must be configured together.
  # tls:
  #   certificate_file: /var/run/secrets/zke-http/tls.crt
  #   private_key_file: /var/run/secrets/zke-http/tls.key
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

# Optional, isolated browser origin for HTTP services running inside Pods.
# It is a second listener in the same Server process and never exposes ZKE API
# routes. Keep disabled until external_url is reachable by the operator's
# browser. Native TLS is optional; an upstream gateway may terminate HTTPS and
# forward plain HTTP to this listener. Direct external HTTP is accepted only on
# loopback for local development because activation URLs are bearer credentials.
# A gateway in front of this listener must preserve the external Host header.
pod_access:
  enabled: true
  address: 0.0.0.0:8081
  external_url: http://127.0.0.1:8081
  # tls:
  #   certificate_file: /var/run/secrets/zke-pod-access/tls.crt
  #   private_key_file: /var/run/secrets/zke-pod-access/tls.key
  read_header_timeout: 5s
  idle_timeout: 60s
  activation_ttl: 30s
  # Maximum user-selectable access duration. The Server hard limit is 1h.
  session_ttl: 1h
  revalidate_interval: 15s
  max_pending_sessions: 1024
  max_active_sessions: 256
  # Each upstream HTTP connection consumes one Agent Pod Port Forward Stream.
  max_connections: 128
  max_connections_per_session: 8
  max_connections_per_agent: 16
  # Aggregate browser-to-Pod and Pod-to-browser budgets for one access session.
  max_client_bytes: 1073741824
  max_pod_bytes: 1073741824

database:
  # ZKE_DATABASE_URL overrides this value. The default matches the PostgreSQL
  # Service in deploy/kubernetes and the bundled credentials used by the
  # zke-server-pg quick-start image.
  url: postgres://zke:zke_change_me@zke-postgres:5432/zke?sslmode=disable
  connect_timeout: 5s
  migration_timeout: 2m
  # Size the pool against the PostgreSQL connection budget, leaving room for
  # migrations and any other client sharing the instance. ZKE Server runs as a
  # single instance: Agent connection state and rate limiting are in-process,
  # so a second concurrent Server would report Clusters it does not hold as
  # offline and multiply the configured rate limits.
  max_connections: 16
  min_connections: 2
  max_connection_lifetime: 1h
  max_connection_idle_time: 30m

auth:
  session_idle_timeout: 30m
  session_absolute_timeout: 8h
  operation_timeout: 10s
  # Each password check uses the Argon2id memory setting (currently 64 MiB).
  max_concurrent_password_checks: 4
  # Controls the browser session cookie's Secure attribute. Keep false only for
  # loopback HTTP; set true for HTTPS, whether TLS ends here or at a gateway.
  cookie_secure: false
  login_rate_limit:
    window: 1m
    max_attempts_per_account: 5
    max_attempts_per_source: 20
  # Persistent per-account lockout survives Server restarts. A correct login
  # after the duration expires recovers automatically; a global administrator
  # can also unlock the account through the management API.
  account_lockout:
    max_failed_attempts: 5
    duration: 15m
  initial_admin:
    # Applied once, only while the users table is empty. The generated password
    # is written with mode 0600 and is never logged. Persist /var/lib/zke or
    # mount a pre-created Secret at this path.
    enabled: true
    username: admin
    display_name: ZKE Administrator
    password_file: /var/lib/zke/admin-password
    auto_generate_password: true

agent_pki:
  # "managed" lets Server create and renew its Agent-side PKI. "external"
  # loads a complete certificate set supplied by the deployment.
  mode: managed
  # Lifetime of Agent client certificates issued at enrollment and renewal.
  agent_client_certificate_validity: 720h

  managed:
    # Mount this directory on a private PV in a deployment. If database PKI
    # state exists but the directory is lost, Server fails closed.
    directory: /var/lib/zke/pki
    auto_generate: true
    agent_client_ca_validity: 87600h
    agent_listener_ca_validity: 175200h
    agent_listener_certificate_validity: 87600h
    # Listener leaf renewal happens at Server startup. CAs never auto-rotate.
    agent_listener_renew_before: 8760h
    # Replace with exact public QUIC names/IPs; never inferred from bind.
    listener_sans:
      dns_names:
        - localhost
        - zke-server
        - zke-server.zke-system
        - zke-server.zke-system.svc
      ip_addresses:
        - 127.0.0.1

  # Used only with mode: external. Server loads these files but never generates
  # or renews them. The Agent Listener CA private key stays outside Server.
  # external:
  #   agent_client_ca:
  #     certificate_file: /var/run/secrets/zke-agent-pki/agent-client-ca.crt
  #     private_key_file: /var/run/secrets/zke-agent-pki/agent-client-ca.key
  #   agent_listener_ca:
  #     certificate_file: /var/run/secrets/zke-agent-pki/agent-listener-ca.crt
  #   agent_listener:
  #     certificate_file: /var/run/secrets/zke-agent-pki/agent-listener.crt
  #     private_key_file: /var/run/secrets/zke-agent-pki/agent-listener.key

agent_enrollment:
  # Controls the one-time HTTP(S) bootstrap operation.
  operation_timeout: 10s
  rate_limit:
    window: 1m
    max_attempts_per_source: 30

agent_install:
  # Enabled by default so the installation workflow is available immediately.
  # For a remote target Cluster, replace the public endpoints with addresses
  # reachable by both the operator and Agent. The corresponding ZKE_AGENT_*
  # environment variables can override these deployment-specific values.
  enabled: true
  public_http_url: http://127.0.0.1:8080
  public_quic_address: 127.0.0.1:8443
  image: ghcr.io/togettoyou/zke-agent:latest
  namespace: zke-system
  image_pull_policy: IfNotPresent
  # Set only when the HTTPS registration endpoint uses a private CA.
  # registration_ca_certificate_file: /var/run/secrets/zke-http/ca.crt

# The Agent image also contains the shell and kubectl tools used by the
# standalone Cluster Terminal App.
cluster_terminal:
  image: ghcr.io/togettoyou/zke-agent:latest
  session_ttl: 15m

agent_listener:
  # Dedicated QUIC/UDP endpoint for persistent Agent mTLS connections.
  address: 0.0.0.0:8443
  handshake_timeout: 10s
  heartbeat_interval: 10s
  heartbeat_timeout: 30s
  # Heartbeats update in-memory liveness immediately and persist at this cadence.
  last_seen_write_interval: 1m
  operation_timeout: 10s
  # Deadline for a single control frame write towards an Agent.
  write_timeout: 5s
  # Connections beyond this limit are refused before any Server state is
  # allocated for them; the rejected Agent reconnects under its own backoff.
  max_concurrent_agents: 1024
  # Agent-created Streams received by the Server: one Control Stream plus
  # future Agent-initiated business Streams.
  max_incoming_streams: 16
  resource_request_timeout: 2m
  connection_drain_timeout: 10s
  max_resource_body_bytes: 33554432
  # Instance-wide raw response bytes buffered while decoding Kubernetes
  # resources. This must be at least max_resource_body_bytes.
  max_buffered_resource_response_bytes: 268435456
  max_resource_streams_per_agent: 64
  max_concurrent_resource_requests: 4096
  # Pod logs use independent long-lived Streams and admission limits.
  pod_logs_request_timeout: 30m
  max_pod_log_bytes: 16777216
  max_pod_logs_streams_per_agent: 8
  max_concurrent_pod_logs_requests: 256

  # Web Terminal sessions are one-time, short-lived tickets bound to the
  # authenticated user, login session, Cluster, Pod UID, and container.
  pod_exec_request_timeout: 15m
  max_pod_exec_input_bytes: 16777216
  max_pod_exec_output_bytes: 33554432
  max_pod_exec_streams_per_agent: 4
  max_concurrent_pod_exec_requests: 128
  pod_exec_session_ttl: 30s
  max_pending_pod_exec_sessions: 1024
  # Kubernetes Event Resource Watch has independent global and per-Agent budgets.
  resource_watch_request_timeout: 30m
  max_resource_watch_streams_per_agent: 16
  max_concurrent_resource_watch_requests: 512
  # How many disconnected Agents keep a last-known status in memory, so that
  # Cluster churn cannot grow the Server heap without bound.
  max_remembered_disconnects: 4096

certificate_monitor:
  # Drives the Agent status API's expiring state and periodic structured
  # warnings. Agent renewal normally happens earlier (seven days by default).
  warning_before: 168h
  check_interval: 1h

shutdown_timeout: 10s
log_level: info
