http:
  # HTTP API and Console endpoint. Local development normally runs the Vite
  # dev server separately, so the default is empty. Container images set
  # ZKE_CONSOLE_DIRECTORY to their built Console assets.
  address: 0.0.0.0:8080
  console_directory: ""
  # Optional native HTTPS. Leave this block omitted for loopback HTTP or when
  # an upstream gateway terminates TLS. These files are independent from the
  # Agent QUIC/mTLS certificates below and must be configured together.
  # tls:
  #   certificate_file: /var/run/secrets/zke-http/tls.crt
  #   private_key_file: /var/run/secrets/zke-http/tls.key
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

# Optional, isolated browser origin for HTTP services running inside Pods.
# It is a second listener in the same Server process and never exposes ZKE API
# routes. Keep disabled until external_url is reachable by the operator's
# browser. Native TLS is optional; an upstream gateway may terminate HTTPS and
# forward plain HTTP to this listener. HTTP and HTTPS external URLs are both
# supported; choose HTTPS when transport confidentiality is required.
# A gateway in front of this listener must preserve the external Host header.
pod_access:
  enabled: true
  address: 0.0.0.0:8081
  external_url: http://127.0.0.1:8081
  # tls:
  #   certificate_file: /var/run/secrets/zke-pod-access/tls.crt
  #   private_key_file: /var/run/secrets/zke-pod-access/tls.key
  read_header_timeout: 5s
  idle_timeout: 60s
  activation_ttl: 30s
  # Maximum user-selectable access duration. The Server hard limit is 1h.
  session_ttl: 1h
  revalidate_interval: 15s
  max_pending_sessions: 1024
  max_active_sessions: 256
  # Each upstream HTTP connection consumes one Agent Pod Port Forward Stream.
  max_connections: 128
  max_connections_per_session: 8
  max_connections_per_agent: 16
  # Aggregate browser-to-Pod and Pod-to-browser budgets for one access session.
  max_client_bytes: 1073741824
  max_pod_bytes: 1073741824

database:
  # ZKE_DATABASE_URL overrides this value in containers. The default is intended
  # for a directly started local development database.
  url: postgres://zke_dev:zke_local_development_only@127.0.0.1:5432/zke?sslmode=disable
  connect_timeout: 5s
  migration_timeout: 2m
  # Size the pool against the PostgreSQL connection budget, leaving room for
  # migrations and any other client sharing the instance. ZKE Server runs as a
  # single instance: Agent connection state and rate limiting are in-process,
  # so a second concurrent Server would report Clusters it does not hold as
  # offline and multiply the configured rate limits.
  max_connections: 16
  min_connections: 2
  max_connection_lifetime: 1h
  max_connection_idle_time: 30m

auth:
  session_idle_timeout: 30m
  session_absolute_timeout: 8h
  operation_timeout: 10s
  # Each password check uses the Argon2id memory setting (currently 64 MiB).
  max_concurrent_password_checks: 4
  # The session cookie's Secure attribute is not configured here. It follows each
  # request: native TLS, or X-Forwarded-Proto from a gateway that terminated it.
  login_rate_limit:
    window: 1m
    max_attempts_per_account: 5
    max_attempts_per_source: 20
  # Persistent per-account lockout survives Server restarts. A correct login
  # after the duration expires recovers automatically; a global administrator
  # can also unlock the account through the management API.
  account_lockout:
    max_failed_attempts: 5
    duration: 15m

agent_pki:
  # Server owns every certificate below: the two CAs, its own Listener identity,
  # and the client certificates Agents receive. The HTTP and Pod Access TLS
  # files above come from outside the Server and are not part of this lifecycle.
  #
  # Mount this directory on a private PV in a deployment. If database PKI
  # state exists but the directory is lost, Server fails closed.
  directory: data/pki

  # Agent Client CA signs the certificates Agents present on QUIC/mTLS,
  # issued at enrollment and renewal.
  client_ca_validity: 87600h
  client_certificate_validity: 720h

  # Agent Listener CA signs this Server's own QUIC identity. Public QUIC names
  # are derived from enabled endpoint profiles stored in PostgreSQL.
  # Listener leaf renewal happens automatically. CAs never auto-rotate.
  listener_ca_validity: 175200h
  listener_certificate_validity: 87600h
  listener_renew_before: 8760h

  # Expiry surveillance over the certificates issued above. It drives the Agent
  # status API's expiring state and periodic structured warnings. Agent-side
  # renewal normally happens earlier (identity.renew_before, seven days by
  # default). warn_before must stay below client_certificate_validity, or every
  # Agent reports expiring from the moment its certificate is issued.
  monitor:
    warn_before: 168h
    check_interval: 1h

# Default endpoint embedded into new Agent enrollment credentials. Configure
# both values together. Leaving both empty uses the local loopback preset.
# Environment variables ZKE_AGENT_INSTALL_PUBLIC_HTTP_URL and
# ZKE_AGENT_INSTALL_PUBLIC_QUIC_ADDRESS take precedence over these values.
agent_install:
  public_http_url: ""
  public_quic_address: ""

# Reclaims rows whose purpose has ended. Each duration below is counted from the
# moment the row finished -- a session expiring or being revoked, an enrollment
# being consumed, revoked or lapsing, a credential being revoked or expiring --
# not from when it was created.
#
# Audit events are not swept: how long they must be kept is a compliance
# decision, so they are retained until an operator removes them deliberately.
retention:
  sweep_interval: 1h
  sessions: 24h
  enrollments: 720h
  credentials: 720h

agent_enrollment:
  # Controls the one-time HTTP(S) bootstrap operation.
  operation_timeout: 10s
  rate_limit:
    window: 1m
    max_attempts_per_source: 30

agent_listener:
  # Dedicated QUIC/UDP endpoint for persistent Agent mTLS connections.
  address: 0.0.0.0:8443
  handshake_timeout: 10s
  heartbeat_interval: 10s
  heartbeat_timeout: 30s
  # Heartbeats update in-memory liveness immediately and persist at this cadence.
  last_seen_write_interval: 1m
  operation_timeout: 10s
  # Deadline for a single control frame write towards an Agent.
  write_timeout: 5s
  # Connections beyond this limit are refused before any Server state is
  # allocated for them; the rejected Agent reconnects under its own backoff.
  max_concurrent_agents: 1024
  # Agent-created Streams received by the Server: one Control Stream plus
  # future Agent-initiated business Streams.
  max_incoming_streams: 16
  resource_request_timeout: 2m
  connection_drain_timeout: 10s
  max_resource_body_bytes: 33554432
  # Instance-wide raw response bytes buffered while decoding Kubernetes
  # resources. This must be at least max_resource_body_bytes.
  max_buffered_resource_response_bytes: 268435456
  max_resource_streams_per_agent: 64
  max_concurrent_resource_requests: 4096
  # Pod logs use independent long-lived Streams and admission limits.
  pod_logs_request_timeout: 30m
  max_pod_log_bytes: 16777216
  max_pod_logs_streams_per_agent: 8
  max_concurrent_pod_logs_requests: 256

  # Web Terminal sessions are one-time, short-lived tickets bound to the
  # authenticated user, login session, Cluster, Pod UID, and container.
  pod_exec_request_timeout: 15m
  max_pod_exec_input_bytes: 16777216
  max_pod_exec_output_bytes: 33554432
  max_pod_exec_streams_per_agent: 4
  max_concurrent_pod_exec_requests: 128
  pod_exec_session_ttl: 30s
  max_pending_pod_exec_sessions: 1024
  # Kubernetes Event Resource Watch has independent global and per-Agent budgets.
  resource_watch_request_timeout: 30m
  max_resource_watch_streams_per_agent: 16
  max_concurrent_resource_watch_requests: 512
  # How many disconnected Agents keep a last-known status in memory, so that
  # Cluster churn cannot grow the Server heap without bound.
  max_remembered_disconnects: 4096

# Multi-cluster metrics. A Server with them disabled never offers metrics
# ingest to an Agent, so a Cluster learns at handshake time that there is
# nowhere to send data. Enabling them needs a VictoriaMetrics the Server can
# reach; only the Server talks to it, it is never proxied to a browser.
observability:
  metrics:
    # On by default, matching the deployments that ship storage beside the
    # Server: the all-in-one image, Docker Compose and the Helm Chart. Each
    # points the two URLs below at its own storage. A deployment with none must
    # set this to false rather than leave it aimed at an address nothing
    # answers on.
    enabled: true
    storage_write_url: http://127.0.0.1:8428/api/v1/write
    storage_write_timeout: 30s
    # Query base on the same backend. Separate from the write endpoint because
    # some deployments put the two behind different addresses.
    storage_query_url: http://127.0.0.1:8428/prometheus
    storage_query_timeout: 30s
    max_query_points: 1500
    max_query_series: 500
    max_query_range: 168h
    min_query_step: 15s
    # One long-lived Stream per collecting Agent, opened by the Agent.
    ingest_session_timeout: 30m
    max_batch_bytes: 4194304
    max_ingest_streams: 512
    # Decompressed size is checked from the snappy header before a buffer that
    # large is allocated. It must not be below max_batch_bytes.
    max_decompressed_batch_bytes: 33554432
    max_series_per_batch: 50000
    max_samples_per_batch: 200000
    max_labels_per_series: 64
    max_label_name_bytes: 128
    max_label_value_bytes: 1024
    # Samples outside this window are refused: future timestamps corrupt range
    # queries, and very old ones may fall outside the retention window anyway.
    max_sample_age: 24h
    max_sample_future: 10m
    # Everything above bounds one batch. The four below bound one Cluster over
    # time, which is the only thing that stops a single Cluster from filling the
    # storage every other Cluster shares — batch limits alone do nothing against
    # a Cluster that sends a legal batch every hundred milliseconds.
    #
    # Both are protection limits, not capacity promises: they are set well above
    # what a large Cluster scraping only the kubelet resource endpoint produces,
    # so they catch a runaway rather than a busy day. Raise them only with
    # measured numbers from your own deployment.
    max_samples_per_second_per_cluster: 50000
    # How much of that rate a Cluster may spend at once. It exists for
    # reconnects: vmagent flushes its disk buffer as fast as the link allows,
    # and refusing that flush at the steady-state rate turns every brief
    # disconnect into a long one.
    sample_burst_window: 1m
    # Active time series per Cluster, measured over the window below. The count
    # is an estimate from a fixed-size sketch, so tracking a Cluster costs the
    # same whether it reports a thousand series or a million.
    max_active_series_per_cluster: 500000
    active_series_window: 10m
    # The collector image, its pull policy and its CPU and memory requests and
    # limits are platform settings, not configuration file entries: collection
    # is enabled per Cluster long after the Server started, so changing them
    # must not need a restart. They are managed in the Console under
    # 平台配置 → 指标采集.
    #
    # Disk the collector may use to buffer while the Agent is unreachable. This
    # is the only durable buffer in the pipeline.
    collector_buffer_size: 1Gi
    scrape_interval: 30s
    # The port the kubelet serves /metrics/resource on.
    kubelet_metrics_port: 10250

# The AIOps agent loop and its context management.
#
# Which model AIOps talks to, how wide that model's context window is and how
# much it may emit are platform settings an administrator edits in the Console
# under 平台配置 → AI 模型: they change when the endpoint changes, and a Server
# restart must not be what it takes to point at a different model.
#
# What is here is deployment policy. Compaction is expressed as fractions of
# whatever context window the configured endpoint has, so moving from a 128k
# model to a 1M one widens the conversation instead of leaving a stored token
# count quietly wrong.
aiops:
  # One whole turn: model calls and cluster reads together.
  turn_timeout: 20m
  # The two budgets that guarantee the loop stops. A turn that spends either
  # without reaching a conclusion ends with a classified failure rather than
  # continuing to spend the operator's model budget.
  max_steps: 40
  max_tool_calls: 120
  # Reads from one step run concurrently up to this many at a time. A step with
  # any mutating tool, including a terminal command, runs in model order; this
  # bound stops a read-only step from opening a Stream per object to an Agent
  # that also serves the rest of the platform.
  max_parallel_tool_calls: 10
  # The same tool with the same arguments beyond this is answered with a
  # convergence note instead of another round trip to the Cluster.
  repeated_call_limit: 2
  # A sensitive call parked on a person, and the naming call that runs beside a
  # first turn. Neither holds a turn open indefinitely.
  approval_timeout: 15m
  title_timeout: 30s

  # Transient endpoint failures — a rate limit, a 5xx, a dropped stream — are
  # retried with bounded exponential backoff. max_retries counts attempts after
  # the first, so 0 disables retrying. A credential the endpoint refused, an
  # exhausted balance and a request it will not accept are never retried: they
  # fail identically every time.
  model_retry:
    max_retries: 5
    initial_delay: 500ms
    max_delay: 10s
    # Symmetric spread around each delay, so several turns refused together do
    # not come back together.
    jitter_ratio: 0.1

  compaction:
    # Fraction of the context window at which the conversation is compacted
    # before the next request is built.
    threshold_ratio: 0.8
    # Fraction kept verbatim at the tail. Recent steps are what the next step
    # reasons from, so they survive compaction unsummarized; everything before
    # them is replaced by one checkpoint the model writes.
    retain_ratio: 0.16
    # The checkpoint is a structured brief, not a transcript.
    max_summary_tokens: 8192
    # Extra attempts one summarization gets before the runtime falls back to a
    # mechanical summary, and how many times a request the endpoint refused as
    # too large may be compacted and sent again inside one step.
    retries: 1
    max_overflow_retries: 1

  # What one tool answer may occupy in the model context, in characters. Above
  # the threshold the head and the tail are kept with a marker between them:
  # the head says what was returned and in what shape, and a container that
  # crashed says why at the end of its log.
  tool_result:
    threshold_chars: 8192
    head_chars: 4096
    tail_chars: 1024

shutdown_timeout: 10s
log_level: info
