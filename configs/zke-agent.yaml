# For a host-run Agent, start Server first and run
# hack/setup-local-agent-resources.sh to initialize Kubernetes Secrets.
#
# Optional local-development override. In a cluster, the Agent uses its
# ServiceAccount; outside a cluster, client-go uses KUBECONFIG or ~/.kube/config.
# kubeconfig_file: /path/to/kubeconfig

identity:
  # The Agent stores its issued client certificate and private key in this
  # persistent Kubernetes Secret. It survives Pod recreation.
  namespace: zke-system
  secret_name: zke-agent-identity
  # Renew the Agent client certificate over the authenticated QUIC connection
  # before it enters the final seven days of validity.
  renew_before: 168h

registration:
  # One-time local HTTP endpoint used to bootstrap the persistent Agent identity.
  server_url: http://127.0.0.1:8080
  # Agent reads the "token" key from the zke-agent-enrollment Kubernetes
  # Secret through client-go; no Token value or local file path lives in YAML.
  # Optional private CA for the HTTPS endpoint above, whether TLS terminates at
  # ZKE Server or a gateway. It is unused by the local HTTP endpoint.
  # ca_certificate_file: /path/to/registration-ca.crt
  timeout: 10s
  retry_initial_interval: 1s
  retry_max_interval: 15s

connection:
  # Dedicated QUIC/UDP endpoint; this is a host:port, not a URL.
  server_address: 127.0.0.1:8443
  # Agent reads "agent-listener-ca.crt" from the zke-agent-trust Kubernetes
  # Secret through client-go. Special deployments may override it with:
  # ca_certificate_file: /path/to/agent-listener-ca.crt
  connect_timeout: 10s
  retry_initial_interval: 1s
  retry_max_interval: 30s
  # QUIC transport settings. They apply when the connection is dialled, before
  # Server announces its application-level heartbeat timings, so they cannot be
  # derived from those. Keep idle_timeout above the Server heartbeat timeout, or
  # the transport tears down a connection the application still considers
  # healthy.
  idle_timeout: 15m
  keep_alive_interval: 10s
  # Total bidirectional Streams a Server may open towards this Agent. The
  # Agent-created Control Stream is counted by the Server, not here.
  max_incoming_streams: 128
  stream_header_timeout: 5s
  max_resource_request_timeout: 2m
  max_concurrent_resource_streams: 64
  max_resource_body_bytes: 33554432
  # Pod logs use a dedicated Stream type and do not weaken the generic
  # Resource protocol's Subresource deny rule.
  max_pod_logs_stream_timeout: 30m
  max_concurrent_pod_logs_streams: 8
  max_pod_log_bytes: 16777216

  # Interactive Pod terminal Streams use a fixed /bin/sh command. Input and
  # output limits apply to the complete terminal session.
  max_pod_exec_stream_timeout: 15m
  max_concurrent_pod_exec_streams: 4
  max_pod_exec_input_bytes: 16777216
  max_pod_exec_output_bytes: 33554432
  # Pod Port Forward is an independent binary Stream. These are transport
  # ceilings; Server applies lower limits to raw client sessions.
  max_pod_port_forward_stream_timeout: 1h
  max_concurrent_pod_port_forward_streams: 4
  max_pod_port_forward_client_bytes: 1073741824
  max_pod_port_forward_pod_bytes: 1073741824
  # Resource Watch currently permits core/v1/events only. Its concurrency and
  # timeout budgets are independent from Pod logs.
  max_resource_watch_stream_timeout: 30m
  max_concurrent_resource_watch_streams: 16

log_level: info
