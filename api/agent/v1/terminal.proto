syntax = "proto3";

package zke.agent.v1;

option go_package = "github.com/togettoyou/zke/api/agent/v1;agentv1";

import "api/agent/v1/stream.proto";

enum TerminalSessionAction {
  TERMINAL_SESSION_ACTION_UNSPECIFIED = 0;
  TERMINAL_SESSION_ACTION_CREATE = 1;
  TERMINAL_SESSION_ACTION_DELETE = 2;
}

message TerminalSessionRequest {
  TerminalSessionAction action = 1;
  string session_id = 2;
  string user_id = 3;
  string namespace = 4;
  repeated string permissions = 5;
  uint64 ttl_seconds = 6;
  string image = 7;
  string image_pull_policy = 8;
  // How much of the Cluster one session Pod may take. The Agent used to hold
  // these as constants, which made the budget of a workload running in the
  // operator's own Cluster the one thing about it they could not change.
  //
  // An empty quantity means the entry is left off the container: Kubernetes has
  // no other spelling for "no limit", and a Namespace governed by a LimitRange
  // needs to be able to defer to it.
  string cpu_request = 9;
  string memory_request = 10;
  string cpu_limit = 11;
  string memory_limit = 12;
  // Uses a localhost kubectl proxy sidecar and does not mount the projected
  // ServiceAccount credential into the command container. This is required
  // for AIOps command output, which is persisted and sent to the model.
  bool credential_proxy = 13;
}

message TerminalSessionResponse {
  ResultCode result = 1;
  uint32 kubernetes_status_code = 2;
  string reason = 3;
  string message = 4;
  string session_id = 5;
  string namespace = 6;
  string pod_name = 7;
  string pod_uid = 8;
  string container = 9;
  int64 expires_at_unix = 10;
}
