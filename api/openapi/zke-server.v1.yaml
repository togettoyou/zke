      - $ref: "#/components/parameters/AISessionID"
    delete:
      tags: [AIOps]
      operationId: cancelAITurn
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "200":
          description: 已请求取消后台运行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai/sessions/{session_id}/turns/{turn}/feedback:
    parameters:
      - $ref: "#/components/parameters/AISessionID"
      - name: turn
        in: path
        required: true
        schema: { type: integer, format: int32, minimum: 1 }
    get:
      tags: [AIOps]
      operationId: getAITurnFeedback
      description: 读取当前用户对本人会话中一个成功 Turn 的反馈；尚未反馈时 data.feedback 为 null。
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 用户反馈或空值
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [feedback]
                        properties:
                          feedback:
                            oneOf:
                              - $ref: "#/components/schemas/AITurnFeedback"
                              - type: "null"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [AIOps]
      operationId: saveAITurnFeedback
      description: 新建或替换当前用户对本人一个成功 Turn 的反馈；不修改 append-only 轨迹。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AITurnFeedbackUpdate" }
      responses:
        "200":
          description: 已保存的反馈
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/AITurnFeedback" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai/sessions/{session_id}/approvals:
    parameters:
      - $ref: "#/components/parameters/AISessionID"
    post:
      tags: [AIOps]
      operationId: decideAIApproval
      description: >-
        答复一次被审批模式拦下的工具调用。批准与拒绝都会写入轨迹；
        拒绝不是运行失败，模型会收到明确的拒绝说明并继续本轮。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIApprovalDecision" }
      responses:
        "200":
          description: 已把决定交给正在等待的运行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: "null" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai/sessions/{session_id}/trajectory:
    parameters:
      - $ref: "#/components/parameters/AISessionID"
      - name: after_sequence
        in: query
        schema: { type: integer, format: int32, minimum: 0, default: 0 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    get:
      tags: [AIOps]
      operationId: listAITrajectory
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 当前权限重验与脱敏后的增量轨迹
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [entries]
                        properties:
                          entries:
                            type: array
                            items: { $ref: "#/components/schemas/AITrajectoryEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai/sessions/{session_id}/context:
    parameters:
      - $ref: "#/components/parameters/AISessionID"
    get:
      tags: [AIOps]
      operationId: getAIContextUsage
      description: >-
        会话当前占用的模型上下文。总量优先使用端点自己报告的用量作为锚点，再对锚点之后新增的内容做本地估算；
        system、tools 与 messages 三项拆分始终是本地估算，用于解释总量而不参与任何判定。
        阈值来自 Server 配置中的压缩比例与端点上下文窗口，未配置模型端点时返回 409。
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 当前会话的上下文占用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required:
                          [
                            used_tokens,
                            context_window_tokens,
                            threshold_tokens,
                            system_tokens,
                            tools_tokens,
                            message_tokens,
                            measured,
                          ]
                        properties:
                          used_tokens: { type: integer }
                          context_window_tokens: { type: integer }
                          threshold_tokens: { type: integer }
                          system_tokens: { type: integer }
                          tools_tokens: { type: integer }
                          message_tokens: { type: integer }
                          measured:
                            type: boolean
                            description: 总量是否锚定在端点报告的用量上
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ai/sessions/{session_id}/events:
    parameters:
      - $ref: "#/components/parameters/AISessionID"
      - name: after_sequence
        in: query
        schema: { type: integer, format: int32, minimum: 0, default: 0 }
    get:
      tags: [AIOps]
      operationId: streamAITrajectory
      description: >-
        trajectory 事件的 SSE id 等于持久化轨迹序号，重连通过 Last-Event-ID 或 after_sequence 精确续传。
        delta 事件是模型正在产生的正文，没有 id、不会重放，也不是记录；对应步骤的 model 轨迹事件才是。
        delta 的 kind 为 reset 时表示该步骤的请求正在重发，此前收到的增量应当丢弃。
        session 事件在会话标题、状态或归档状态变化时发送，正文与会话对象相同。安静期发送注释心跳。
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: "ready、session、trajectory、delta 与 close 事件流"
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai/sessions/{session_id}/attachments:
    parameters:
      - $ref: "#/components/parameters/AISessionID"
    get:
      tags: [AIOps]
      operationId: listAIAttachments
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 会话的附件元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [attachments]
                        properties:
                          attachments:
                            type: array
                            items: { $ref: "#/components/schemas/AIAttachment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [AIOps]
      operationId: createAIAttachment
      description: 只接受不超过 256 KiB 的文本、Markdown、JSON 或 YAML，作为不可信数据进入模型上下文。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIAttachmentCreate" }
      responses:
        "201":
          description: 已保存的附件元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/AIAttachment" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ai/sessions/{session_id}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/AISessionID"
      - name: attachment_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    delete:
      tags: [AIOps]
