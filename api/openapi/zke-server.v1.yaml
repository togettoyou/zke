          $ref: "#/components/schemas/KubernetesMutationOptions"
        confirm:
          type: boolean
          description: 实际写入必须为 true；dry-run 可以为 false。
    KubernetesUpdateResourceRequest:
      type: object
      additionalProperties: false
      required: [object, confirm]
      properties:
        object:
          $ref: "#/components/schemas/KubernetesUnstructuredResource"
        options:
          $ref: "#/components/schemas/KubernetesMutationOptions"
        confirm:
          type: boolean
          description: 实际写入必须为 true；dry-run 可以为 false。
    KubernetesPatchResourceRequest:
      type: object
      additionalProperties: false
      required: [patch_type, patch, confirm]
      properties:
        patch_type:
          type: string
          enum: [json, merge, strategic-merge, apply]
        patch:
          description: 与 patch_type 对应的 JSON Patch 数组或 JSON 对象。
        options:
          $ref: "#/components/schemas/KubernetesMutationOptions"
        confirm:
          type: boolean
          description: 实际写入必须为 true；dry-run 可以为 false。
    KubernetesDeletePreconditions:
      type: object
      additionalProperties: false
      properties:
        uid:
          type: string
          maxLength: 128
        resource_version:
          type: string
          maxLength: 256
    KubernetesDeleteResourceRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际删除必须为 true；dry-run 可以为 false。
        grace_period_seconds:
          type: [integer, "null"]
          minimum: 0
        propagation_policy:
          type: string
          enum: ["", orphan, background, foreground]
        preconditions:
          $ref: "#/components/schemas/KubernetesDeletePreconditions"
    KubernetesMutationResult:
      type: object
      additionalProperties: false
      required: [resource, dry_run]
      properties:
        resource:
          $ref: "#/components/schemas/KubernetesUnstructuredResource"
        dry_run:
          type: boolean
    KubernetesDeleteResult:
      type: object
      additionalProperties: false
      required: [deleted, dry_run, target]
      properties:
        deleted:
          type: boolean
        dry_run:
          type: boolean
        target:
          type: string
    KubernetesWorkloadResource:
      type: string
      enum: [deployments, statefulsets, daemonsets, jobs, cronjobs]
    KubernetesWorkloadObjectKeyRef:
      type: object
      additionalProperties: false
      required: [name, key]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        key:
          type: string
          minLength: 1
        optional:
          type: [boolean, "null"]
    # 字面值与引用互斥：Kubernetes 不接受 value 与 valueFrom 同时出现。
    KubernetesWorkloadEnvVar:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: C_IDENTIFIER 形式的变量名，同一容器内不得重复。
        value:
          type: string
          maxLength: 32768
        config_map_key_ref:
          $ref: "#/components/schemas/KubernetesWorkloadObjectKeyRef"
        secret_key_ref:
          $ref: "#/components/schemas/KubernetesWorkloadObjectKeyRef"
    # 保持为 quantity map 而不是 CPU/内存四个具名字段：GPU 等扩展资源因此无需新增
    # 字段即可声明。键为 Kubernetes 资源名，值为 Kubernetes quantity。
    KubernetesWorkloadResourceRequirements:
      type: object
      additionalProperties: false
      description: 同名资源的 requests 不得大于 limits。
      properties:
        requests:
          $ref: "#/components/schemas/KubernetesPolicyQuantityMap"
        limits:
          $ref: "#/components/schemas/KubernetesPolicyQuantityMap"
    KubernetesWorkloadVolumeMount:
      type: object
      additionalProperties: false
      required: [name, mount_path]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: 必须引用同一请求中声明的数据卷名称。
        mount_path:
          type: string
          minLength: 1
          maxLength: 4096
          description: 必须是绝对路径，且不能包含冒号；同一容器内不得重复。
        sub_path:
          type: string
          maxLength: 4096
          description: 相对路径；绝对路径和 .. 会越出所选数据卷，接口拒绝。
        read_only:
          type: boolean
    KubernetesWorkloadExecAction:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
    KubernetesWorkloadHTTPGetAction:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        path:
          type: string
          maxLength: 4096
        port:
          type: string
          minLength: 1
          description: 端口号（1-65535）或已命名容器端口的名称。
        host:
          type: string
          maxLength: 4096
        scheme:
          type: string
          enum: ["", HTTP, HTTPS]
    KubernetesWorkloadTCPSocketAction:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        port:
          type: string
          minLength: 1
    # exec、http_get、tcp_socket 三者必须且只能设置一个：没有处理器的探针不会执行，
    # 两个处理器的探针没有确定语义。
    KubernetesWorkloadProbe:
      type: object
      additionalProperties: false
      properties:
        exec:
          $ref: "#/components/schemas/KubernetesWorkloadExecAction"
        http_get:
          $ref: "#/components/schemas/KubernetesWorkloadHTTPGetAction"
        tcp_socket:
          $ref: "#/components/schemas/KubernetesWorkloadTCPSocketAction"
        initial_delay_seconds:
          type: [integer, "null"]
          format: int32
          minimum: 0
        period_seconds:
          type: [integer, "null"]
          format: int32
          minimum: 1
        timeout_seconds:
          type: [integer, "null"]
          format: int32
          minimum: 1
        success_threshold:
          type: [integer, "null"]
          format: int32
          minimum: 1
        failure_threshold:
          type: [integer, "null"]
          format: int32
          minimum: 1
    KubernetesWorkloadLifecycleHandler:
      type: object
      additionalProperties: false
      properties:
        exec:
          $ref: "#/components/schemas/KubernetesWorkloadExecAction"
        http_get:
          $ref: "#/components/schemas/KubernetesWorkloadHTTPGetAction"
    KubernetesWorkloadLifecycle:
      type: object
      additionalProperties: false
      properties:
        post_start:
          $ref: "#/components/schemas/KubernetesWorkloadLifecycleHandler"
        pre_stop:
          $ref: "#/components/schemas/KubernetesWorkloadLifecycleHandler"
    KubernetesWorkloadContainerPort:
      type: object
      additionalProperties: false
      required: [container_port]
      properties:
        name:
          type: string
          maxLength: 15
          description: 可选的 IANA service name；同一容器内不可重复。
        container_port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: ["", TCP, UDP, SCTP]
          description: 空字符串与 TCP 等价。
    KubernetesWorkloadLabelSelector:
      type: object
      additionalProperties: false
      properties:
        match_labels:
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
        match_expressions:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadSelectorRequirement"
    KubernetesWorkloadNodeSelectorRequirement:
      type: object
      additionalProperties: false
      required: [key, operator]
      properties:
        key:
          type: string
        operator:
          type: string
          enum: [In, NotIn, Exists, DoesNotExist, Gt, Lt]
        values:
          type: array
          maxItems: 50
          items:
            type: string
    KubernetesWorkloadNodeSelectorTerm:
      type: object
      additionalProperties: false
      properties:
        match_expressions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadNodeSelectorRequirement"
        match_fields:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadNodeSelectorRequirement"
    KubernetesWorkloadPreferredNodeSelectorTerm:
      type: object
      additionalProperties: false
      required: [weight, preference]
      properties:
        weight:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        preference:
          $ref: "#/components/schemas/KubernetesWorkloadNodeSelectorTerm"
    KubernetesWorkloadNodeAffinity:
      type: object
      additionalProperties: false
      properties:
        required:
          type: array
          maxItems: 50
          description: 多个 term 之间为 OR；一个 term 内的表达式为 AND。
          items:
            $ref: "#/components/schemas/KubernetesWorkloadNodeSelectorTerm"
        preferred:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadPreferredNodeSelectorTerm"
    KubernetesWorkloadPodAffinityTerm:
      type: object
      additionalProperties: false
      required: [topology_key]
      properties:
        label_selector:
          $ref: "#/components/schemas/KubernetesWorkloadLabelSelector"
        namespace_selector:
          $ref: "#/components/schemas/KubernetesWorkloadLabelSelector"
        namespaces:
          type: array
          maxItems: 50
          items:
            type: string
        topology_key:
          type: string
          minLength: 1
        match_label_keys:
          type: array
          maxItems: 50
          items:
            type: string
        mismatch_label_keys:
          type: array
          maxItems: 50
          items:
            type: string
    KubernetesWorkloadWeightedPodAffinityTerm:
      type: object
      additionalProperties: false
      required: [weight, pod_term]
      properties:
        weight:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        pod_term:
          $ref: "#/components/schemas/KubernetesWorkloadPodAffinityTerm"
    KubernetesWorkloadPodAffinity:
      type: object
      additionalProperties: false
      properties:
        required:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadPodAffinityTerm"
        preferred:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadWeightedPodAffinityTerm"
    KubernetesWorkloadAffinity:
      type: object
      additionalProperties: false
      properties:
        node_affinity:
          $ref: "#/components/schemas/KubernetesWorkloadNodeAffinity"
        pod_affinity:
          $ref: "#/components/schemas/KubernetesWorkloadPodAffinity"
        pod_anti_affinity:
          $ref: "#/components/schemas/KubernetesWorkloadPodAffinity"
    KubernetesWorkloadTopologySpreadConstraint:
      type: object
      additionalProperties: false
      required: [max_skew, topology_key, when_unsatisfiable]
      properties:
        max_skew:
          type: integer
          format: int32
          minimum: 1
        topology_key:
          type: string
          minLength: 1
        when_unsatisfiable:
          type: string
          enum: [DoNotSchedule, ScheduleAnyway]
        label_selector:
          $ref: "#/components/schemas/KubernetesWorkloadLabelSelector"
        min_domains:
          type: [integer, "null"]
          format: int32
          minimum: 1
          description: 仅 DoNotSchedule 接受。
        node_affinity_policy:
          type: string
          enum: ["", Honor, Ignore]
        node_taints_policy:
          type: string
          enum: ["", Honor, Ignore]
        match_label_keys:
          type: array
          maxItems: 50
          items:
            type: string
    KubernetesWorkloadContainerTemplate:
      type: object
      additionalProperties: false
      required: [name, image]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          description: Pod 内唯一的 DNS label 容器名；主容器与初始化容器之间也不得重复。
        image:
          type: string
          minLength: 1
          maxLength: 2048
        image_pull_policy:
          type: string
          enum: ["", Always, IfNotPresent, Never]
          description: 空字符串表示交由 Kubernetes 默认处理。
        command:
          type: array
          maxItems: 100
          items:
            type: string
          description: 覆盖镜像的 ENTRYPOINT。
        args:
          type: array
          maxItems: 100
          items:
            type: string
          description: 覆盖镜像的 CMD。
        working_dir:
          type: string
          maxLength: 4096
        env:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/KubernetesWorkloadEnvVar"
        resources:
          $ref: "#/components/schemas/KubernetesWorkloadResourceRequirements"
        volume_mounts:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadVolumeMount"
        liveness_probe:
          $ref: "#/components/schemas/KubernetesWorkloadProbe"
        readiness_probe:
          $ref: "#/components/schemas/KubernetesWorkloadProbe"
        lifecycle:
          $ref: "#/components/schemas/KubernetesWorkloadLifecycle"
        privileged:
          type: [boolean, "null"]
          description: 仅 true 会被写入 securityContext；false 与省略等价。
        ports:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/KubernetesWorkloadContainerPort"
          description: 仅声明容器端口；hostPort 与 hostIP 仍通过 YAML 管理。
    KubernetesWorkloadEmptyDirVolume:
      type: object
      additionalProperties: false
      properties:
        medium:
          type: string
          enum: ["", Memory]
        size_limit:
          type: string
          description: Kubernetes quantity，例如 512Mi。
    KubernetesWorkloadHostPathVolume:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: 必须是绝对路径。
        type:
          type: string
          enum:
            [
              "",
              DirectoryOrCreate,
              Directory,
              FileOrCreate,
              File,
              Socket,
              CharDevice,
              BlockDevice,
            ]
    KubernetesWorkloadConfigMapVolume:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        default_mode:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 511
        optional:
          type: [boolean, "null"]
    # 只传递引用：ZKE 不读取也不返回 Secret 正文，这里与 Ingress 引用 TLS Secret 同理。
    KubernetesWorkloadSecretVolume:
      type: object
      additionalProperties: false
      required: [secret_name]
      properties:
        secret_name:
          type: string
          minLength: 1
          maxLength: 253
        default_mode:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 511
        optional:
          type: [boolean, "null"]
    KubernetesWorkloadPersistentVolumeClaimVolume:
      type: object
      additionalProperties: false
      required: [claim_name]
      properties:
        claim_name:
          type: string
          minLength: 1
          maxLength: 253
        read_only:
          type: boolean
    KubernetesWorkloadNFSVolume:
      type: object
      additionalProperties: false
      required: [server, path]
      properties:
        server:
          type: string
          minLength: 1
          maxLength: 4096
        path:
          type: string
          minLength: 1
          maxLength: 4096
        read_only:
          type: boolean
    # 六种来源必须且只能设置一个。
    KubernetesWorkloadVolume:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
        empty_dir:
          $ref: "#/components/schemas/KubernetesWorkloadEmptyDirVolume"
        host_path:
          $ref: "#/components/schemas/KubernetesWorkloadHostPathVolume"
        config_map:
          $ref: "#/components/schemas/KubernetesWorkloadConfigMapVolume"
        secret:
          $ref: "#/components/schemas/KubernetesWorkloadSecretVolume"
        persistent_volume_claim:
          $ref: "#/components/schemas/KubernetesWorkloadPersistentVolumeClaimVolume"
        nfs:
          $ref: "#/components/schemas/KubernetesWorkloadNFSVolume"
    KubernetesWorkloadToleration:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          description: 留空只在 operator 为 Exists 时有效，表示容忍全部污点。
        operator:
          type: string
          enum: ["", Equal, Exists]
        value:
          type: string
          description: operator 为 Exists 时必须留空。
        effect:
          type: string
          enum: ["", NoSchedule, PreferNoSchedule, NoExecute]
        toleration_seconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 只有 NoExecute 会驱逐，因此只有它接受该字段。
    KubernetesCreateWorkloadRequest:
      type: object
      additionalProperties: false
      required: [name, containers, confirm]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          description: >-
            DNS 子域名。Job 最长 63 个字符，因为该名称会成为 Pod 的 job-name 标签值；
            CronJob 最长 52 个字符，需要为控制器派生的 Job 名称留出余量。
        labels:
          type: object
          additionalProperties:
            type: string
          description: zke.io/workload-id 为 Server 保留键，不接受客户端设置。
        annotations:
          type: object
          additionalProperties:
            type: string
          description: zke.io/description 为 description 字段保留，不接受在此设置。
        description:
          type: string
          maxLength: 1000
          description: 写入工作负载与 Pod 模板的 zke.io/description 注解。
        containers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/KubernetesWorkloadContainerTemplate"
        init_containers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/KubernetesWorkloadContainerTemplate"
          description: >-
            在主容器之前运行完毕，因此不接受 liveness_probe、readiness_probe 和 lifecycle；
            容器名在主容器与初始化容器之间不得重复。
        volumes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadVolume"
          description: 容器的 volume_mounts 只能引用这里声明的名称。
        image_pull_secrets:
          type: array
          maxItems: 20
          items:
            type: string
          description: 只传递 Secret 名称引用，不读取 Secret 正文。
        node_selector:
          type: object
          additionalProperties:
            type: string
          description: 按节点标签精确匹配；复杂规则使用 affinity。
        tolerations:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadToleration"
        affinity:
          $ref: "#/components/schemas/KubernetesWorkloadAffinity"
        topology_spread_constraints:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadTopologySpreadConstraint"
        replicas:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Deployment 和 StatefulSet 可用；省略时交由 Kubernetes 默认处理。
        service_name:
          type: string
          maxLength: 63
          description: StatefulSet 必填，且必须引用同一 Namespace 中预先存在的 Service。
        parallelism:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Job 和 CronJob 的 Job Template 可用。
        completions:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Job 和 CronJob 的 Job Template 可用。
        backoff_limit:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Job 和 CronJob 的 Job Template 可用。
        ttl_seconds_after_finished:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Job 和 CronJob 的 Job Template 可用。
        schedule:
          type: string
          minLength: 1
          maxLength: 512
          description: CronJob 必填的 Kubernetes Cron 表达式。
        time_zone:
          type: string
          maxLength: 128
          description: 仅 CronJob 可用；空字符串表示使用 kube-controller-manager 的本地时区。
        suspend:
          type: [boolean, "null"]
          description: 仅 CronJob 可用；省略时交由 Kubernetes 默认处理。
        concurrency_policy:
          type: string
          enum: ["", Allow, Forbid, Replace]
          description: 仅 CronJob 可用；空字符串表示交由 Kubernetes 默认处理。
        starting_deadline_seconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 仅 CronJob 可用。
        successful_jobs_history_limit:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 CronJob 可用。
        failed_jobs_history_limit:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 CronJob 可用。
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际创建必须为 true；dry-run 可以为 false。
    # Same modeled fields as a create, because an edit form is the create form on
    # an existing object. Fields outside them — hostPort、ServiceAccount、
    # securityContext 其余字段等 —— 由服务端从当前对象保留，不会被本请求清除。
    # containers 对 Deployment、StatefulSet、DaemonSet 和 CronJob 必填；Job 的 Pod
    # 模板不可变，只接受 parallelism 与 ttl_seconds_after_finished。
    KubernetesUpdateWorkloadRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, confirm]
      properties:
        uid:
          type: string
          minLength: 1
          description: 打开编辑时对象的 UID；不匹配则返回 409，而不是覆盖同名重建的对象。
        resource_version:
          type: string
          minLength: 1
          description: 打开编辑时对象的 resourceVersion；期间对象若已变化，更新被拒绝而不是覆盖。
        labels:
          type: object
          additionalProperties:
            type: string
          description: zke.io/workload-id 为 Server 保留键，不接受客户端设置。
        annotations:
          type: object
          additionalProperties:
            type: string
          description: zke.io/description 为 description 字段保留，不接受在此设置。
        description:
          type: string
          maxLength: 1000
          description: 写入工作负载与 Pod 模板的 zke.io/description 注解。
        containers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/KubernetesWorkloadContainerTemplate"
        init_containers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/KubernetesWorkloadContainerTemplate"
          description: >-
            在主容器之前运行完毕，因此不接受 liveness_probe、readiness_probe 和 lifecycle；
            容器名在主容器与初始化容器之间不得重复。
        volumes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadVolume"
          description: 容器的 volume_mounts 只能引用这里声明的名称。
        image_pull_secrets:
          type: array
          maxItems: 20
          items:
            type: string
          description: 只传递 Secret 名称引用，不读取 Secret 正文。
        node_selector:
          type: object
          additionalProperties:
            type: string
          description: 按节点标签精确匹配；复杂规则使用 affinity。
        tolerations:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadToleration"
        affinity:
          $ref: "#/components/schemas/KubernetesWorkloadAffinity"
          description: 省略时更新保留当前值；空对象显式清除。
        topology_spread_constraints:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/KubernetesWorkloadTopologySpreadConstraint"
          description: 省略时更新保留当前值；空数组显式清除。
        replicas:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Deployment 和 StatefulSet 可用；省略时交由 Kubernetes 默认处理。
        service_name:
          type: string
          maxLength: 63
          description: StatefulSet 必填，且必须引用同一 Namespace 中预先存在的 Service。
        parallelism:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Job 和 CronJob 的 Job Template 可用。
        completions:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Job 和 CronJob 的 Job Template 可用。
        backoff_limit:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Job 和 CronJob 的 Job Template 可用。
        ttl_seconds_after_finished:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 Job 和 CronJob 的 Job Template 可用。
        schedule:
          type: string
          minLength: 1
          maxLength: 512
          description: CronJob 必填的 Kubernetes Cron 表达式。
        time_zone:
          type: string
          maxLength: 128
          description: 仅 CronJob 可用；空字符串表示使用 kube-controller-manager 的本地时区。
        suspend:
          type: [boolean, "null"]
          description: 仅 CronJob 可用；省略时交由 Kubernetes 默认处理。
        concurrency_policy:
          type: string
          enum: ["", Allow, Forbid, Replace]
          description: 仅 CronJob 可用；空字符串表示交由 Kubernetes 默认处理。
        starting_deadline_seconds:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 仅 CronJob 可用。
        successful_jobs_history_limit:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 CronJob 可用。
        failed_jobs_history_limit:
          type: [integer, "null"]
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 仅 CronJob 可用。
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际更新必须为 true；dry-run 可以为 false。
    KubernetesWorkloadMutationRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际写入必须为 true；dry-run 可以为 false。
    KubernetesScaleWorkloadRequest:
      type: object
      additionalProperties: false
      required: [replicas, confirm]
      properties:
        replicas:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际写入必须为 true；dry-run 可以为 false。
    KubernetesDeleteWorkloadRequest:
      type: object
      additionalProperties: false
      required: [uid, confirm]
      properties:
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际删除必须为 true；dry-run 可以为 false。
        uid:
          type: string
          minLength: 1
          maxLength: 128
          description: 必填的 Kubernetes UID 删除前置条件，防止误删同名重建对象。
        resource_version:
          type: string
          maxLength: 256
        grace_period_seconds:
          type: [integer, "null"]
          minimum: 0
        propagation_policy:
          type: string
          enum: ["", orphan, background, foreground]
    KubernetesRollbackWorkloadRequest:
      type: object
      additionalProperties: false
      required: [revision, uid, resource_version, confirm]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: 目标修订号，取自同一对象的修订历史。
        uid:
          type: string
          minLength: 1
          maxLength: 128
          description: 读取修订历史时该工作负载的 UID 前置条件。
        resource_version:
          type: string
          minLength: 1
          maxLength: 256
          description: 读取修订历史时该工作负载的 resourceVersion 前置条件。
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际写入必须为 true；dry-run 可以为 false。
    KubernetesWorkloadRevisionPage:
      type: object
      additionalProperties: false
      required: [revisions, truncated]
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesWorkloadRevision"
        truncated:
          type: boolean
          description: 集群中的修订对象超过单页上限时为 true，返回的不一定是全部修订。
    KubernetesWorkloadRevision:
      type: object
      additionalProperties: false
      required:
        [
          revision,
          name,
          uid,
          creation_timestamp,
          current,
          images,
          containers,
          init_containers,
        ]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          description: 承载该修订的 ReplicaSet 或 ControllerRevision 名称。
        uid:
          type: string
        creation_timestamp:
          type: string
          format: date-time
        current:
          type: boolean
          description: 该修订的 Pod 模板是否就是当前运行的模板。
        change_cause:
          type: string
          description: 对象上的 kubernetes.io/change-cause 注解；回滚不会恢复它。
        images:
          type: array
          items:
            type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesWorkloadRevisionContainer"
        init_containers:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesWorkloadRevisionContainer"
    KubernetesWorkloadRevisionContainer:
      type: object
      additionalProperties: false
      required: [name, image]
      properties:
        name:
          type: string
        image:
          type: string
    KubernetesWorkloadMutationResult:
      type: object
      additionalProperties: false
      required: [workload, dry_run]
      properties:
        workload:
          $ref: "#/components/schemas/KubernetesWorkloadDetail"
        dry_run:
          type: boolean
    KubernetesWorkloadReplicaStatus:
      type: object
      additionalProperties: false
      required: [desired, current, updated, ready, available, unavailable]
      properties:
        desired:
          type: integer
          minimum: 0
        current:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        unavailable:
          type: integer
          minimum: 0
    KubernetesWorkloadJobStatus:
      type: object
      additionalProperties: false
      required: [active, succeeded, failed]
      properties:
        parallelism:
          type: integer
          minimum: 0
        completions:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        start_time:
          $ref: "#/components/schemas/Timestamp"
        completion_time:
          $ref: "#/components/schemas/Timestamp"
    KubernetesWorkloadCronJobStatus:
      type: object
      additionalProperties: false
      required: [schedule, suspend, active]
      properties:
        schedule:
          type: string
        suspend:
          type: boolean
        active:
          type: integer
          minimum: 0
        last_schedule_time:
          $ref: "#/components/schemas/Timestamp"
        last_successful_time:
          $ref: "#/components/schemas/Timestamp"
    KubernetesWorkloadSummary:
      type: object
      additionalProperties: false
      required:
        - resource
        - api_version
        - kind
        - namespace
        - name
        - uid
        - resource_version
        - creation_timestamp
        - generation
        - observed_generation
        - labels
        - status
        - images
      properties:
        resource:
          $ref: "#/components/schemas/KubernetesWorkloadResource"
        api_version:
          type: string
          enum: [apps/v1, batch/v1]
        kind:
          type: string
          enum: [Deployment, StatefulSet, DaemonSet, Job, CronJob]
        namespace:
          type: string
          minLength: 1
          maxLength: 63
        name:
          type: string
          minLength: 1
          maxLength: 253
        uid:
          type: string
        resource_version:
          type: string
        creation_timestamp:
          $ref: "#/components/schemas/Timestamp"
        generation:
          type: integer
          minimum: 0
        observed_generation:
          type: integer
          minimum: 0
          description: Job 与 CronJob 当前返回 0，因为其 v1 Status 不提供该字段。
        labels:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          description: >-
            Server 归约出的单值。progress_deadline_exceeded 对应 Deployment 的
            Progressing=False / reason=ProgressDeadlineExceeded，即本次发布超过
            progressDeadlineSeconds 仍未完成；旧副本可能仍在正常提供服务。
          enum:
            - available
            - progressing
            - progress_deadline_exceeded
            - suspended
            - running
            - completed
            - failed
            - scheduled
            - pending
        images:
          type: array
          uniqueItems: true
          items:
            type: string
        replicas:
          $ref: "#/components/schemas/KubernetesWorkloadReplicaStatus"
        job:
          $ref: "#/components/schemas/KubernetesWorkloadJobStatus"
        cron_job:
          $ref: "#/components/schemas/KubernetesWorkloadCronJobStatus"
    KubernetesWorkloadPage:
      type: object
      additionalProperties: false
      required:
        - workloads
        - continue_token
        - resource_version
        - remaining_item_count
      properties:
        workloads:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesWorkloadSummary"
        continue_token:
          type: string
          description: Kubernetes 原生 opaque continuation token；空字符串表示没有下一页。
        resource_version:
          type: string
        remaining_item_count:
          type: [integer, "null"]
          minimum: 0
    KubernetesWorkloadSelectorRequirement:
      type: object
      additionalProperties: false
      required: [key, operator, values]
      properties:
        key:
          type: string
        operator:
          type: string
          enum: [In, NotIn, Exists, DoesNotExist]
        values:
          type: array
          items:
            type: string
    KubernetesWorkloadSelector:
      type: object
      additionalProperties: false
      required: [match_labels, match_expressions]
      properties:
        match_labels:
          type: object
          additionalProperties:
            type: string
        match_expressions:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesWorkloadSelectorRequirement"
    KubernetesWorkloadCondition:
      type: object
      additionalProperties: false
      required: [type, status, reason, message, last_transition_time]
      properties:
        type:
          type: string
        status:
          type: string
          enum: ["True", "False", Unknown]
        reason:
          type: string
        message:
          type: string
        last_transition_time:
          $ref: "#/components/schemas/Timestamp"
    KubernetesWorkloadDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesWorkloadSummary"
        - type: object
          required:
            - annotations
            - containers
            - init_containers
            - volumes
            - image_pull_secrets
            - node_selector
            - tolerations
            - topology_spread_constraints
            - conditions
            - strategy
            - min_ready_seconds
          properties:
            annotations:
              type: object
              additionalProperties:
                type: string
            selector:
              $ref: "#/components/schemas/KubernetesWorkloadSelector"
            containers:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesWorkloadContainerTemplate"
              description: >-
                与创建和更新提交的容器模板同形，因此编辑表单读到的就是它将要写回的。
                模板未建模的字段不在这里，也不会被更新清除。
            init_containers:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesWorkloadContainerTemplate"
            volumes:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesWorkloadVolume"
              description: >-
                本模板未建模的卷来源（projected、CSI、downward API 等）只返回名称，
                没有 source；更新时按名称保留集群中现有的来源。
            image_pull_secrets:
              type: array
              items:
                type: string
            node_selector:
              type: object
              additionalProperties:
                type: string
            tolerations:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesWorkloadToleration"
            affinity:
              $ref: "#/components/schemas/KubernetesWorkloadAffinity"
            topology_spread_constraints:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesWorkloadTopologySpreadConstraint"
            conditions:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesWorkloadCondition"
            strategy:
              type: string
            min_ready_seconds:
              type: integer
              minimum: 0
            revision_history_limit:
              type: integer
              minimum: 0
            service_name:
              type: string
            completion_mode:
              type: string
            concurrency_policy:
              type: string
            parallelism:
              type: integer
              minimum: 0
              description: >-
                Job 或 CronJob Job Template 声明的并行度，即编辑表单提交的值；
                Job 运行时的计数在 job 中。
            completions:
              type: integer
              minimum: 0
            backoff_limit:
              type: integer
              minimum: 0
            ttl_seconds_after_finished:
              type: integer
              minimum: 0
            time_zone:
              type: string
            starting_deadline_seconds:
              type: integer
              minimum: 0
            successful_jobs_history_limit:
              type: integer
              minimum: 0
            failed_jobs_history_limit:
              type: integer
              minimum: 0
    KubernetesNetworkingResource:
      type: string
      enum: [services, ingresses, gateways, httproutes, grpcroutes, tlsroutes, tcproutes, udproutes]
    KubernetesServicePort:
      type: object
      additionalProperties: false
      required: [name, protocol, app_protocol, port, target_port, node_port]
      properties:
        name: { type: string, maxLength: 15 }
        protocol: { type: string, enum: ["", TCP, UDP, SCTP] }
        app_protocol: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        target_port:
          type: string
          description: 数字端口的十进制文本或 Pod 端口名称；空字符串表示与 port 相同。
        node_port: { type: integer, minimum: 0, maximum: 65535 }
    KubernetesServiceSpec:
      type: object
      additionalProperties: false
      required:
        - type
        - headless
        - selector
        - ports
        - external_name
        - session_affinity
        - external_traffic_policy
        - internal_traffic_policy
        - publish_not_ready_addresses
      properties:
        type: { type: string, enum: ["", ClusterIP, NodePort, LoadBalancer, ExternalName] }
        headless: { type: boolean }
        selector:
          type: object
          additionalProperties: { type: string }
        ports:
          type: array
          maxItems: 100
          description: ExternalName 可为空；其他 Service 类型至少需要一个端口，最终由 Server 校验。
          items: { $ref: "#/components/schemas/KubernetesServicePort" }
        external_name: { type: string, maxLength: 253 }
        session_affinity: { type: string, enum: ["", None, ClientIP] }
        external_traffic_policy: { type: string, enum: ["", Cluster, Local] }
        internal_traffic_policy: { type: string, enum: ["", Cluster, Local] }
        publish_not_ready_addresses: { type: boolean }
        allocate_load_balancer_node_ports: { type: boolean }
    KubernetesLoadBalancerAddress:
      type: object
      additionalProperties: false
      required: [ip, hostname]
      properties:
        ip: { type: string }
        hostname: { type: string }
    KubernetesServiceView:
      type: object
      additionalProperties: false
      required: [spec, cluster_ips, ip_families, ip_family_policy, load_balancer_ingress]
      properties:
        spec: { $ref: "#/components/schemas/KubernetesServiceSpec" }
        cluster_ips:
          type: array
          items: { type: string }
        ip_families:
          type: array
          items: { type: string, enum: [IPv4, IPv6] }
        ip_family_policy: { type: string }
        load_balancer_ingress:
          type: array
          items: { $ref: "#/components/schemas/KubernetesLoadBalancerAddress" }
    KubernetesServicePortInput:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        name: { type: string, maxLength: 15 }
        protocol: { type: string, enum: ["", TCP, UDP, SCTP] }
        app_protocol: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        target_port: { type: string }
        node_port: { type: integer, minimum: 0, maximum: 65535 }
    KubernetesServiceSpecInput:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: ["", ClusterIP, NodePort, LoadBalancer, ExternalName] }
        headless: { type: boolean }
        selector:
          type: object
          additionalProperties: { type: string }
        ports:
          type: array
          maxItems: 100
          description: ExternalName 可为空；其他 Service 类型至少需要一个端口，最终由 Server 校验。
          items: { $ref: "#/components/schemas/KubernetesServicePortInput" }
        external_name: { type: string, maxLength: 253 }
        session_affinity: { type: string, enum: ["", None, ClientIP] }
        external_traffic_policy: { type: string, enum: ["", Cluster, Local] }
        internal_traffic_policy: { type: string, enum: ["", Cluster, Local] }
        publish_not_ready_addresses: { type: boolean }
        allocate_load_balancer_node_ports: { type: boolean }
    KubernetesIngressServiceBackend:
      type: object
      additionalProperties: false
      required: [name, port_name, port_number]
      properties:
        name: { type: string, minLength: 1, maxLength: 63 }
        port_name: { type: string, maxLength: 15 }
        port_number: { type: integer, minimum: 0, maximum: 65535 }
    KubernetesIngressPath:
      type: object
      additionalProperties: false
      required: [path, path_type, backend]
      properties:
        path: { type: string, maxLength: 4096 }
        path_type: { type: string, enum: [Exact, Prefix, ImplementationSpecific] }
        backend: { $ref: "#/components/schemas/KubernetesIngressServiceBackend" }
    KubernetesIngressRule:
      type: object
      additionalProperties: false
      required: [host, paths]
      properties:
        host: { type: string, maxLength: 253 }
        paths:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/KubernetesIngressPath" }
    KubernetesIngressTLS:
      type: object
      additionalProperties: false
      required: [hosts, secret_name]
      properties:
        hosts:
          type: array
          items: { type: string, maxLength: 253 }
        secret_name: { type: string, maxLength: 253 }
    KubernetesIngressSpec:
      type: object
      additionalProperties: false
      required: [ingress_class_name, rules, tls]
      properties:
        ingress_class_name: { type: string, maxLength: 253 }
        default_backend: { $ref: "#/components/schemas/KubernetesIngressServiceBackend" }
        rules:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/KubernetesIngressRule" }
        tls:
          type: array
          items: { $ref: "#/components/schemas/KubernetesIngressTLS" }
    KubernetesIngressView:
      type: object
      additionalProperties: false
      required: [spec, load_balancer_ingress]
      properties:
        spec: { $ref: "#/components/schemas/KubernetesIngressSpec" }
        load_balancer_ingress:
          type: array
          items: { $ref: "#/components/schemas/KubernetesLoadBalancerAddress" }
    KubernetesIngressServiceBackendInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 63 }
        port_name: { type: string, minLength: 1, maxLength: 15 }
        port_number: { type: integer, minimum: 1, maximum: 65535 }
