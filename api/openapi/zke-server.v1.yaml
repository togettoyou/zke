  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/networking/{network_resource}:
    get:
      tags: [Resources]
      operationId: listKubernetesNetworkingResources
      description: |
        在明确的 Cluster 和 Namespace 中查询 Service、Ingress、Gateway 或协议型 Route。
        Gateway/HTTPRoute/GRPCRoute/TLSRoute 使用 `gateway.networking.k8s.io/v1`，
        TCPRoute/UDPRoute 使用 `v1alpha2`；目标集群未提供路径指定的资源与版本时返回
        409 `gateway_api_unavailable`。ZKE 不安装 CRD。分页使用 Kubernetes continuation token。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/NetworkResource"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: continue
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: label_selector
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: field_selector
          in: query
          schema: { type: string, maxLength: 4096 }
      responses:
        "200":
          description: 指定类型的服务或路由资源列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesNetworkingResourcePage"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
    post:
      tags: [Resources]
      operationId: createKubernetesNetworkingResource
      description: |
        创建路径指定的 Service、Ingress、Gateway 或 Gateway API Route。请求必须只携带与路径类型对应的
        `service`、`ingress`、`gateway` 或 `gateway_route` 配置。Route 的 `spec` 使用
        Kubernetes 原生 camelCase 字段并按路径类型严格解码，未知字段会被拒绝。实际创建要求显式确认；dry-run 使用
        Kubernetes 服务端校验，不会持久化对象。Gateway API 不由 ZKE 自动安装。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/NetworkResource"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KubernetesCreateNetworkingResourceRequest"
      responses:
        "200":
          description: DryRun 预览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/KubernetesNetworkingMutationResult" }
        "201":
          description: 已创建的服务或路由资源
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/KubernetesNetworkingMutationResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
