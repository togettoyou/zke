      description: |
        列出本 Server 提供的具名指标查询。Console 只能调用这些查询，不能提交
        PromQL：作用域过滤是查询模板的一部分，而不是对用户输入的事后改写。

        该目录描述系统能力，不包含任何集群数据，因此只要求已认证会话。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 可用的指标查询目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsQueryCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/observability/metrics/query:
    get:
      tags: [Resources]
      operationId: runObservabilityMetricsQuery
      description: |
        执行一个具名指标查询。每次查询针对一个集群：`cluster_id` 必填，Server 校验
        调用者在 `cluster.metrics.read` 上确实可以读取它，再把它作为强制过滤
        （`zke_cluster_id="<id>"` 精确匹配）注入查询模板，调用方参数无法覆盖。

        一次一个集群，与容器服务操作一个集群是同一个理由：把两个集群的曲线加在一起
        得到的是一个不存在的数，把它们画在共享坐标轴上则是把两个问题塞进一张图。

        目标集群不可读时返回 403，且不区分“不存在”与“不属于你”——区分它们会让这个
        接口变成探测范围外集群 ID 的手段。

        缺失采样点在响应中显式为 `null`，不做插值：数据空洞是采集中断的证据，补齐会
        把中断显示成平线。时间戳为秒级 Unix 时间，数值已按 `unit` 换算。

        `namespace` 与 `top` 是否可用由查询目录声明。对不支持的查询传 `namespace`、
        或对 `requires_top` 的查询省略 `top`，都返回 400 而不是忽略该参数。
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
        - name: cluster_id
          in: query
          required: true
          description: 目标集群。每次查询只描述一个集群。
          schema:
            $ref: "#/components/schemas/UUID"
        - name: namespace
          in: query
          schema:
            type: string
            maxLength: 63
        - name: start
          in: query
          description: >-
            范围查询的起点。会向前对齐到 step_seconds 的整数倍，与指标存储回答范围查询所用的网格一致；
            响应中的 start 是实际生效的起点。
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
        - name: step_seconds
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 86400
        - name: top
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: 查询结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsQueryResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/metrics-collector:
    get:
      tags: [Resources]
      operationId: getClusterMetricsCollector
      description: |
        报告目标集群中采集组件的当前状态。答案来自集群本身而不是 Server 的记录：
        重要的是那里现在跑着什么，Server 侧的标记会在有人手工删除 Deployment 后失真。

        采集组件安装在该集群的 Agent Namespace 内，由 Agent 自身创建与删除，
        摄取凭证也由 Agent 生成，从不经过 Server。要求 `cluster.metrics.manage`；
        读取指标是另一个权限，只能看图表的人无法改变集群里运行的东西。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: 采集组件状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsCollectorState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
