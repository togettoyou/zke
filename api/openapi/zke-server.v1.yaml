          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/projects/{project_id}/cluster-installations:
    post:
      tags: [Clusters]
      operationId: createClusterInstallation
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cluster_name]
              properties:
                cluster_name:
                  type: string
      responses:
        "201":
          description: 安装命令
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ClusterInstallation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/connection/revoke:
    post:
      tags: [Clusters]
      operationId: revokeClusterConnection
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirmation"
      responses:
        "200":
          description: Cluster 当前接入身份已撤销
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ClusterConnectionRevocation"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/clusters/{cluster_id}/connection/reenroll:
    post:
      tags: [Clusters]
      operationId: reenrollClusterConnection
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirmation"
      responses:
        "201":
          description: 原 Cluster 的新一次性接入凭证
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ClusterEnrollment"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /agent-api/v1/enroll:
    post:
      tags: [Agent Protocol]
      operationId: enrollAgent
      security:
        - enrollmentToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentEnrollmentRequest"
      responses:
        "200":
          description: 幂等恢复的 Agent 身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AgentEnrollmentResponse"
        "201":
          description: 新签发的 Agent 身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AgentEnrollmentResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /agent-install/v1/manifest:
    get:
      tags: [Agent Protocol]
      operationId: getAgentInstallationManifest
      security:
        - installationToken: []
      responses:
        "200":
          description: Kubernetes 多文档 YAML
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zke_session
    enrollmentToken:
      type: http
      scheme: bearer
      bearerFormat: Agent enrollment token
    installationToken:
      type: http
      scheme: bearer
      bearerFormat: Agent installation token
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RoleBindingID:
      name: role_binding_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ClusterID:
      name: cluster_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    NodeName:
      name: node_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    KubernetesResourceName:
      name: resource_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    KubernetesGroup:
      name: group
      in: query
      description: Core API Group 使用空字符串或省略该参数。
      schema:
        type: string
        maxLength: 253
    KubernetesVersion:
      name: version
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    KubernetesResource:
      name: resource
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    KubernetesNamespace:
      name: namespace
      in: query
      description: Cluster-scoped 资源为空；Namespaced 列表为空时表示所有 Namespace。
      schema:
        type: string
        maxLength: 63
    EnrollmentID:
      name: enrollment_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    OptionalTenantID:
      name: tenant_id
      in: query
      schema:
        $ref: "#/components/schemas/UUID"
    OptionalProjectID:
      name: project_id
      in: query
      schema:
        $ref: "#/components/schemas/UUID"
    OptionalClusterID:
      name: cluster_id
      in: query
      schema:
        $ref: "#/components/schemas/UUID"
    ListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ListOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    ListSearch:
      name: q
      in: query
      schema:
        type: string
        maxLength: 253
  requestBodies:
    CreateNamedResource:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 253
  responses:
    InvalidRequest:
      description: 输入无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: 未认证或 Session 已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: CSRF 或权限检查失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 目标不存在或不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 幂等、生命周期或安全不变量冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 请求被限流
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 服务暂不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Timeout:
      description: 请求处理超时
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Agent 或目标 Kubernetes API 返回无效或失败的响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      examples:
        - "2026-07-26T14:30:00+08:00"
    SuccessResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          minimum: 200
          maximum: 299
        message:
          type: string
          const: Success
    ErrorData:
      type: object
      additionalProperties: false
      required: [error_code, request_id]
      properties:
        error_code:
          type: string
          pattern: "^[a-z0-9_]+$"
        request_id:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: string
        data:
          $ref: "#/components/schemas/ErrorData"
    Health:
      type: object
      additionalProperties: true
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          maxLength: 1024
    Authentication:
      type: object
      additionalProperties: false
      required: [user, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/UserIdentity"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, expires_at, capabilities]
      properties:
        user:
          $ref: "#/components/schemas/UserIdentity"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    Capability:
      type: object
      additionalProperties: false
      required: [role, scope_type, permissions]
      properties:
        role:
          type: string
          enum: [admin, viewer]
        scope_type:
          type: string
          enum: [global, tenant, project]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - tenant.create
              - tenant.read
              - tenant.manage
              - project.create
              - project.read
              - project.manage
              - cluster.enrollment.create
              - cluster.enrollment.read
              - cluster.enrollment.revoke
              - cluster.read
              - cluster.manage
              - cluster.connection.revoke
              - user.read
              - user.manage
              - rbac.read
              - rbac.manage
              - audit.read
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password, confirm]
      properties:
        current_password:
          type: string
          format: password
          maxLength: 1024
        new_password:
          type: string
          format: password
          minLength: 15
          maxLength: 1024
        confirm:
          const: true
    UserIdentity:
      type: object
      additionalProperties: false
      required: [id, username, display_name]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        display_name:
          type: string
    ManagedUser:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/UserIdentity"
        - type: object
          required:
            - status
            - failed_login_count
            - password_changed_at
            - created_at
            - updated_at
          properties:
            status:
              type: string
              enum: [active, locked, disabled]
            failed_login_count:
              type: integer
              minimum: 0
            locked_at:
              $ref: "#/components/schemas/Timestamp"
            lock_expires_at:
              $ref: "#/components/schemas/Timestamp"
            password_changed_at:
              $ref: "#/components/schemas/Timestamp"
            created_at:
              $ref: "#/components/schemas/Timestamp"
            updated_at:
              $ref: "#/components/schemas/Timestamp"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password]
      properties:
        username:
          type: string
        display_name:
          type: string
          maxLength: 253
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 1024
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 253
    SetUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status, confirm]
      properties:
        status:
          type: string
          enum: [active, disabled]
        confirm:
          const: true
    Confirmation:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          const: true
    UpdateScopedResourceRequest:
      type: object
      additionalProperties: false
      required: [name, status, confirm]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        status:
          type: string
          enum: [active, suspended]
        confirm:
          type: boolean
          description: status=suspended 时必须为 true
    UpdateClusterRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        status:
          type: string
          enum: [active, suspended]
          description: >-
            只能设置 `active` 或 `suspended`。`pending` 由 Agent 连接状态决定，
            恢复中的 Cluster 会回到 `pending` 直到 Agent 重新连接。
        confirm:
          type: boolean
          description: status=suspended 时必须为 true
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [password, confirm]
      properties:
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 1024
        confirm:
          const: true
    RoleBinding:
      type: object
      additionalProperties: false
      required: [id, subject_id, role, scope_type, created_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        subject_id:
          $ref: "#/components/schemas/UUID"
        subject:
          allOf:
            - $ref: "#/components/schemas/RoleBindingSubject"
          description: >-
            绑定所指向的账号。与绑定在同一次查询中解析，调用方无需再按 subject_id
            逐个查询用户。仅当该账号记录已不存在时省略；此时 subject_id 仍然返回，
            以便识别并删除孤立绑定。
        role:
          type: string
          enum: [admin, viewer]
        scope_type:
          type: string
          enum: [global, tenant, project]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        replayed:
          type: boolean
    RoleBindingSubject:
      type: object
      additionalProperties: false
      required: [id, username, display_name]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        display_name:
          type: string
    CreateRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [subject_id, role, scope_type, confirm]
      properties:
        subject_id:
          $ref: "#/components/schemas/UUID"
        role:
          type: string
          enum: [admin, viewer]
        scope_type:
          type: string
          enum: [global, tenant, project]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        confirm:
          const: true
    ResourceBase:
      type: object
      required: [id, name, status, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        status:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        replayed:
          type: boolean
    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total, has_more]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        has_more:
          type: boolean
    Tenant:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
    Project:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [tenant_id]
          properties:
            tenant_id:
              $ref: "#/components/schemas/UUID"
    Cluster:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [tenant_id, project_id]
          properties:
            tenant_id:
              $ref: "#/components/schemas/UUID"
            project_id:
              $ref: "#/components/schemas/UUID"
            last_seen_at:
              $ref: "#/components/schemas/Timestamp"
    ClusterConnection:
      type: object
      additionalProperties: false
      required:
        - status
        - lifecycle_status
        - health_status
        - version
        - protocol_version
        - certificate_serial
        - certificate_expires_at
        - certificate_remaining_seconds
        - certificate_status
      properties:
        status:
          type: string
          enum: [online, offline]
        lifecycle_status:
          type: string
        health_status:
          type: string
        version:
          type: string
        protocol_version:
          type: string
        last_seen_at:
          $ref: "#/components/schemas/Timestamp"
        certificate_serial:
          type: string
        certificate_expires_at:
          $ref: "#/components/schemas/Timestamp"
        certificate_remaining_seconds:
          type: integer
          minimum: 0
        certificate_status:
          type: string
          enum: [valid, expiring, expired, revoked]
        connection_id:
          type: string
        connected_at:
          $ref: "#/components/schemas/Timestamp"
        last_heartbeat_at:
          $ref: "#/components/schemas/Timestamp"
        last_disconnected_at:
          $ref: "#/components/schemas/Timestamp"
        last_disconnect_reason:
          type: string
    ClusterAggregate:
      allOf:
        - $ref: "#/components/schemas/Cluster"
        - type: object
          required: [connection]
          properties:
            connection:
              $ref: "#/components/schemas/ClusterConnection"
    KubernetesResourceType:
      type: object
      additionalProperties: false
      required:
        - group
        - version
        - resource
        - kind
        - namespaced
        - verbs
      properties:
        group:
          type: string
        version:
          type: string
        resource:
          type: string
        kind:
          type: string
        namespaced:
          type: boolean
        verbs:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [get, list]
        short_names:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
    KubernetesResourceCatalog:
      type: object
      additionalProperties: false
      required: [resources, partial]
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesResourceType"
        partial:
          type: boolean
          description: true 表示一个或多个 Aggregated API Group 发现失败，目录只包含成功部分。
    KubernetesUnstructuredResource:
      type: object
      description: Kubernetes Unstructured JSON 对象；metadata.managedFields 已移除。
      additionalProperties: true
    KubernetesGenericResourcePage:
      type: object
      additionalProperties: false
      required:
        - api_version
        - kind
        - items
        - continue_token
        - resource_version
        - remaining_item_count
      properties:
        api_version:
          type: string
        kind:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesUnstructuredResource"
        continue_token:
          type: string
          description: Kubernetes 原生 opaque continuation token；空字符串表示没有下一页。
        resource_version:
          type: string
        remaining_item_count:
          type: [integer, "null"]
          minimum: 0
    KubernetesNodeSummary:
      type: object
      required:
        - name
        - uid
        - creation_timestamp
        - status
        - unschedulable
        - roles
        - internal_ip
        - kubernetes_version
        - operating_system
        - os_image
        - kernel_version
        - container_runtime
        - cpu_capacity
        - memory_capacity
        - pods_capacity
        - cpu_allocatable
        - memory_allocatable
        - pods_allocatable
      properties:
        name:
          type: string
          maxLength: 253
        uid:
          type: string
        creation_timestamp:
          $ref: "#/components/schemas/Timestamp"
        status:
          type: string
          enum: [ready, not_ready, unknown]
        unschedulable:
          type: boolean
        roles:
          type: array
          items:
            type: string
        internal_ip:
          type: string
        kubernetes_version:
          type: string
        operating_system:
          type: string
        os_image:
          type: string
        kernel_version:
          type: string
        container_runtime:
          type: string
        cpu_capacity:
          type: string
          description: Kubernetes Quantity
        memory_capacity:
          type: string
          description: Kubernetes Quantity
        pods_capacity:
          type: string
          description: Kubernetes Quantity
        cpu_allocatable:
          type: string
          description: Kubernetes Quantity
        memory_allocatable:
          type: string
          description: Kubernetes Quantity
        pods_allocatable:
          type: string
          description: Kubernetes Quantity
    KubernetesNodePage:
      type: object
      additionalProperties: false
      required:
        - nodes
        - continue_token
        - resource_version
        - remaining_item_count
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesNodeSummary"
        continue_token:
          type: string
          description: Kubernetes 原生 opaque continuation token；空字符串表示没有下一页。
        resource_version:
          type: string
        remaining_item_count:
          type: [integer, "null"]
          minimum: 0
    KubernetesNodeAddress:
      type: object
      additionalProperties: false
      required: [type, address]
      properties:
        type:
          type: string
        address:
          type: string
    KubernetesNodeTaint:
      type: object
      additionalProperties: false
      required: [key, value, effect]
      properties:
        key:
          type: string
        value:
          type: string
        effect:
          type: string
        time_added:
          $ref: "#/components/schemas/Timestamp"
    KubernetesNodeCondition:
      type: object
      additionalProperties: false
      required:
        - type
        - status
        - reason
        - message
        - last_heartbeat_time
        - last_transition_time
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        message:
          type: string
        last_heartbeat_time:
          $ref: "#/components/schemas/Timestamp"
        last_transition_time:
          $ref: "#/components/schemas/Timestamp"
    KubernetesNodeDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesNodeSummary"
        - type: object
          required:
            - labels
            - annotations
            - provider_id
            - pod_cidr
            - pod_cidrs
            - addresses
            - taints
            - conditions
            - architecture
            - boot_id
            - machine_id
            - system_uuid
          properties:
            labels:
              type: object
              additionalProperties:
                type: string
            annotations:
              type: object
              additionalProperties:
                type: string
            provider_id:
              type: string
            pod_cidr:
              type: string
            pod_cidrs:
              type: array
              items:
                type: string
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeAddress"
            taints:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeTaint"
            conditions:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeCondition"
            architecture:
              type: string
            boot_id:
              type: string
            machine_id:
              type: string
            system_uuid:
              type: string
    ClusterEnrollment:
      type: object
      additionalProperties: false
      required: [id, cluster_name, token, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        token:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    ClusterEnrollmentRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - project_id
        - cluster_name
        - created_by_user_id
        - status
        - expires_at
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        created_by_user_id:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
          enum: [active, consumed, expired, revoked]
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        consumed_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    ClusterInstallation:
      type: object
      additionalProperties: false
      required:
        - id
        - cluster_name
        - expires_at
        - manifest_url
        - install_command
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        manifest_url:
          type: string
          format: uri
        install_command:
          type: string
    ClusterConnectionRevocation:
      type: object
      additionalProperties: false
      required: [cluster_id, connection_status, revoked_at, already_revoked]
      properties:
        cluster_id:
          $ref: "#/components/schemas/UUID"
        connection_status:
          type: string
          const: revoked
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        already_revoked:
          type: boolean
    AgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [csr_pem, agent_version, protocol_version]
      properties:
        csr_pem:
          type: string
          description: PEM 编码的 ECDSA P-256 PKCS#10 CSR
        agent_version:
          type: string
          minLength: 1
          maxLength: 128
        protocol_version:
          type: string
          const: v1
    AgentEnrollmentResponse:
      type: object
      additionalProperties: false
      required:
        - cluster_id
        - agent_id
        - certificate_pem
        - certificate_expires_at
      properties:
        cluster_id:
          $ref: "#/components/schemas/UUID"
        agent_id:
          $ref: "#/components/schemas/UUID"
        certificate_pem:
          type: string
        certificate_expires_at:
          $ref: "#/components/schemas/Timestamp"
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_type
        - scope_type
        - action
        - target_type
        - result
        - request_id
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        actor_type:
          type: string
          enum: [user, agent, system]
        actor_user_id:
          $ref: "#/components/schemas/UUID"
        actor_user_name:
          type: string
          description: >-
            事件写入时该用户的用户名。审计记录不对用户、Tenant、Project 或 Cluster
            建立外键，因此这些对象被删除后其 ID 不再可解析；随事件一同记录的名称是
            该记录此后唯一可读的身份依据。
        actor_agent_id:
          $ref: "#/components/schemas/UUID"
        scope_type:
          type: string
          enum: [global, tenant, project, cluster]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        tenant_name:
          type: string
          description: 事件写入时该 Tenant 的名称。
        project_id:
          $ref: "#/components/schemas/UUID"
        project_name:
          type: string
          description: 事件写入时该 Project 的名称。
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
          description: 事件写入时该 Cluster 的名称。
        action:
          type: string
        target_type:
          type: string
        target_id:
          $ref: "#/components/schemas/UUID"
        target_name:
          type: string
          description: >-
            事件写入时目标对象的名称。Session、RoleBinding、Agent 与凭证没有名称，
            此字段为空。
        result:
          type: string
          enum: [succeeded, failed, denied]
        request_id:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AuditAction:
      type: object
      additionalProperties: false
      required: [name, group]
      properties:
        name:
          type: string
          description: 写入审计事件 `action` 字段的取值，可直接用作过滤条件。
        group:
          type: string
          enum: [auth, user, role_binding, tenant, project, cluster, denied]
          description: >-
            所属族。由 Server 声明而非由名称拆分得出——`cluster.delete` 与
            `cluster.enrollment.create` 同族但层级不同，按点号切分会得到错误的分组。
            `denied` 组是鉴权拒绝时记录的权限名，其事件的 `result` 恒为 `denied`。
    AuditTargetType:
      type: string
      description: >-
        写入审计事件 `target_type` 字段的取值，可直接用作过滤条件。与 `action` 一样是
        服务端拥有的封闭词表，客户端不应自行枚举。它描述事件针对的对象类型，与事件所属的
        `scope_type` 不同：`cluster.enrollment.create` 定域于 Project，目标却是 Enrollment。
      enum:
        - user
        - session
        - role_binding
        - tenant
        - project
        - cluster
        - agent
        - agent_credential
        - enrollment
        - audit_event
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [audit_events, pagination]
      properties:
        audit_events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"
