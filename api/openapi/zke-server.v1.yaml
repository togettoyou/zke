              - cluster.pod.exec
              - cluster.terminal.exec
              - cluster.pod.terminal_recording.create
              - cluster.pod.terminal_recording.read
              - cluster.pod.port_forward
              - cluster.node.drain
              - cluster.event.read
              - cluster.metrics.read
              - cluster.metrics.manage
              - cluster.manage
              - cluster.namespace.manage
              - cluster.system_namespace.manage
              - cluster.agent_namespace.manage
              - cluster.resource.create
              - cluster.resource.update
              - cluster.resource.delete
              - cluster.rbac.read
              - cluster.rbac.manage
              - cluster.secret.read
              - cluster.secret.manage
              - cluster.connection.revoke
              - user.read
