      required: [limit, offset, total, has_more]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        has_more:
          type: boolean
    Tenant:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
    Project:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [tenant_id]
