openapi: 3.1.0
info:
  title: ZKE Server API
  version: v1
  description: |
    ZKE 用户管理、资源管理、Cluster 接入管理和内部 Agent 注册使用的 HTTP API 契约。
    除 SSE 事件流、Pod 原始日志流与 YAML Manifest 外，所有 JSON 响应统一使用
    `code`、`message`、`data` 三字段信封。`code` 与 HTTP 状态码一致；
    成功响应的 `message` 固定为 `Success`；失败响应的 `data` 包含稳定
    `error_code` 和请求关联 `request_id`。
    所有 JSON 时间均为 RFC 3339，并由当前 API 以 UTC+8 偏移返回。
servers:
  - url: /
    description: Console 与 API 使用同源入口；本地开发通过前端代理转发
tags:
  - name: Health
  - name: Setup
  - name: Authentication
  - name: Users
  - name: RBAC
  - name: Resources
  - name: Clusters
  - name: Agent Protocol
  - name: Audit
  - name: Platform
  - name: Helm
  - name: AIOps
  - name: Events
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        "200":
          description: Server 已就绪
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/setup:
    get:
      tags: [Setup]
      operationId: getSetupStatus
      description: 仅报告当前是否缺少 Global 作用域的内置 `admin` 角色绑定。
      responses:
        "200":
          description: 初始化状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/SetupStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Setup]
      operationId: initializeGlobalAdministrator
      description: >-
        仅在系统不存在 Global 作用域的内置 `admin` 角色绑定时创建首位全局管理员。
        并发请求由数据库事务串行化；成功后同时建立浏览器 Session。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: 全局管理员已创建；Session 和 CSRF Token 通过 Cookie 返回
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Authentication"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功；Session 和 CSRF Token 通过 Cookie 返回
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Authentication"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已注销
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/password:
    post:
      tags: [Authentication]
      operationId: changeCurrentUserPassword
      description: >-
        修改当前登录用户自己的密码。要求调用者在 Global 作用域持有
        `user.password.change` 权限；成功后撤销该用户的全部 Session。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: 密码已修改，当前用户全部 Session 已撤销
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: "null"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOffset"
        - $ref: "#/components/parameters/ListSearch"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, locked, disabled]
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [users, pagination]
                        properties:
                          users:
                            type: array
                            items:
                              $ref: "#/components/schemas/ManagedUser"
                          pagination:
                            $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      operationId: createUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: 用户已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Users]
      operationId: getUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ManagedUser"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Users]
      operationId: updateUser
      description: >-
        修改用户显示名称。目标是全局管理员时要求调用者本人也是全局管理员，
        否则返回 `403 global_admin_required`——该规则覆盖全局管理员账号上的
        一切写操作，而不只是危险的那些。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: 用户资料已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ManagedUser"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Users]
      operationId: deleteUser
      description: |
        永久删除用户记录、该用户的全部 Session 和 RoleBinding，不可恢复，用户名随之释放。
        Enrollment、资源创建幂等记录和审计事件保留原用户 ID；审计事件同时保留删除时的用户名。
        调用者必须在 Global 作用域覆盖目标账号绑定角色携带的全部权限，否则返回
        `403 target_authority_exceeded`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirmation"
      responses:
        "200":
          description: 用户、Session 和 RoleBinding 已永久删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ManagedUser"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{user_id}/status:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [Users]
      operationId: setUserStatus
      description: >-
        启用或禁用用户。调用者必须在 Global 作用域覆盖目标账号绑定角色携带的全部权限，
        否则返回 `403 target_authority_exceeded`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserStatusRequest"
      responses:
        "200":
          description: 用户状态已更新，禁用会撤销现有 Session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{user_id}/unlock:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Users]
      operationId: unlockUser
      description: >-
        解锁用户。调用者必须在 Global 作用域覆盖目标账号绑定角色携带的全部权限，
        否则返回 `403 target_authority_exceeded`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirmation"
      responses:
        "200":
          description: 锁定计数已清除，账户恢复为 active
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{user_id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [Users]
      operationId: resetUserPassword
      description: >-
        重置用户密码并撤销其全部 Session。调用者必须在 Global 作用域覆盖目标账号绑定角色
        携带的全部权限，否则返回 `403 target_authority_exceeded`；重置自己的密码除外。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: 密码已重置，目标用户全部 Session 已撤销
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ManagedUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/permissions:
    get:
      tags: [RBAC]
      operationId: listPermissions
      summary: 平台权限字典
      description: >-
        返回 Server 定义的全部权限，并标注调用者自己是否在全局持有该权限。
        `held` 决定调用者能否把该权限写入角色：角色不得包含作者未持有的权限。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 权限字典
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [permissions]
                        properties:
                          permissions:
                            type: array
                            items:
                              $ref: "#/components/schemas/PermissionDescriptor"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/roles:
    get:
      tags: [RBAC]
      operationId: listRoles
      summary: 角色列表
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOffset"
        - $ref: "#/components/parameters/ListSearch"
        - name: builtin
          in: query
          description: 只看内置角色或只看自定义角色。
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [roles, pagination]
                        properties:
                          roles:
                            type: array
                            items:
                              $ref: "#/components/schemas/Role"
                          pagination:
                            $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [RBAC]
      operationId: createRole
      summary: 新建角色
      description: >-
        角色的权限集不得超出调用者在全局持有的权限，否则返回 403 `permission_escalation`。
        没有这条限制，`rbac.manage` 就等于全部权限。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: 角色已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/roles/{role_id}:
    get:
      tags: [RBAC]
      operationId: getRole
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
      responses:
        "200":
          description: 角色详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [RBAC]
      operationId: updateRole
      summary: 修改角色
      description: >-
        权限集是整体替换。`name` 不可修改：绑定与审计记录都以它指代该角色。
        内置角色返回 409 `builtin_role`。

        修改按「改动了什么」判定：本次**新增**的权限若超出调用者在全局持有的
        范围，返回 403 `permission_escalation`；本次**移除**的权限若超出同一
        范围，返回 403 `permission_revocation`——收回自己没有的权限同样越权。
        两个集合里都存在的权限不参与判定，因此改说明、改名称不需要先删掉调用者
        未持有的权限。两种拒绝都列出越界的权限名。

        此外，改动后调用者本人在全局持有的权限集若变小，返回 409
        `self_lockout_forbidden` 并列出会失去的权限名——角色只能包含作者已持有
        的权限，所以那些权限之后无法由本人加回来，与禁止删除授予自身的绑定同一
        条理由。收回一个人的权限只能由别人来做。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: 角色已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [RBAC]
      operationId: deleteRole
      summary: 删除角色
      description: >-
        仍被绑定的角色不可删除，返回 409 `role_in_use`；请先删除相关绑定。
        内置角色返回 409 `builtin_role`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirmation"
      responses:
        "200":
          description: 角色已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: "null"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/role-bindings:
    get:
      tags: [RBAC]
      operationId: listRoleBindings
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOffset"
        - $ref: "#/components/parameters/ListSearch"
        - name: role
          in: query
          description: 角色名。角色由操作者定义，因此不是一个封闭取值列表。
          schema:
            type: string
        - name: scope_type
          in: query
          schema:
            type: string
            enum: [global, tenant, project]
      responses:
        "200":
          description: RoleBinding 列表
