          description: >-
            只能设置 `active` 或 `suspended`。`pending` 由 Agent 连接状态决定，
            恢复中的 Cluster 会回到 `pending` 直到 Agent 重新连接。
        confirm:
          type: boolean
          description: status=suspended 时必须为 true
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [password, confirm]
      properties:
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 1024
        confirm:
          const: true
    RoleBinding:
      type: object
      additionalProperties: false
      required: [id, subject_id, role, scope_type, created_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        subject_id:
          $ref: "#/components/schemas/UUID"
        subject:
          allOf:
            - $ref: "#/components/schemas/RoleBindingSubject"
          description: >-
            绑定所指向的账号。与绑定在同一次查询中解析，调用方无需再按 subject_id
            逐个查询用户。仅当该账号记录已不存在时省略；此时 subject_id 仍然返回，
            以便识别并删除孤立绑定。
        role:
          type: string
          description: 角色名。角色由操作者定义，取值不封闭。
        scope_type:
          type: string
          enum: [global, tenant, project]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        replayed:
          type: boolean
    PermissionDescriptor:
      type: object
      additionalProperties: false
      required: [name, held, minimum_scope]
      properties:
        name:
          type: string
        held:
          type: boolean
          description: >-
            调用者是否在全局持有该权限。角色不得包含作者未持有的权限，
            因此 `held` 为 false 的权限无法被写入角色。
        minimum_scope:
          type: string
          enum: [global, tenant, project]
          description: >-
            能够行使该权限的最窄绑定作用域。比它更窄的绑定携带该权限不生效：
            `global` 的权限在 Tenant 与 Project 绑定上不生效，`tenant` 的权限
            （目前只有 `project.create`）在 Project 绑定上不生效。这样的绑定仍然
            允许创建（角色的其余权限照常生效），但整个角色都由该作用域无法行使的
            权限组成时会返回 `400 role_unreachable_at_scope`，因为那样的绑定不授予任何权限。
    Role:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          display_name,
          description,
          builtin,
          permissions,
          binding_count,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          description: 稳定标识，绑定与审计记录以它指代角色，创建后不可修改。
        display_name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
          description: 由 Server 定义的角色，权限集在启动时对账，不可编辑或删除。
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        binding_count:
          type: integer
          description: 引用该角色的绑定数量。大于 0 时不可删除。
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [name, display_name, permissions, confirm]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
          description: 不能与内置角色同名。
        display_name:
          type: string
          minLength: 1
          maxLength: 253
        description:
          type: string
          maxLength: 1024
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        confirm:
          const: true
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [display_name, permissions, confirm]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 253
        description:
          type: string
          maxLength: 1024
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          description: 整体替换，不是增量。
          items:
            type: string
        confirm:
          const: true
    RoleBindingSubject:
      type: object
      additionalProperties: false
      required: [id, username, display_name]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        display_name:
          type: string
    CreateRoleBindingRequest:
      type: object
      additionalProperties: false
      required: [subject_id, role, scope_type, confirm]
      properties:
        subject_id:
          $ref: "#/components/schemas/UUID"
        role:
          type: string
          description: 角色名。角色由操作者定义，取值不封闭。
        scope_type:
          type: string
          enum: [global, tenant, project]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        confirm:
          const: true
    ResourceBase:
      type: object
      required: [id, name, status, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        status:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
