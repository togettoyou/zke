            last_seen_at:
              $ref: "#/components/schemas/Timestamp"
    ClusterConnection:
      type: object
      additionalProperties: false
      required:
        - status
        - lifecycle_status
        - health_status
        - version
        - protocol_version
        - certificate_serial
        - certificate_expires_at
        - certificate_remaining_seconds
        - certificate_status
      properties:
        status:
          type: string
