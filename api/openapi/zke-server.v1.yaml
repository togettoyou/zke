            type: string
            maxLength: 253
        - name: resource_kind
          in: query
          schema:
            type: string
            maxLength: 253
        - name: resource_name
          in: query
          schema:
            type: string
            maxLength: 253
        - name: type
          in: query
          schema:
            type: string
            enum: [Normal, Warning]
        - name: reason
          in: query
          schema:
            type: string
            maxLength: 253
      responses:
        "200":
          description: Kubernetes Event 快照或实时 SSE 流
