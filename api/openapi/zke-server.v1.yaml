  /api/v1/ai/tools:
    get:
      tags: [AIOps]
      operationId: listAITools
      description: >-
        AIOps 在本部署是否可用，以及运行时向模型公开的受控工具目录。描述的是运行时自身而不是任何 Cluster，
        因此不需要作用域参数；每个工具在每次调用前仍会针对发起用户在会话固定 Cluster 上重新校验 permissions。
        目录中的变更时间线额外要求 audit.read，并由审计服务按调用者可见范围过滤；变更后验证要求 cluster.read 与
        cluster.event.read，只报告 Kubernetes 当前状态、Event 与收敛情况，业务指标验证继续走指标工具。
        Cluster Terminal 命令工具在一个 Turn 的首次调用批准后重新计算并投射当前 Cluster 权限；后续命令复用同一
        Terminal Pod 和冻结快照，Turn 结束或权限撤销时自动清理，且不投射 Secret 读写或 Agent Namespace 管理权限。
        enabled 让 Console 在平台未启用 AIOps 时直接不展示该应用，而不必读取仅全局管理员可见的平台配置。
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 当前部署的 AIOps 可用状态与工具目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [enabled, tools, skills]
                        properties:
                          enabled:
                            type: boolean
                            description: 平台已启用 AIOps，且模型接入地址与模型名都已配置。
                          tools:
                            type: array
                            items: { $ref: "#/components/schemas/AITool" }
                          skills:
                            type: array
                            description: >-
                              运行时随 Server 发布的排查技能（Playbook）。技能只是流程说明：它规定用目录里的哪些工具、
                              按什么顺序取证、以什么标准下结论，不新增工具、权限或作用域。模型用 load_skill 按 ID 读取，
                              每一步仍按同一套逐次权限校验和审批模式执行。所需工具没有全部组装的技能不会出现在这里。
                            items: { $ref: "#/components/schemas/AISkill" }
