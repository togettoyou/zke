  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/logs:
    get:
      tags: [Resources]
      operationId: streamKubernetesPodLogs
      description: |
        通过目标 Cluster 的 Agent 读取指定 Pod UID 和 Container 的日志。默认返回最近
        200 行的有界快照；follow=true 时实时转发新日志，直到客户端取消、权限或 Session
        被撤销、达到最大时长或字节上限。默认响应是未包装 UTF-8 文本，并用 HTTP Trailer
        返回终止状态；Accept: application/x-ndjson 时，每个日志块以 Base64 chunk 帧返回，
        最后一个 end 帧明确给出终止原因、字节数和上限状态，供无法读取 Trailer 的浏览器使用。
        日志正文不写入 Server 日志或审计事件。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/PodName"
        - name: uid
          in: query
          required: true
          description: 当前 Pod UID；Agent 在打开日志前校验，避免读取同名重建 Pod。
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: container
          in: query
          required: true
          description: Pod 中明确的主容器、初始化容器或临时容器名称。
          schema:
            type: string
            minLength: 1
            maxLength: 63
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
        - name: previous
          in: query
          description: |
            读取该容器上一个终止实例的日志。不能与 follow 同时使用：已终止的实例
            不会再产生新日志。该容器没有上一个实例，或其日志已被节点清理时，返回
            404 previous_logs_not_found，而不是按无效输入处理。
          schema:
            type: boolean
            default: false
        - name: tail_lines
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 5000
            default: 200
        - name: since_seconds
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 604800
        - name: timestamps
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Pod 日志快照或实时文本流
          headers:
            X-ZKE-Log-Result:
              description: succeeded、timeout、canceled、access_revoked 或 failed。
              schema:
                type: string
            X-ZKE-Log-Limit-Reached:
              description: 是否因服务端字节上限结束。
              schema:
                type: boolean
            X-ZKE-Log-Bytes:
              description: 已发送到 HTTP 客户端的日志字节数。
              schema:
                type: integer
                format: uint64
          content:
            text/plain:
              schema:
                type: string
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/KubernetesPodLogFrame"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
