  /api/v1/projects/{project_id}/cluster-enrollments:
    get:
      tags: [Clusters]
      operationId: listClusterEnrollments
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOffset"
        - $ref: "#/components/parameters/ListSearch"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, consumed, expired, revoked]
      responses:
        "200":
          description: Cluster Enrollment 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [cluster_enrollments, pagination]
                        properties:
                          cluster_enrollments:
                            type: array
                            items:
                              $ref: "#/components/schemas/ClusterEnrollmentRecord"
                          pagination:
                            $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Clusters]
      operationId: createClusterEnrollment
      description: |
        首次接入时 `cluster_name` 在其 Project 内必须唯一（忽略大小写），被占用时返回
        409 `cluster_name_conflict`。名称在签发凭证时校验一次，在 Agent 完成注册、
        实际创建 Cluster 时再次由唯一约束保证——两者之间名称仍可能被占用。
        `agent_namespace` 在首次注册时固化到 Cluster，后续重新接入继续使用该值。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cluster_name, agent_namespace]
              properties:
                cluster_name:
                  type: string
                  minLength: 1
                  maxLength: 253
                endpoint_profile_id:
                  $ref: "#/components/schemas/UUID"
                agent_namespace:
                  $ref: "#/components/schemas/AgentNamespace"
      responses:
        "201":
          description: 一次性注册凭证
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ClusterEnrollment"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
