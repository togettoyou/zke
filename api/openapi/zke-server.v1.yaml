        必须提供 UID 与 resourceVersion 前置条件，任一不匹配返回 409。
        目标修订的模板与当前模板一致时返回 409 workload_revision_unchanged，
        不写入一次什么都不改的更新。dry_run=true 时执行服务端预览，
        实际写入要求显式 confirm=true。
      security:
        - sessionCookie: []
