        resource_version:
          type: string
        remaining_item_count:
          type: [integer, "null"]
          minimum: 0
    KubernetesMutationOptions:
      type: object
      additionalProperties: false
      properties:
        dry_run:
          type: boolean
          default: false
        field_manager:
          type: string
          maxLength: 128
        force:
