      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        requested_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            所有 PersistentVolumeClaim 的 `spec.resources.requests.storage` 之和，
            表示申请量而不是实际制备量。
