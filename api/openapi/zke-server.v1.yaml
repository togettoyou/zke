          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/eviction:
    post:
      tags: [Resources]
      operationId: evictKubernetesPod
      description: |
        通过 Kubernetes Eviction 子资源驱逐明确 Cluster 和 Namespace 中的 Pod。与删除的区别
        在于 Kubernetes 会先校验覆盖该 Pod 的 PodDisruptionBudget：如果驱逐会破坏可用性预算，
        请求被拒绝并返回 409 `pod_disruption_budget_blocked`，正文携带 Kubernetes 自己的说明。

        请求必须携带当前 Pod UID，避免驱逐同名重建对象；dry_run=true 时执行 Kubernetes 服务端
        预览，实际驱逐要求显式 confirm=true。驱逐与删除同属 `cluster.resource.delete`，
        kube-* 与 Agent Namespace 仍需对应的独立 Namespace 权限。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/PodName"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KubernetesEvictPodRequest"
      responses:
        "200":
          description: Pod 驱逐或 DryRun 结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesPodEvictionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/describe:
    get:
      tags: [Resources]
      operationId: describeKubernetesPod
      description: |
        在一次请求内返回 Pod 详情、只属于该 Pod 的 Kubernetes Event 快照，以及由两者共同
        支持的诊断结论（findings）。Event 按对象 UID 过滤并按时间正序返回，数量有界。

        findings 只包含问题项，且只来自 Kubernetes 已经报告的状态：每条携带稳定的 code、
        Kubernetes 原始 reason 与 message，以及指向 Condition、容器状态或 Event 的证据，
        不额外推断。当前仅 Pod 家族有诊断规则。

        该接口同时读取资源与 Event，因此要求调用者同时持有 cluster.read 和
        cluster.event.read；Event 读取会写入与 Event 流一致的审计记录。若 Event 读取本身
        失败，接口仍返回对象部分，并在 events.omitted 与 degraded_sections 中说明。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/PodName"
      responses:
        "200":
          description: Pod describe 视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesDescribe"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/logs:
    get:
      tags: [Resources]
      operationId: streamKubernetesPodLogs
      description: |
        通过目标 Cluster 的 Agent 读取指定 Pod UID 和 Container 的日志。默认返回最近
        200 行的有界快照；follow=true 时实时转发新日志，直到客户端取消、权限或 Session
        被撤销、达到最大时长或字节上限。默认响应是未包装 UTF-8 文本，并用 HTTP Trailer
        返回终止状态；Accept: application/x-ndjson 时，每个日志块以 Base64 chunk 帧返回，
        最后一个 end 帧明确给出终止原因、字节数和上限状态，供无法读取 Trailer 的浏览器使用。
        日志正文不写入 Server 日志或审计事件。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/PodName"
        - name: uid
          in: query
          required: true
          description: 当前 Pod UID；Agent 在打开日志前校验，避免读取同名重建 Pod。
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: container
          in: query
          required: true
          description: Pod 中明确的主容器、初始化容器或临时容器名称。
          schema:
            type: string
            minLength: 1
            maxLength: 63
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
        - name: previous
          in: query
          description: |
            读取该容器上一个终止实例的日志。不能与 follow 同时使用：已终止的实例
            不会再产生新日志。该容器没有上一个实例，或其日志已被节点清理时，返回
            404 previous_logs_not_found，而不是按无效输入处理。
          schema:
            type: boolean
            default: false
        - name: tail_lines
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 5000
            default: 200
        - name: since_seconds
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 604800
        - name: timestamps
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Pod 日志快照或实时文本流
          headers:
            X-ZKE-Log-Result:
              description: succeeded、timeout、canceled、access_revoked 或 failed。
              schema:
                type: string
            X-ZKE-Log-Limit-Reached:
              description: 是否因服务端字节上限结束。
              schema:
                type: boolean
            X-ZKE-Log-Bytes:
              description: 已发送到 HTTP 客户端的日志字节数。
              schema:
                type: integer
                format: uint64
          content:
            text/plain:
              schema:
                type: string
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/KubernetesPodLogFrame"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/terminal-sessions:
    post:
      tags: [Resources]
      operationId: createClusterTerminalSession
      description: |
        在目标 Cluster 的 Agent Namespace 创建短生命周期集群终端。终端使用独立 Pod、ServiceAccount、
        ClusterRole 与各业务 Namespace 的 RoleBinding，权限由当前用户在该 Cluster 实际持有的权限生成，
        不复用 Agent 身份，也不向 Agent Namespace 投射业务资源权限。
        要求 cluster.terminal.exec、CSRF、Idempotency-Key 和显式确认。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterTerminalSessionRequest"
      responses:
        "201":
          description: 一次性集群终端连接票据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesPodExecSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/clusters/{cluster_id}/terminal-sessions/{session_id}:
    get:
      tags: [Resources]
      operationId: connectClusterTerminalSession
      description: |
        消费一次性票据并升级为 zke.pod-exec.v1 WebSocket。会话周期重新验证登录 Session
        和 cluster.terminal.exec；结束后删除临时 Pod、ServiceAccount 和 Kubernetes RBAC。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - name: session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "101":
          description: WebSocket 已升级；协商子协议为 zke.pod-exec.v1。
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: 一次性 Session 已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/terminal-sessions:
    post:
      tags: [Resources]
      operationId: createKubernetesPodTerminalSession
      description: |
        为明确 Cluster、Namespace、Pod UID 和 Container 创建一次性 Web Terminal 票据。
        请求必须显式确认并携带 Idempotency-Key；票据与当前用户和登录 Session 绑定，短时
        有效且只能消费一次。实际 Shell 由 Agent 固定选择：优先 bash，不存在时回退
        /bin/sh，不接受客户端指定任意启动命令。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/PodName"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KubernetesPodExecSessionRequest"
      responses:
        "201":
          description: 一次性 Pod Terminal Session 票据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesPodExecSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/terminal-sessions/{session_id}:
    get:
      tags: [Resources]
      operationId: connectKubernetesPodTerminal
      description: |
        使用一次性票据升级为 WebSocket。客户端必须发送 Origin 和
        Sec-WebSocket-Protocol: zke.pod-exec.v1；服务端校验同源、用户、登录 Session、
        Cluster 和 Pod 路径绑定后消费票据。WebSocket 客户端消息使用
        KubernetesPodExecClientMessage，服务端消息使用 KubernetesPodExecServerMessage；
        data 是 JSON 中的 Base64 字符串。会话有最大时长、空闲超时、输入/输出字节上限，
        并周期性重新验证登录 Session 和 cluster.pod.exec 权限。终端输入输出不进入日志或审计。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/PodName"
        - name: session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "101":
          description: WebSocket 已升级；协商子协议为 zke.pod-exec.v1。
          headers:
            Sec-WebSocket-Protocol:
              schema:
                type: string
                const: zke.pod-exec.v1
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: 一次性 Session 已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/terminal-recordings:
    get:
      tags: [Resources]
      operationId: listKubernetesPodTerminalRecordings
      description: |
