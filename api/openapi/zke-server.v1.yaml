        scope_type:
          type: string
          enum: [global, tenant, project]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - tenant.create
              - tenant.read
              - tenant.manage
              - project.create
              - project.read
              - project.manage
              - application.manage
              - cluster.enrollment.create
              - cluster.enrollment.read
              - cluster.enrollment.revoke
              - cluster.read
              - cluster.pod.logs.read
              - cluster.pod.exec
              - cluster.terminal.exec
              - cluster.pod.terminal_recording.create
              - cluster.pod.terminal_recording.read
              - cluster.pod.port_forward
              - cluster.node.manage
              - cluster.node.drain
              - cluster.event.read
              - cluster.metrics.read
              - cluster.metrics.manage
              - cluster.manage
              - cluster.namespace.manage
              - cluster.system_namespace.manage
              - cluster.agent_namespace.manage
              - cluster.resource.create
              - cluster.resource.update
              - cluster.resource.delete
              - cluster.rbac.read
              - cluster.rbac.manage
              - cluster.secret.read
              - cluster.secret.manage
              - cluster.connection.revoke
              - cluster.helm.manage
              - user.read
              - user.manage
              - user.password.change
              - rbac.read
              - rbac.manage
              - helm.repository.read
              - helm.repository.manage
              - audit.read
              - ai.run
    ChangePasswordRequest:
      type: object
