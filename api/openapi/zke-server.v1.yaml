        - name: recording_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: 终端输出录制
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesPodTerminalRecording"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/access-sessions:
    post:
      tags: [Resources]
      operationId: createKubernetesPodAccessSession
      description: |
        为明确 Cluster、Namespace、Pod UID 和单个 HTTP 端口创建短时、一次性的 Pod
        Access 激活地址。请求需要 cluster.pod.port_forward 权限、CSRF、显式确认和
        Idempotency-Key。激活地址位于独立 Pod Access Origin；成功激活后由该 Origin
        代理根路径、流式响应和 WebSocket，不暴露任何 ZKE API。激活及活跃会话均绑定
        创建者的登录 Session，服务端周期重新验证登录状态和权限，并限制会话时长、
        双向总字节、全局及单会话连接数。Token 与正文不进入日志或审计。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/PodName"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KubernetesPodAccessSessionRequest"
      responses:
        "201":
          description: 一次性 Pod Access 激活地址
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesPodAccessSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/clusters/{cluster_id}/events:
    get:
      tags: [Events]
      operationId: streamClusterKubernetesEvents
      description: |
        通过目标 Cluster 的 Agent 读取该 Cluster 全部 Namespace 的 Kubernetes Event——
        在还不知道问题出在哪个 Namespace 时使用的事件中心。SSE 帧、过滤参数、恢复语义、
        终止原因与 Namespace 级事件接口完全一致，区别只是不限定 Namespace。

        权限与 Namespace 级接口相同，都是 `cluster.event.read`：该权限本就按 Cluster 授予，
        持有者原本可以逐个 Namespace 读到同样的事件，这里只是省去逐个读取。Agent 必须支持
        Cluster 级 Event 读取，早于该能力的 Agent 会拒绝并返回 503
        `agent_capability_unavailable`。Event 正文不会写入 Server 日志或审计记录。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - name: Last-Event-ID
          in: header
          description: resource_version 未提供时使用的 Kubernetes resourceVersion 恢复点。
          schema:
            type: string
            maxLength: 256
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
        - name: include_initial
          in: query
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: resource_version
          in: query
          schema:
            type: string
            maxLength: 256
        - name: resource_uid
          in: query
          schema:
            type: string
            maxLength: 253
        - name: resource_kind
          in: query
          schema:
            type: string
            maxLength: 253
        - name: resource_name
          in: query
          schema:
            type: string
            maxLength: 253
        - name: type
          in: query
          schema:
            type: string
            enum: [Normal, Warning]
        - name: reason
          in: query
          schema:
            type: string
            maxLength: 253
      responses:
        "200":
          description: 全 Cluster Kubernetes Event 快照或实时 SSE 流
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/events:
    get:
      tags: [Events]
      operationId: streamKubernetesEvents
      description: |
        通过目标 Cluster 的 Agent 读取明确 Namespace 中的 Kubernetes Event。默认以 SSE
        返回最多 100 个当前事件后结束；follow=true 时继续发送实时事件和心跳，直到客户端
        取消、权限或 Session 被撤销、达到最大时长或服务端容量上限。`ready` 事件携带当前
        resourceVersion，`kubernetes.event` 携带稳定的 Event 字段，`bookmark` 用于推进恢复点，
        `close` 在响应正文内说明终止原因。调用方可通过 resource_version 或 Last-Event-ID 恢复；
        收到 resource_version_expired 后必须重新请求初始快照。读取要求独立的
        `cluster.event.read` 权限；上游正常关闭 Watch 时 `close.reason` 为 `watch_closed`，客户端可从
        `last_resource_version` 重连。Event 正文不会写入 Server 日志或审计记录。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - name: Last-Event-ID
          in: header
