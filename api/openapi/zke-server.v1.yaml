        - required: [port_name]
        - required: [port_number]
    KubernetesIngressPathInput:
      type: object
      additionalProperties: false
      required: [path_type, backend]
      properties:
        path: { type: string, maxLength: 4096 }
        path_type: { type: string, enum: [Exact, Prefix, ImplementationSpecific] }
        backend: { $ref: "#/components/schemas/KubernetesIngressServiceBackendInput" }
    KubernetesIngressRuleInput:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        host: { type: string, maxLength: 253 }
        paths:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/KubernetesIngressPathInput" }
    KubernetesIngressTLSInput:
      type: object
      additionalProperties: false
      properties:
        hosts:
          type: array
          items: { type: string, maxLength: 253 }
        secret_name: { type: string, maxLength: 253 }
    KubernetesIngressSpecInput:
      type: object
      additionalProperties: false
      properties:
        ingress_class_name: { type: string, maxLength: 253 }
        default_backend: { $ref: "#/components/schemas/KubernetesIngressServiceBackendInput" }
        rules:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/KubernetesIngressRuleInput" }
        tls:
          type: array
          items: { $ref: "#/components/schemas/KubernetesIngressTLSInput" }
    KubernetesGatewayAddress:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, maxLength: 253 }
        value: { type: string, minLength: 1, maxLength: 253 }
    KubernetesGatewayObjectReference:
      type: object
      additionalProperties: false
      required: [group, kind, name, namespace]
      properties:
        group: { type: string, maxLength: 253 }
        kind: { type: string, maxLength: 253 }
        name: { type: string, minLength: 1, maxLength: 253 }
        namespace: { type: string, maxLength: 63 }
    KubernetesGatewayRouteKind:
      type: object
      additionalProperties: false
      required: [group, kind]
      properties:
        group: { type: string, maxLength: 253 }
        kind: { type: string, minLength: 1, maxLength: 253 }
    KubernetesGatewayAllowedRoutes:
      type: object
      additionalProperties: false
      required: [namespaces_from, kinds]
      properties:
        namespaces_from: { type: string, enum: ["", Same, All, Selector] }
        selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        kinds:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesGatewayRouteKind" }
    KubernetesGatewayTLS:
      type: object
      additionalProperties: false
      required: [mode, certificate_refs]
      properties:
        mode: { type: string, enum: [Terminate, Passthrough] }
        certificate_refs:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesGatewayObjectReference" }
    KubernetesGatewayListener:
      type: object
      additionalProperties: false
      required: [name, hostname, port, protocol, allowed_routes]
      properties:
        name: { type: string, minLength: 1, maxLength: 63 }
        hostname: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        protocol: { type: string, enum: [HTTP, HTTPS, TLS, TCP, UDP] }
        tls: { $ref: "#/components/schemas/KubernetesGatewayTLS" }
        allowed_routes: { $ref: "#/components/schemas/KubernetesGatewayAllowedRoutes" }
    KubernetesGatewaySpec:
      type: object
      additionalProperties: false
      required: [gateway_class_name, addresses, listeners]
      properties:
        gateway_class_name: { type: string, minLength: 1, maxLength: 253 }
        addresses:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/KubernetesGatewayAddress" }
        listeners:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesGatewayListener" }
    KubernetesResourceCondition:
      type: object
      additionalProperties: false
      required: [type, status, reason, message, observed_generation, last_transition_time]
      properties:
        type: { type: string }
        status: { type: string, enum: ["True", "False", Unknown] }
        reason: { type: string }
        message: { type: string }
        observed_generation: { type: integer, format: int64, minimum: 0 }
        last_transition_time: { $ref: "#/components/schemas/Timestamp" }
    KubernetesGatewayListenerStatus:
      type: object
      additionalProperties: false
      required: [name, attached_routes, conditions]
      properties:
        name: { type: string }
        attached_routes: { type: integer, minimum: 0 }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/KubernetesResourceCondition" }
    KubernetesGatewayView:
      type: object
      additionalProperties: false
      required: [spec, addresses, conditions, listeners]
      properties:
        spec: { $ref: "#/components/schemas/KubernetesGatewaySpec" }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/KubernetesGatewayAddress" }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/KubernetesResourceCondition" }
        listeners:
          type: array
          items: { $ref: "#/components/schemas/KubernetesGatewayListenerStatus" }
    KubernetesGatewayRouteReference:
      type: object
      additionalProperties: false
      required: [group, kind, namespace, name, section_name, port, weight, rule]
      properties:
        group: { type: string, maxLength: 253 }
        kind: { type: string, maxLength: 253 }
        namespace: { type: string, maxLength: 63 }
        name: { type: string, minLength: 1, maxLength: 253 }
        section_name: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 0, maximum: 65535 }
        weight: { type: integer, minimum: 0, maximum: 1000000 }
        rule:
          type: integer
          minimum: -1
          description: 后端所在规则的零基下标；ParentRef 为 -1。
    KubernetesGatewayRouteParentStatus:
      type: object
      additionalProperties: false
      required: [parent, controller_name, conditions]
      properties:
        parent: { $ref: "#/components/schemas/KubernetesGatewayRouteReference" }
        controller_name: { type: string }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/KubernetesResourceCondition" }
    KubernetesGatewayRouteView:
      type: object
      additionalProperties: false
      required: [spec, hostnames, parent_refs, backend_refs, parents]
      properties:
        spec:
          type: object
          additionalProperties: true
          description: |
            路径类型对应的完整 Kubernetes-native Gateway API spec，字段使用 camelCase。
            Server 按 HTTPRoute/GRPCRoute/TLSRoute/TCPRoute/UDPRoute 的官方 Go 类型严格解码。
        hostnames:
          type: array
          maxItems: 16
          items: { type: string }
        parent_refs:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/KubernetesGatewayRouteReference" }
        backend_refs:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/KubernetesGatewayRouteReference" }
        parents:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/KubernetesGatewayRouteParentStatus" }
    KubernetesGatewayRouteSpecInput:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          type: object
