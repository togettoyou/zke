              minimum: 0
            locked_at:
              $ref: "#/components/schemas/Timestamp"
            lock_expires_at:
              $ref: "#/components/schemas/Timestamp"
            password_changed_at:
              $ref: "#/components/schemas/Timestamp"
            created_at:
              $ref: "#/components/schemas/Timestamp"
            updated_at:
              $ref: "#/components/schemas/Timestamp"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password]
