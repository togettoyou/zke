        target:
          $ref: "#/components/schemas/KubernetesDescribeTarget"
        family:
          type: string
          enum: [pod, workload, node, storage, networking, autoscaling, policy, generic]
          description: |
            对象所属的家族投影。pod、workload、node、storage、networking、autoscaling 与 policy 返回对应详情与诊断结果；
            generic 表示该类型尚无家族规则，只返回身份与 Event。
        pod:
          $ref: "#/components/schemas/KubernetesPodDetail"
        workload:
          $ref: "#/components/schemas/KubernetesWorkloadDetail"
        node:
          $ref: "#/components/schemas/KubernetesNodeDetail"
        node_resources:
          $ref: "#/components/schemas/KubernetesDescribeNodeResources"
        storage:
          $ref: "#/components/schemas/KubernetesStorageResourceDetail"
        networking:
          $ref: "#/components/schemas/KubernetesNetworkingResourceDetail"
        service_endpoints:
          $ref: "#/components/schemas/KubernetesDescribeServiceEndpoints"
        ingress_backends:
          $ref: "#/components/schemas/KubernetesDescribeIngressBackends"
        gateway_status:
          $ref: "#/components/schemas/KubernetesDescribeGatewayStatus"
        autoscaler:
          $ref: "#/components/schemas/KubernetesHPADetail"
        vertical_pod_autoscaler:
          $ref: "#/components/schemas/KubernetesVPADetail"
        keda_scaled_object:
          $ref: "#/components/schemas/KubernetesKEDADetail"
        autoscaler_target:
          $ref: "#/components/schemas/KubernetesDescribeRelatedObject"
        policy:
          $ref: "#/components/schemas/KubernetesPolicyResourceDetail"
        policy_status:
          $ref: "#/components/schemas/KubernetesDescribePolicyStatus"
        related:
          $ref: "#/components/schemas/KubernetesDescribeRelated"
        events:
          $ref: "#/components/schemas/KubernetesDescribeEvents"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeFinding"
        degraded_sections:
          type: array
          description: |
            请求了但没有拿到的部分。为空表示结果完整；静默丢弃某一部分会被读成
            “这里没有问题”，因此缺失必须显式说明。
          items:
            type: string
            enum: [events, events.related, related, related.persistent_volume_claims, node.resources, service.endpoints, ingress.backends, ingress.endpoints, autoscaler.target]
    KubernetesDescribeServiceEndpoints:
      type: object
      additionalProperties: false
      required:
        - endpoint_slices
        - endpoints
        - ready_endpoints
        - serving_endpoints
        - terminating_endpoints
        - truncated
      properties:
        endpoint_slices: { type: integer, format: int64, minimum: 0 }
        endpoints: { type: integer, format: int64, minimum: 0 }
        ready_endpoints: { type: integer, format: int64, minimum: 0 }
        serving_endpoints: { type: integer, format: int64, minimum: 0 }
        terminating_endpoints: { type: integer, format: int64, minimum: 0 }
        truncated:
          type: boolean
          description: EndpointSlice 列表还有下一页；端点计数为下限，不用于生成缺失端点结论。
    KubernetesDescribeIngressBackends:
      type: object
      additionalProperties: false
      required: [items, truncated, services_truncated, endpoint_slices_truncated]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeIngressBackend"
        truncated:
          type: boolean
          description: Ingress 引用的唯一 Service/端口组合超过本次最多处理的 20 个。
        services_truncated:
          type: boolean
          description: Namespace 的 Service 清单还有下一页；未出现的 Service 状态为未知而非不存在。
        endpoint_slices_truncated:
          type: boolean
          description: 相关 EndpointSlice 还有下一页；端点计数为下限且不生成缺失端点结论。
    KubernetesDescribeIngressBackend:
      type: object
      additionalProperties: false
      required:
        - service_name
        - port_name
        - port_number
        - references
        - endpoint_state_available
        - endpoint_slices
        - endpoints
        - ready_endpoints
        - findings
      properties:
        service_name: { type: string }
        port_name: { type: string }
        port_number: { type: integer, format: int32 }
        references:
          type: array
          items: { type: string }
        service_found:
          type: boolean
          description: 未出现表示 Service 清单被截断，无法确认该 Service 是否存在。
        port_found:
          type: boolean
          description: 仅在 Service 已找到时出现。
        endpoint_state_available:
          type: boolean
        endpoint_slices: { type: integer, format: int64, minimum: 0 }
        endpoints: { type: integer, format: int64, minimum: 0 }
        ready_endpoints: { type: integer, format: int64, minimum: 0 }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeFinding"
    KubernetesDescribeGatewayStatus:
      type: object
      additionalProperties: false
      required: [listeners]
      properties:
        listeners:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeGatewayListenerStatus"
    KubernetesDescribeGatewayListenerStatus:
      type: object
      additionalProperties: false
      required: [name, attached_routes, findings]
      properties:
        name: { type: string }
        attached_routes: { type: integer, format: int32, minimum: 0 }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeFinding"
    KubernetesDescribePolicyStatus:
      type: object
      additionalProperties: false
      required: [quota_usage]
      properties:
        quota_usage:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribePolicyQuotaUsage"
    KubernetesDescribePolicyQuotaUsage:
      type: object
      additionalProperties: false
      required: [resource, used, hard, exhausted]
      properties:
        resource: { type: string }
        used: { type: string }
        hard: { type: string }
        exhausted: { type: boolean }
    KubernetesDescribeNodeResources:
      type: object
      additionalProperties: false
      required:
        - cpu_allocatable_millis
        - cpu_requested_millis
        - memory_allocatable_bytes
        - memory_requested_bytes
        - pod_allocatable
        - non_terminal_pods
        - truncated
      properties:
        cpu_allocatable_millis:
          type: integer
          format: int64
          minimum: 0
        cpu_requested_millis:
          type: integer
          format: int64
          minimum: 0
        memory_allocatable_bytes:
          type: integer
          format: int64
          minimum: 0
        memory_requested_bytes:
          type: integer
          format: int64
          minimum: 0
        pod_allocatable:
          type: integer
          format: int64
          minimum: 0
        non_terminal_pods:
          type: integer
          format: int64
          minimum: 0
        truncated:
          type: boolean
          description: Pod 列表还有下一页；requests 为下限，不用于生成比例结论。
    KubernetesDescribeRelated:
      type: object
      additionalProperties: false
      required: [controllers, pods, persistent_volume_claims, truncated]
      description: |
        工作负载与运行它的 Pod 之间的对象。两组分开的原因是它们回答不同的问题：
        Deployment 的 ReplicaSet 是「Pod 还没被创建出来」的记录位置（配额或准入策略在 Pod
        存在之前就拒绝了它），Pod 则记录创建之后发生的一切。
      properties:
        controllers:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeRelatedObject"
        pods:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeRelatedObject"
        persistent_volume_claims:
          type: array
          description: 工作负载 Pod 模板引用的 PVC；Pending 的排在前面并携带 PVCPending 结论。
          items:
            $ref: "#/components/schemas/KubernetesDescribeRelatedObject"
        truncated:
          type: boolean
          description: 工作负载拥有或引用的关联对象多于本次返回；不保证被省略的对象均为健康状态。
    KubernetesDescribeRelatedObject:
      type: object
      additionalProperties: false
      required: [kind, name, uid, namespace, status, ready, findings]
      properties:
        kind:
          type: string
        name:
          type: string
        uid:
          type: string
        namespace:
          type: string
        status:
          type: string
          description: 对象对自身的概括：Pod/PVC 的 phase，ReplicaSet 或 Job 的副本计数。
        ready:
          type: boolean
        findings:
          type: array
          description: 按该对象所属家族的规则得出的结论。工作负载的失败原因通常在这里，而不在工作负载自身。
          items:
            $ref: "#/components/schemas/KubernetesDescribeFinding"
    KubernetesDescribeTarget:
      type: object
      additionalProperties: false
      required: [api_version, kind, namespace, name, uid, resource_version]
      description: |
        实际被描述的对象，取自集群中的活对象而非请求参数：以请求名称配上另一个对象的
        Event，比没有 describe 更糟。
      properties:
        api_version:
          type: string
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
        uid:
          type: string
        resource_version:
          type: string
    KubernetesDescribeEvents:
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        items:
          type: array
          description: |
            按 last_seen（缺失时取 first_seen）倒序，最近的一条在最前。工作负载会把它自身、
            其下控制器与 Pod 的 Event 合并后再排序；超出窗口时丢弃最旧的一段。
          items:
            $ref: "#/components/schemas/KubernetesDescribeEvent"
        truncated:
          type: boolean
          description: 集群中属于该对象的 Event 多于本次窗口。
        omitted:
          type: string
          enum: [unsupported_scope, unavailable]
          description: |
            Event 为空的原因，仅在并非“确实没有 Event”时出现。
            unsupported_scope：Cluster 级对象，不猜测 Event 所在 Namespace；
            unavailable：Event 读取本身失败，对象部分仍然有效。
    KubernetesDescribeEvent:
      type: object
      additionalProperties: false
      required: [uid, name, type, reason, message, count, source, regarding]
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          type: string
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
          format: int32
        source:
          type: string
          description: 上报者，取 source.component 或 reportingController。
        container:
          type: string
          description: |
            Event 指向的容器，取自 involvedObject.fieldPath 中的
            `spec.containers{name}`；对象级 Event 没有该字段。
        regarding:
          $ref: "#/components/schemas/KubernetesDescribeEventSubject"
        first_seen:
          $ref: "#/components/schemas/Timestamp"
        last_seen:
          $ref: "#/components/schemas/Timestamp"
    KubernetesDescribeEventSubject:
      type: object
      additionalProperties: false
      required: [kind, name, uid]
      description: |
        Event 所指向的对象。工作负载的 describe 会把工作负载、其下控制器与 Pod 的 Event 合成
        一条时间线，「某个容器起不来」这句话必须说明是哪个 Pod 的。
      properties:
        kind:
          type: string
        name:
          type: string
        uid:
          type: string
    KubernetesDescribeFinding:
      type: object
      additionalProperties: false
      required: [code, severity, evidence]
      description: |
        对象没有按预期运行的一条原因。只携带稳定 code 与上游原文，不携带服务端自撰的解释：
        面向用户的措辞属于 Console，而在 Kubernetes 消息之上再编一层说明，正是 describe
        开始说出集群从未说过的话的方式。evidence 指明结论的来源，便于跳转与复核。
      properties:
        code:
          type: string
          enum:
            - PodUnschedulable
            - ImagePullFailure
            - ContainerConfigError
            - CrashLoopBackOff
            - ContainerTerminated
            - OOMKilled
            - VolumeMountFailure
            - ProbeFailure
            - PVCPending
            - WorkloadProgressStalled
            - ReplicaCreateRejected
            - WorkloadFailed
            - NodeNotReady
            - NodeMemoryPressure
            - NodeDiskPressure
            - NodePIDPressure
            - NodeNetworkUnavailable
            - NodeSchedulingDisabled
            - NodeCPURequestsHigh
            - NodeMemoryRequestsHigh
            - NodePodCapacityHigh
            - ServiceNoEndpoints
            - ServiceNoReadyEndpoints
            - ServiceLoadBalancerPending
            - IngressAddressPending
            - IngressControllerRejected
            - IngressBackendServiceNotFound
            - IngressBackendPortNotFound
            - IngressBackendNoEndpoints
            - IngressBackendNoReadyEndpoints
            - GatewayAddressPending
            - GatewayNotAccepted
            - GatewayNotProgrammed
            - GatewayNotReady
            - GatewayListenerNotAccepted
            - GatewayListenerNotProgrammed
            - GatewayListenerConflicted
            - GatewayListenerReferencesInvalid
            - GatewayRouteUnattached
            - GatewayRouteNotAccepted
            - GatewayRouteReferencesInvalid
            - GatewayRoutePartiallyInvalid
            - HPAStatusStale
            - HPAUnableToScale
            - HPAMetricsUnavailable
            - HPAScalingLimited
            - VPAStatusStale
            - VPARecommendationUnavailable
            - VPAConfigurationUnsupported
            - VPANoPodsMatched
            - VPALowConfidence
            - KEDANotReady
            - KEDAFallbackActive
            - ResourceQuotaExhausted
            - PDBNoDisruptionsAllowed
        severity:
          type: string
          enum: [warning]
          description: findings 只报告问题，因此只有一个级别。
        scope:
          type: string
          description: 结论所属容器；对象级结论没有该字段。
        reason:
          type: string
          description: Kubernetes 原始 reason。
        message:
          type: string
          description: 上游消息原文，未经改写。
        exit_code:
          type: integer
          format: int32
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeEvidence"
    KubernetesDescribeEvidence:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [Condition, ContainerState, Event, ObjectStatus]
        name:
          type: string
          description: Condition 类型、容器名、Event UID，或对象状态字段名。
    KubernetesPodExecSessionRequest:
      type: object
      additionalProperties: false
      required: [uid, container, columns, rows, confirm]
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 256
          description: 当前 Pod UID；Agent 在打开 Exec 前再次校验。
        container:
          type: string
          minLength: 1
          maxLength: 63
        columns:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4096
        rows:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4096
        confirm:
          const: true
        record_output:
          type: boolean
          default: false
          description: |
            显式选择仅录制服务端返回的 stdout/stderr；不录制 stdin、Cookie、票据或认证头。
            设为 true 还需要 cluster.pod.terminal_recording.create 权限。
    ClusterTerminalSessionRequest:
      type: object
      additionalProperties: false
      required: [columns, rows, confirm]
      properties:
        columns:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4096
        rows:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4096
        confirm:
          const: true
    KubernetesPodExecSession:
      type: object
      additionalProperties: false
      required: [session_id, expires_at, websocket_path, subprotocol]
      properties:
        session_id:
          $ref: "#/components/schemas/UUID"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        websocket_path:
          type: string
        subprotocol:
          type: string
          const: zke.pod-exec.v1
        recording_id:
          $ref: "#/components/schemas/UUID"
    KubernetesPodLogFrame:
      description: application/x-ndjson 每行一个对象；最后一行必须是 end 帧。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type:
              const: chunk
            data:
              type: string
              format: byte
        - type: object
          additionalProperties: false
          required: [type, result, bytes, limit_reached]
          properties:
            type:
              const: end
            result:
              type: string
              enum: [succeeded, limit_reached, timeout, canceled, access_revoked, failed]
            reason:
              type: string
            message:
              type: string
            bytes:
              type: integer
              format: uint64
            limit_reached:
              type: boolean
    KubernetesPodTerminalRecordingFrame:
      type: object
      additionalProperties: false
      required: [offset_ms, stream, data]
      properties:
        offset_ms:
          type: integer
          format: int64
          minimum: 0
        stream:
          type: string
          enum: [stdout, stderr]
        data:
          type: string
          format: byte
    KubernetesPodTerminalRecording:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - cluster_id
        - namespace
        - pod_name
        - pod_uid
        - container
        - columns
        - rows
        - started_at
        - ended_at
        - expires_at
        - result
        - exit_code
        - output_bytes
        - recording_bytes
        - truncated
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        user_id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: 会话运行时集群所属租户。集群已删除且录像晚于删除写入时缺省。
        project_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: 会话运行时集群所属项目。缺省条件同 tenant_id。
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
          description: 会话运行时的集群名称快照，用于集群删除后仍可读。
        namespace:
          type: string
        pod_name:
          type: string
        pod_uid:
          type: string
        container:
          type: string
        columns:
          type: integer
          format: uint32
        rows:
          type: integer
          format: uint32
        started_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        result:
          type: string
          enum: [succeeded, output_limit, timeout, canceled, failed]
        exit_code:
          type: integer
          format: int32
        output_bytes:
          type: integer
          format: uint64
        recording_bytes:
          type: integer
          format: uint64
        truncated:
          type: boolean
        frames:
          type: array
          description: 列表响应省略；详情响应返回按时间顺序排列的输出帧。
          items:
            $ref: "#/components/schemas/KubernetesPodTerminalRecordingFrame"
    KubernetesPodAccessSessionRequest:
      type: object
      additionalProperties: false
      required: [uid, port, session_duration_seconds, confirm]
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 256
          description: 当前 Pod UID；Agent 在建立传输前再次校验。
        port:
          type: integer
          format: uint32
          minimum: 1
          maximum: 65535
          description: Pod 内监听的单个 HTTP 端口。
        session_duration_seconds:
          type: integer
          format: int64
          enum: [900, 1800, 3600]
          description: 用户选择的访问会话最长持续秒数；同时受 Server 配置的最大时长限制。
        replace_existing:
          type: boolean
          description: 同一 Pod 已有待激活地址或访问会话时，是否明确结束旧入口并创建新地址；省略时为 false。
        confirm:
          const: true
    KubernetesPodAccessSession:
      type: object
      additionalProperties: false
      required: [access_url, activation_expires_at, session_expires_in_seconds]
      properties:
        access_url:
          type: string
          format: uri
          description: 位于独立 Pod Access Origin 的一次性激活地址。
        activation_expires_at:
          $ref: "#/components/schemas/Timestamp"
        session_expires_in_seconds:
          type: integer
          format: int64
          minimum: 1
          description: 激活成功后访问会话的最长持续秒数。
    KubernetesPodExecClientMessage:
      description: |
        WebSocket 客户端消息。type=stdin 时 data 为必填 Base64；type=resize 时
        columns 和 rows 必填；type=close_stdin 不携带其他字段。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type:
              const: stdin
            data:
              type: string
              format: byte
        - type: object
          additionalProperties: false
          required: [type, columns, rows]
          properties:
            type:
              const: resize
            columns:
              type: integer
              minimum: 1
              maximum: 4096
            rows:
              type: integer
              minimum: 1
              maximum: 4096
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              const: close_stdin
    KubernetesPodExecServerMessage:
      description: |
        WebSocket 服务端消息。stdout/stderr 的 data 是 Base64；exit 是唯一终止帧，
        携带退出码、结果、输出字节数和是否命中输出上限。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type:
              type: string
              enum: [stdout, stderr]
            data:
              type: string
              format: byte
        - type: object
          additionalProperties: false
          required: [type, result]
          properties:
            type:
              const: exit
            result:
              type: string
              enum: [ok, invalid_argument, unauthenticated, forbidden, not_found, conflict, resource_exhausted, unavailable, timeout, canceled, internal]
            exit_code:
              type: integer
              format: int32
            reason:
              type: string
            message:
              type: string
            output_bytes:
              type: integer
              format: uint64
              minimum: 0
            output_limit_reached:
              type: boolean
        - type: object
          additionalProperties: false
          required: [type, recording_id, recording_saved]
          properties:
            type:
              const: recording
            recording_id:
              $ref: "#/components/schemas/UUID"
            recording_saved:
              type: boolean
    KubernetesEvictPodRequest:
      type: object
      additionalProperties: false
      required: [uid, confirm]
      properties:
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际驱逐必须为 true；dry-run 可以为 false。
        uid:
          type: string
          minLength: 1
          maxLength: 128
          description: 当前 Pod UID，防止驱逐同名重建对象。
        grace_period_seconds:
          type: [integer, "null"]
          minimum: 0
    KubernetesPodEvictionResult:
      type: object
      additionalProperties: false
      required: [namespace, name, uid, dry_run, evicted]
      properties:
        namespace:
          type: string
        name:
          type: string
        uid:
          type: string
        dry_run:
          type: boolean
        evicted:
          type: boolean
          description: dry-run 预览恒为 false——预览只说明 Kubernetes 会不会允许这次驱逐。
    KubernetesDeletePodRequest:
      type: object
      additionalProperties: false
      required: [uid, confirm]
      properties:
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际删除必须为 true；dry-run 可以为 false。
        uid:
          type: string
          minLength: 1
          maxLength: 128
          description: 当前 Pod UID，防止误删同名重建对象。
        resource_version:
          type: string
          maxLength: 256
        grace_period_seconds:
          type: [integer, "null"]
          minimum: 0
        propagation_policy:
          type: string
          enum: ["", orphan, background, foreground]
    KubernetesNodeAddress:
      type: object
      additionalProperties: false
      required: [type, address]
      properties:
        type:
          type: string
        address:
          type: string
    KubernetesNodeTaint:
      type: object
      additionalProperties: false
      required: [key, value, effect]
      properties:
        key:
          type: string
        value:
          type: string
        effect:
          type: string
        time_added:
          $ref: "#/components/schemas/Timestamp"
    KubernetesNodeCondition:
      type: object
      additionalProperties: false
      required:
        - type
        - status
        - reason
        - message
        - last_heartbeat_time
        - last_transition_time
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        message:
          type: string
        last_heartbeat_time:
          $ref: "#/components/schemas/Timestamp"
        last_transition_time:
          $ref: "#/components/schemas/Timestamp"
    KubernetesNodeDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesNodeSummary"
        - type: object
          required:
            - labels
            - annotations
            - provider_id
            - pod_cidr
            - pod_cidrs
            - addresses
            - taints
            - conditions
            - architecture
            - boot_id
            - machine_id
            - system_uuid
          properties:
            labels:
              type: object
              additionalProperties:
                type: string
            annotations:
              type: object
              additionalProperties:
                type: string
            provider_id:
              type: string
            pod_cidr:
              type: string
            pod_cidrs:
              type: array
              items:
                type: string
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeAddress"
            taints:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeTaint"
            conditions:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeCondition"
            architecture:
              type: string
            boot_id:
              type: string
            machine_id:
              type: string
            system_uuid:
              type: string
    AgentEndpointProfile:
      type: object
      additionalProperties: false
      required: [id, name, registration_url, quic_address, registration_ca_certificate_pem, enabled, status, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string, minLength: 1, maxLength: 128 }
        registration_url: { type: string, format: uri }
        quic_address: { type: string }
        registration_ca_certificate_pem: { type: string }
        enabled: { type: boolean }
        status: { type: string, enum: [ready, disabled, unavailable] }
        revision: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AgentEndpointProfileWrite:
      type: object
      additionalProperties: false
      required: [name, registration_url, quic_address, registration_ca_certificate_pem, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        registration_url: { type: string, format: uri }
        quic_address: { type: string }
        registration_ca_certificate_pem: { type: string }
        enabled: { type: boolean }
    WorkloadSettings:
      type: object
      additionalProperties: false
      required: [image, image_pull_policy, cpu_request, memory_request, cpu_limit, memory_limit]
      description: |
        ZKE 装进目标集群的一个工作负载：跑哪个镜像，以及最多能占用集群多少资源。
      properties:
        image: { type: string, maxLength: 512 }
        image_pull_policy: { type: string, enum: [Always, IfNotPresent, Never] }
        cpu_request:
          type: string
          maxLength: 32
          description: |
            容器上的 Kubernetes 数量，例如 `50m`。空字符串表示不在容器上设置该项——
            Kubernetes 没有别的方式表达「不限制」，把预算交给目标 Namespace 的
            LimitRange 时就留空。限制不能低于对应的请求。
        memory_request: { type: string, maxLength: 32 }
        cpu_limit: { type: string, maxLength: 32 }
        memory_limit: { type: string, maxLength: 32 }
    PlatformSettings:
      type: object
      additionalProperties: false
      required: [default_endpoint_profile_id, workloads, cluster_terminal_session_ttl_seconds, revision, updated_at]
      properties:
        default_endpoint_profile_id: { $ref: "#/components/schemas/UUID" }
        workloads:
          type: object
          additionalProperties: { $ref: "#/components/schemas/WorkloadSettings" }
          description: |
            按工作负载名索引，当前为 `agent`、`cluster-terminal`、`collector`、
            `kube-state-metrics`、`node-exporter`。名单由 Server 声明：后续新增的工作
            负载会直接出现在这里，不改变本结构。指标采集的三个名字与集群内组件状态
            上报使用的名字相同。
        cluster_terminal_session_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: Cluster Terminal Pod 存续时长，创建新会话时读取，无需重启 Server。
        revision: { type: integer, minimum: 1 }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    PlatformSettingsUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision]
      description: |
        增量更新：只写出现在请求里的工作负载与字段，其余保持已存储的值。平台配置按分区
        分别保存，整体覆盖会让一次保存带上操作者当前并未查看的值。
      properties:
        workloads:
          type: object
          additionalProperties: { $ref: "#/components/schemas/WorkloadSettings" }
          description: 本次要修改的工作负载。未列出的工作负载保持不变；名字未被 Server 声明会被拒绝。
        cluster_terminal_session_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: 省略表示不修改。
        expected_revision: { type: integer, minimum: 1 }
    AISession:
      type: object
      additionalProperties: false
      required: [id, tenant_id, project_id, cluster_id, title, status, approval_mode, current_turn, last_turn_status, last_turn_failure, created_at, last_activity_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        tenant_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: 创建会话时 Console 的当前 Tenant。
        project_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: 创建会话时 Console 的当前 Project；用于按桌面环境隔离会话列表。
        cluster_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: 会话创建时选定且不可切换的唯一目标 Cluster。
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [idle, working] }
        approval_mode: { type: string, enum: [ask, assisted, full] }
        current_turn: { type: integer, format: int32, minimum: 0 }
        last_turn_status: { type: string, enum: ["", succeeded, failed, canceled] }
        last_turn_failure: { type: string, maxLength: 64 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_activity_at: { $ref: "#/components/schemas/Timestamp" }
        archived_at: { $ref: "#/components/schemas/Timestamp" }
    AISessionCreate:
      type: object
      additionalProperties: false
      required: [tenant_id, project_id, cluster_id, title]
      properties:
        tenant_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: 必须是 Console 当前桌面环境的 Tenant。
        project_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: 必须是 Console 当前桌面环境的 Project。
        cluster_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: 必须属于 project_id；会话创建后不可切换。
        title: { type: string, minLength: 1, maxLength: 200 }
        approval_mode: { type: string, enum: [ask, assisted, full], default: ask }
    AISessionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        archived: { type: boolean }
        approval_mode:
          type: string
          enum: [ask, assisted, full]
          description: 记录会话的审批策略并在运行中切换时写入 system 轨迹；敏感工具在 ask 与 assisted 下会产生审批请求。
    AIEvidence:
      type: object
      additionalProperties: false
      required: [kind, cluster]
      properties:
        kind: { type: string, enum: [resource, event, metric, log, helm_release] }
        cluster:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: 必须等于所属会话固定的 cluster_id。
        tenant_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          readOnly: true
          description: Server 根据 Cluster 解析的证据深链导航提示，不参与授权。
        project_id:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          readOnly: true
          description: Server 根据 Cluster 解析的证据深链导航提示，不参与授权。
        namespace: { type: string, maxLength: 253 }
        gvk: { type: string, maxLength: 256 }
        name: { type: string, maxLength: 253 }
        resource_version: { type: string, maxLength: 128 }
        query: { type: string, maxLength: 256 }
        expression:
          type: string
          maxLength: 4096
          description: AIOps 执行过的自定义 MetricsQL 表达式；与具名查询 query 二选一，用于打开监控数据探索。
        parameters: { type: string, maxLength: 4096 }
        container: { type: string, maxLength: 253 }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
    AITurnStart:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 32768 }
        evidence:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/AIEvidence" }
        attachment_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items: { $ref: "#/components/schemas/UUID" }
    AIApprovalDecision:
      type: object
      additionalProperties: false
      required: [call_id, decision]
      properties:
        call_id:
          type: string
          maxLength: 256
          description: approval_request 轨迹事件中的 call_id。
        decision: { type: string, enum: [approved, denied] }
    AIQuota:
      type: object
      additionalProperties: false
      required: [period_start, period_end, turns_used, turns_limit, input_tokens, output_tokens, tokens_used, tokens_limit, exhausted]
      properties:
        period_start: { $ref: "#/components/schemas/Timestamp" }
        period_end: { $ref: "#/components/schemas/Timestamp" }
        turns_used: { type: integer, format: int64, minimum: 0 }
        turns_limit:
          type: integer
          format: int64
          minimum: 0
          description: 0 表示不限制。
        input_tokens: { type: integer, format: int64, minimum: 0 }
        output_tokens: { type: integer, format: int64, minimum: 0 }
        tokens_used: { type: integer, format: int64, minimum: 0 }
        tokens_limit:
          type: integer
          format: int64
          minimum: 0
          description: 0 表示不限制。
        exhausted: { type: boolean }
    AITurnFeedbackUpdate:
      type: object
      additionalProperties: false
      required: [rating, outcome]
      properties:
        rating: { type: string, enum: [helpful, not_helpful] }
        outcome: { type: string, enum: [resolved, unresolved, unsure] }
        reasons:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [inaccurate, insufficient_evidence, incomplete, unsafe, hard_to_follow, other]
        comment: { type: string, maxLength: 1000 }
    AITurnFeedback:
      allOf:
        - $ref: "#/components/schemas/AITurnFeedbackUpdate"
        - type: object
          additionalProperties: false
          required: [session_id, turn, reasons, comment, created_at, updated_at]
          properties:
            session_id: { $ref: "#/components/schemas/UUID" }
            turn: { type: integer, format: int32, minimum: 1 }
            reasons:
              type: array
              items: { type: string }
            comment: { type: string }
            created_at: { $ref: "#/components/schemas/Timestamp" }
            updated_at: { $ref: "#/components/schemas/Timestamp" }
    AIEvaluation:
      type: object
      additionalProperties: false
      required: [from, to, turns, succeeded, failed, canceled, rated, helpful, resolved, tool_calls, duration_ms, failure_counts, reason_counts]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        turns: { type: integer, format: int64, minimum: 0 }
        succeeded: { type: integer, format: int64, minimum: 0 }
        failed: { type: integer, format: int64, minimum: 0 }
        canceled: { type: integer, format: int64, minimum: 0 }
        rated: { type: integer, format: int64, minimum: 0 }
        helpful: { type: integer, format: int64, minimum: 0 }
        resolved: { type: integer, format: int64, minimum: 0 }
        tool_calls: { type: integer, format: int64, minimum: 0 }
        duration_ms: { type: integer, format: int64, minimum: 0 }
        failure_counts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        reason_counts:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
    AITool:
      type: object
      additionalProperties: false
      required: [name, description, permissions, conditional_permissions, sensitive, conditionally_sensitive, mutating]
      properties:
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
          description: 运行时在每次调用前针对发起用户和目标 Cluster 重验的固定权限，全部满足才执行。
        conditional_permissions:
          type: array
          items: { type: string }
          description: 工具按实际目标或逐文档选择并重验的权限；列表中的权限不要求同时持有。
        sensitive:
          type: boolean
          description: 除完全访问模式外都会停下来等待用户批准。
        conditionally_sensitive:
          type: boolean
          description: 是否会按预检后的实际目标升级为敏感操作。
        mutating:
          type: boolean
          description: 会改变集群状态；审批模式据此决定是否在执行前等待用户确认。
    AISkill:
      type: object
      additionalProperties: false
      required: [id, title, summary, tools]
      properties:
        id: { type: string, description: 模型调用 load_skill 时使用的稳定技能 ID。 }
        title: { type: string }
        summary: { type: string, description: 一句话说明什么时候该用它。 }
        tools:
          type: array
          items: { type: string }
          description: 该技能流程会用到的工具名。部署未组装其中任何一个时，这条技能不会出现在目录里。
    AIAttachment:
      type: object
      additionalProperties: false
      required: [id, session_id, name, media_type, size_bytes, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        session_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string, minLength: 1, maxLength: 200 }
        media_type: { type: string, enum: [text/plain, text/markdown, application/json, application/yaml] }
        size_bytes: { type: integer, minimum: 1, maximum: 262144 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AIAttachmentCreate:
      type: object
      additionalProperties: false
      required: [name, media_type, content]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        media_type: { type: string, enum: [text/plain, text/markdown, application/json, application/yaml] }
        content: { type: string, minLength: 1, maxLength: 262144 }
    AIAttachmentExport:
      type: object
      additionalProperties: false
      required: [id, session_id, name, media_type, size_bytes, created_at, content]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        session_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        media_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        content: { type: string }
    AITarget:
      type: object
      additionalProperties: false
      required: [cluster]
      properties:
        cluster: { $ref: "#/components/schemas/UUID" }
        namespace: { type: string }
        gvk: { type: string }
        name: { type: string }
    AITokens:
      type: object
      additionalProperties: false
      required: [input, output, context]
      properties:
        input: { type: integer, minimum: 0 }
        cached_input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        reasoning: { type: integer, minimum: 0 }
        context:
          type: integer
          minimum: 0
          description: 这一步请求占用的上下文总量，优先锚定在端点报告的用量上。
        context_window:
          type: integer
          minimum: 0
          description: 该步骤运行时端点的上下文窗口，与 context 一起记录，便于事后按当时的配置复核。
    AITiming:
      type: object
      additionalProperties: false
      properties:
        first_token_ms:
          type: integer
          minimum: 0
          description: 端点产出第一个 token 的耗时。端点以单个 JSON 文档而不是流应答时没有首 token，该字段缺省。
        elapsed_ms: { type: integer, minimum: 0 }
        streamed: { type: boolean }
    AICompaction:
      type: object
      additionalProperties: false
      required: [method, before_tokens, after_tokens, threshold_tokens, shadowed_from, shadowed_to]
      properties:
        method:
          type: string
          enum: [model_summary, summary]
          description: model_summary 是模型写出的检查点；summary 是摘要调用无法完成时退回的机械摘要。
        trigger:
          type: string
          enum: [pressure, context_overflow]
          description: pressure 是达到压缩阈值，context_overflow 是端点已经拒绝了过大的请求。
        before_tokens: { type: integer, minimum: 1 }
        after_tokens: { type: integer, minimum: 1 }
        threshold_tokens:
          type: integer
          minimum: 1
          description: 触发压缩的压力线，由配置中的压缩比例与端点上下文窗口计算得出。
        retained_tokens:
          type: integer
          minimum: 0
          description: 原样保留的最近尾部大小。
        context_window_tokens: { type: integer, minimum: 0 }
        shadowed_from:
          type: integer
          format: int32
          minimum: 1
          description: 被这份检查点替换的轨迹序号区间起点（含）。
        shadowed_to:
          type: integer
          format: int32
          minimum: 1
          description: 区间终点（含）。重建模型可见上下文时跳过该区间，其后的条目原样保留。
    AITrajectoryContent:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          description: 事件正文；compaction 事件中的正文是后续请求重建模型可见上下文使用的持久摘要。
        step:
          type: integer
          minimum: 1
          description: 该事件属于本轮的第几个模型步骤。一个 Turn 由多个 Step 组成，每个 Step 是一次模型调用及其请求的工具执行。
        tool:
          type: string
          description: 工具调用、结果或审批请求对应的稳定工具名，取自 GET /api/v1/ai/tools 的目录。
        call_id:
          type: string
          description: 模型为这次调用生成的标识，用于把 tool_call、approval_request、approval_decision 和 tool_result 串联起来。
        arguments: { type: string }
        target: { $ref: "#/components/schemas/AITarget" }
        authorized:
          type: boolean
          description: 该调用是否真正被执行。RBAC 拒绝、用户拒绝批准和未知工具都记为 false。
        failed:
          type: boolean
          description: 工具结果没有拿到预期内容；模型收到的也是同样的说明。
        evidence:
          type: array
          items: { $ref: "#/components/schemas/AIEvidence" }
        tokens: { $ref: "#/components/schemas/AITokens" }
        timing: { $ref: "#/components/schemas/AITiming" }
        compaction: { $ref: "#/components/schemas/AICompaction" }
        decision:
          type: string
          enum: [approved, denied]
          description: 对一次 approval_request 的答复。
        tools:
          type: array
          items: { type: string }
          description: 在 system 事件上是本轮允许调用的工具集合；在 model 事件上是该步骤请求调用的工具。
        failure: { type: string }
        mode: { type: string, enum: [ask, assisted, full] }
        untrusted:
          type: boolean
          description: >-
            正文来自附件或目标 Cluster，只能作为数据而不能改变运行时指令、权限或审批状态。
            只有整段正文由 Server 自身提供的工具结果（例如 load_skill 返回的技能流程）不带该标记。
        subtask:
          allOf:
            - $ref: "#/components/schemas/AISubtask"
          description: >-
            该事件属于某个并行子任务分支。主线事件没有这个字段，Console 据此把分支折叠在派发它的那次工具调用下面。
        view:
          allOf:
            - $ref: "#/components/schemas/AIViewIntent"
          description: >-
            AIOps 请求 Console 在操作者桌面上打开的视图，只出现在 open_console_view 的 tool_result 上。
            读取轨迹时按目标类型重新校验权限，失权后该字段不再返回。
    AIViewIntent:
      type: object
      additionalProperties: false
      required: [target, reason]
      properties:
        target:
          allOf: [{ $ref: "#/components/schemas/AIEvidence" }]
          description: 要展示的对象或指标，与证据深链使用同一套引用与权限。
        run:
          type: boolean
          description: >-
            接收方应在打开后立即执行所带查询，而不只是把它写进编辑器。只有指标目标会带这个标记。
        reason:
          type: string
          maxLength: 512
          description: 模型给出的一句话说明，Console 原样显示，是操作者对这次非自己发起的打开动作的唯一说明。
    AISubtask:
      type: object
      additionalProperties: false
      required: [id, call_id, index]
      properties:
        id: { type: string, description: 分支在本会话内的唯一标识。 }
        call_id:
          type: string
          description: 派发该分支的 run_subtasks 工具调用标识，用于把分支挂回主线的那一次调用。
        index: { type: integer, minimum: 1, description: 分支在该次派发中的序号，从 1 开始。 }
        goal:
          type: string
          description: 分支要查清的目标，只出现在开启该分支的 system 事件上。
    AITrajectoryEntry:
      type: object
      additionalProperties: false
      required: [sequence, turn, kind, occurred_at, duration_ms, truncated, content]
      properties:
        sequence: { type: integer, format: int32, minimum: 1 }
        turn: { type: integer, format: int32, minimum: 1 }
        kind:
          type: string
          enum: [system, input, context, model, reasoning, tool_call, tool_result, approval_request, approval_decision, compaction, conclusion, error]
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        duration_ms: { type: integer, format: int64, minimum: 0 }
        truncated: { type: boolean }
        content: { $ref: "#/components/schemas/AITrajectoryContent" }
    AISessionExport:
      type: object
      additionalProperties: false
      required: [session, trajectory, attachments]
      properties:
        session: { $ref: "#/components/schemas/AISession" }
        trajectory:
          type: array
          items: { $ref: "#/components/schemas/AITrajectoryEntry" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AIAttachmentExport" }
    AIModelSettings:
      type: object
      additionalProperties: false
      required: [enabled, base_url, model, api_protocol, api_key_configured, context_window_tokens, max_output_tokens, request_timeout_seconds, revision, updated_at]
      properties:
        enabled:
          type: boolean
          description: |
            默认开启，并预置一个可用的接入地址、协议与模型名；只有 API Key 留空，需要部署方补齐。
            关闭时保留配置，但停止新的 AIOps 模型运行。
        base_url:
          type: string
          maxLength: 2048
          description: |
            OpenAI 兼容端点的 Base URL，不含尾部斜杠，例如 `https://inference.internal/v1`。
            Server 按所选协议在其后追加 `/responses` 或 `/chat/completions`。
        model:
          type: string
          maxLength: 256
          description: 由管理员填写。Server 不内置任何厂商模型清单。
        api_protocol:
          type: string
          enum: [responses, chat_completions]
          description: Responses 适合长任务与原生压缩；Chat Completions 用于兼容自建推理服务。
        api_key_configured:
          type: boolean
          description: 是否已配置 API Key。写入后不回显，读取接口不返回明文也不返回密文。
        context_window_tokens:
          type: integer
          minimum: 16384
          maximum: 4000000
          description: |
            模型可接收的总上下文窗口。运行时按 Server 配置中的压缩比例乘以该窗口得到压缩阈值，
            因此更换模型只需要改这里，不需要再维护一个绝对的 token 阈值。
        max_output_tokens:
          type: integer
          minimum: 1024
          maximum: 262144
          description: 单次模型响应预留的最大输出空间。
        request_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
          description: 单次模型调用的上限。
        revision: { type: integer, minimum: 1 }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AIModelSettingsUpdate:
      type: object
      additionalProperties: false
      required: [base_url, model, api_protocol, context_window_tokens, max_output_tokens, request_timeout_seconds, expected_revision]
      properties:
        base_url: { type: string, maxLength: 2048 }
        model: { type: string, maxLength: 256 }
        api_protocol: { type: string, enum: [responses, chat_completions] }
        api_key:
          type: string
          maxLength: 4096
          description: |
            三态字段：省略保持已存储的凭证，空串清除凭证，其他值替换凭证。已存储的值不会
            返回给浏览器，因此未修改该字段的保存必须省略它，而不是回填。
        context_window_tokens: { type: integer, minimum: 16384, maximum: 4000000 }
        max_output_tokens: { type: integer, minimum: 1024, maximum: 262144 }
        request_timeout_seconds: { type: integer, minimum: 5, maximum: 300 }
        expected_revision: { type: integer, minimum: 1 }
    AIModelEnabledUpdate:
      type: object
      additionalProperties: false
      required: [enabled, expected_revision]
      properties:
        enabled: { type: boolean }
        expected_revision: { type: integer, minimum: 1 }
    AIModelTestResult:
      type: object
      additionalProperties: false
      required: [succeeded, failure, detail, status]
      properties:
        succeeded: { type: boolean }
        failure:
          type: string
          enum: ["", unauthorized, model_not_found, unreachable, timeout, unexpected_response]
          description: 成功时为空串。每个取值对应一件操作者可以去修的事：凭证、模型名或路径、网络、端点自身。
        detail:
          type: string
          description: 由 ZKE 撰写的中文说明，不包含端点返回的正文，也不包含任何凭证内容。
        status:
          type: integer
          description: 端点返回的 HTTP 状态码；未收到响应时为 0。
    ClusterEnrollment:
      type: object
      additionalProperties: false
      required: [id, cluster_name, token, expires_at, endpoint_profile_id, agent_namespace]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        token:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        endpoint_profile_id:
          $ref: "#/components/schemas/UUID"
        agent_namespace:
          $ref: "#/components/schemas/AgentNamespace"
    ClusterEnrollmentRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - project_id
        - cluster_name
        - created_by_user_id
        - status
        - expires_at
        - created_at
        - endpoint_profile_id
        - endpoint_profile_revision
        - agent_namespace
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        created_by_user_id:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
          enum: [active, consumed, expired, revoked]
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        consumed_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        endpoint_profile_id:
          $ref: "#/components/schemas/UUID"
        endpoint_profile_revision:
          type: integer
          minimum: 1
        agent_namespace:
          $ref: "#/components/schemas/AgentNamespace"
    ClusterInstallation:
      type: object
      additionalProperties: false
      required:
        - id
        - cluster_name
        - expires_at
        - manifest_path
        - token
        - endpoint_profile_id
        - agent_namespace
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        manifest_path:
          type: string
        token:
          type: string
        endpoint_profile_id:
          $ref: "#/components/schemas/UUID"
        agent_namespace:
          $ref: "#/components/schemas/AgentNamespace"
    ClusterConnectionRevocation:
      type: object
      additionalProperties: false
      required: [cluster_id, connection_status, revoked_at, already_revoked]
      properties:
        cluster_id:
          $ref: "#/components/schemas/UUID"
        connection_status:
          type: string
          const: revoked
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        already_revoked:
          type: boolean
    AgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [csr_pem, agent_version, protocol_version]
      properties:
        csr_pem:
          type: string
          description: PEM 编码的 ECDSA P-256 PKCS#10 CSR
        agent_version:
          type: string
          minLength: 1
          maxLength: 128
        protocol_version:
          type: string
          const: v1
    AgentEnrollmentResponse:
      type: object
      additionalProperties: false
      required:
        - cluster_id
        - agent_id
        - certificate_pem
        - certificate_expires_at
      properties:
        cluster_id:
          $ref: "#/components/schemas/UUID"
        agent_id:
          $ref: "#/components/schemas/UUID"
        certificate_pem:
          type: string
        certificate_expires_at:
          $ref: "#/components/schemas/Timestamp"
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_type
        - scope_type
        - action
        - target_type
        - result
        - request_id
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        actor_type:
          type: string
          enum: [user, agent, system]
        actor_user_id:
          $ref: "#/components/schemas/UUID"
        actor_user_name:
          type: string
          description: >-
            事件写入时该用户的用户名。审计记录不对用户、Tenant、Project 或 Cluster
            建立外键，因此这些对象被删除后其 ID 不再可解析；随事件一同记录的名称是
            该记录此后唯一可读的身份依据。
        actor_agent_id:
          $ref: "#/components/schemas/UUID"
        scope_type:
          type: string
          enum: [global, tenant, project, cluster]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        tenant_name:
          type: string
          description: 事件写入时该 Tenant 的名称。
        project_id:
          $ref: "#/components/schemas/UUID"
        project_name:
          type: string
          description: 事件写入时该 Project 的名称。
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
          description: 事件写入时该 Cluster 的名称。
        action:
          type: string
        target_type:
          type: string
        target_id:
          $ref: "#/components/schemas/UUID"
        target_name:
          type: string
          description: >-
            事件写入时目标对象的名称。Session、RoleBinding、Agent 与凭证没有名称，
            此字段为空。
        result:
          type: string
          enum: [succeeded, failed, denied]
        request_id:
          type: string
        actor_ip:
          type: string
          description: >-
            发起请求的客户端地址。仅在事件来自用户驱动的 HTTP 请求时记录；
            system 与 agent 发起者、以及在存储事务内写入的事件为空。
        detail:
          type: object
          additionalProperties:
            type: string
          description: >-
            `result` 的结构化原因，键为稳定标识符。例如授权拒绝会记录 `scope_type`，
            以及在实际校验的权限与路由声明的权限不一致时记录 `requested_permission`。
            不承载请求或响应正文、凭证与 Kubernetes 对象内容。
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AuditAction:
      type: object
      additionalProperties: false
      required: [name, group]
      properties:
        name:
          type: string
          description: 写入审计事件 `action` 字段的取值，可直接用作过滤条件。
        group:
          type: string
          enum:
            [
              auth,
              user,
              role,
              role_binding,
              tenant,
              project,
              cluster,
              platform,
              kubernetes_resource,
              aiops,
              denied,
            ]
          description: >-
            所属族。由 Server 声明而非由名称拆分得出——`cluster.delete` 与
            `cluster.enrollment.create` 同族但层级不同，按点号切分会得到错误的分组。
            `denied` 组是鉴权拒绝时记录的权限名，其事件的 `result` 恒为 `denied`。
    AuditTargetType:
      type: string
      description: >-
        写入审计事件 `target_type` 字段的取值，可直接用作过滤条件。与 `action` 一样是
        服务端拥有的封闭词表，客户端不应自行枚举。它描述事件针对的对象类型，与事件所属的
        `scope_type` 不同：`cluster.enrollment.create` 定域于 Project，目标却是 Enrollment。
      enum:
        - user
        - session
        - role
        - role_binding
        - tenant
        - project
        - cluster
        - agent
        - agent_credential
        - enrollment
        - audit_event
        - kubernetes_resource
        - platform_settings
        - agent_endpoint_profile
        - helm_repository
        - metrics_saved_query
        - custom_application
        - ai_session
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [audit_events, pagination]
      properties:
        audit_events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"
