        读取一条尚未过期的终端输出录制及其时间帧。记录必须同时匹配 URL 中的 Cluster UUID、
        Namespace 和 Pod 名称；请求仍需 cluster.pod.terminal_recording.read 权限并写入审计。
      security:
        - sessionCookie: []
