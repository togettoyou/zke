        YAML。响应保留 metadata.uid 与 metadata.resourceVersion，用于后续防误改校验；
        metadata.managedFields 被移除。Secret 和 Subresource 不在该接口范围内。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/KubernetesResourceName"
        - $ref: "#/components/parameters/KubernetesGroup"
        - $ref: "#/components/parameters/KubernetesVersion"
        - $ref: "#/components/parameters/KubernetesResource"
        - $ref: "#/components/parameters/KubernetesNamespace"
      responses:
        "200":
          description: Kubernetes 单资源 YAML
          headers:
            X-ZKE-Dry-Run:
              schema:
                type: string
                const: "false"
            X-ZKE-Resource-UID:
              schema:
                type: string
            X-ZKE-Resource-Version:
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
    put:
      tags: [Resources]
      operationId: updateKubernetesResourceYAML
      description: |
        使用严格的单文档 YAML 更新具名 Kubernetes 主资源，正文最大 4 MiB。
        Server 在更新前核对 URL/GVR/Namespace 与正文身份，并要求正文中的
        metadata.uid 和 metadata.resourceVersion 与实时对象一致。dry_run=true
        调用 Kubernetes API Server DryRun 校验且无需 confirm；实际写入必须提供
        confirm=true。请求正文及其字段不会写入 ZKE 审计记录。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/KubernetesResourceName"
        - $ref: "#/components/parameters/KubernetesGroup"
        - $ref: "#/components/parameters/KubernetesVersion"
        - $ref: "#/components/parameters/KubernetesResource"
        - $ref: "#/components/parameters/KubernetesNamespace"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: dry_run
          in: query
          description: 仅调用 Kubernetes API Server DryRun，不持久化变更。
          schema:
            type: boolean
            default: false
        - name: confirm
          in: query
          description: 实际写入必须为 true；dry-run 可省略。
          schema:
            type: boolean
            default: false
        - name: field_manager
          in: query
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 4194304
      responses:
        "200":
          description: 更新后的 Kubernetes YAML 或 dry-run 预览
          headers:
            X-ZKE-Dry-Run:
              schema:
                type: string
                enum: ["true", "false"]
            X-ZKE-Resource-UID:
              schema:
                type: string
            X-ZKE-Resource-Version:
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/kubernetes/manifests/apply:
    post:
      tags: [Resources]
      operationId: applyKubernetesManifest
      description: |
        以 Server-Side Apply 应用一份多文档 Kubernetes YAML 清单，等价于
        `kubectl apply -f`：对象不存在则创建，存在则合并，field manager 固定为
        `zke-manifest`。正文最大 4 MiB，文档数量有上限。

        权限逐文档判定，不由路由单独决定：Secret 需要 `cluster.secret.manage`，
        Kubernetes RBAC 五类需要 `cluster.rbac.manage`，Namespace 需要
        `cluster.namespace.manage`，其余资源按新建或更新分别需要
        `cluster.resource.create` 或 `cluster.resource.update`。只要有一个文档不被
        当前身份的权限覆盖，整份清单被拒绝且不写入任何对象，返回 403。

        `kube-*`（以及 `default` Namespace 本身）的普通资源写入改用
        `cluster.system_namespace.manage`，Agent Namespace 的普通资源写入改用
        `cluster.agent_namespace.manage`；Secret 与 Kubernetes RBAC 文档在对应
        命名空间权限之外仍要求上述家族专用权限。

        dry_run=true 时逐文档解析、探测存在性、判定权限并调用 Kubernetes DryRun，
        无需 confirm，且始终返回逐文档结果；实际写入必须提供 confirm=true。

        执行按文档顺序进行，遇到第一个失败即停止。Kubernetes 没有事务，因此已写入的
        对象不会回滚，响应逐文档报告 succeeded、failed 与 not_attempted。

        审计按集群中是否真的发生变化决定粒度：dry-run 与被整份拒绝的请求各写一条聚合记录，
        带文档总数与被拒绝数；实际执行逐文档记录。两者都不记录 YAML 正文。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: namespace
          in: query
          description: |
            为未写明 metadata.namespace 的命名空间级文档填充的目标 Namespace。
            文档自带且与之不同时该文档被判为无效，而不是被覆盖；集群级对象不受影响。
          schema:
            type: string
            maxLength: 63
        - name: dry_run
          in: query
          description: 仅规划并调用 Kubernetes API Server DryRun，不持久化变更。
          schema:
            type: boolean
            default: false
        - name: confirm
          in: query
          description: 实际写入必须为 true；dry-run 可省略。
          schema:
            type: boolean
            default: false
        - name: force
          in: query
          description: Server-Side Apply 字段所有权冲突时强制接管，默认拒绝冲突。
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 4194304
      responses:
        "200":
          description: 清单规划或执行结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesManifestResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/kubernetes/manifests/delete:
    post:
      tags: [Resources]
      operationId: deleteKubernetesManifest
      description: |
        删除一份多文档 Kubernetes YAML 清单所描述的对象，等价于
        `kubectl delete -f`。清单只用于指名对象，正文其余字段不参与删除。

        权限逐文档判定，规则与 apply 相同，只是通用资源需要
        `cluster.resource.delete`。有任一文档不被覆盖时整份清单被拒绝。

        每个对象先读取再删除，并携带读到的 UID 与 resourceVersion 作为前置条件，
        因此不会删到同名重建的对象；对象已不存在的文档记为 skipped 而不是失败。

        执行按文档反序进行——清单通常先写容器、后写其中的对象，反序删除才不会在
        文件尚未提到依赖对象时先移除承载它们的对象。遇到第一个失败即停止，
        已删除的对象不会恢复。

        审计按集群中是否真的发生变化决定粒度：dry-run 与被整份拒绝的请求各写一条聚合记录，
        带文档总数与被拒绝数；实际执行逐文档记录，对象本就不存在的文档不记录。
        两者都不记录 YAML 正文。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: namespace
          in: query
          description: |
            为未写明 metadata.namespace 的命名空间级文档填充的目标 Namespace。
          schema:
            type: string
            maxLength: 63
        - name: dry_run
          in: query
          description: 仅规划并调用 Kubernetes API Server DryRun，不实际删除。
          schema:
            type: boolean
            default: false
        - name: confirm
          in: query
          description: 实际删除必须为 true；dry-run 可省略。
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 4194304
      responses:
        "200":
          description: 清单规划或执行结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesManifestResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
