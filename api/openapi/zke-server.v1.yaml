        requested_capacity: { type: string, minLength: 1 }
    KubernetesStorageClassUpdateInput:
      type: object
      additionalProperties: false
      required: [allow_volume_expansion]
      properties:
        allow_volume_expansion: { type: boolean }
    KubernetesUpdateStorageResourceRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        persistent_volume: { $ref: "#/components/schemas/KubernetesPersistentVolumeUpdateInput" }
        persistent_volume_claim: { $ref: "#/components/schemas/KubernetesPersistentVolumeClaimUpdateInput" }
        storage_class: { $ref: "#/components/schemas/KubernetesStorageClassUpdateInput" }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
      oneOf:
        - required: [persistent_volume]
        - required: [persistent_volume_claim]
        - required: [storage_class]
    KubernetesDeleteStorageResourceRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    KubernetesStorageMutationResult:
      type: object
      additionalProperties: false
      required: [resource, dry_run]
      properties:
        resource: { $ref: "#/components/schemas/KubernetesStorageResourceDetail" }
        dry_run: { type: boolean }
    KubernetesStorageDeleteResult:
      type: object
      additionalProperties: false
      required: [deleted, dry_run, target]
      properties:
        deleted: { type: boolean }
        dry_run: { type: boolean }
        target: { type: string }
    KubernetesPolicyResource:
      type: string
      enum: [resourcequotas, limitranges, networkpolicies, poddisruptionbudgets, priorityclasses]
    KubernetesPolicyQuantityMap:
      type: object
      maxProperties: 64
      additionalProperties: { type: string }
    KubernetesPolicyScopeSelectorRequirement:
      type: object
      additionalProperties: false
      required: [scope_name, operator, values]
      properties:
        scope_name:
          type: string
          enum: [Terminating, NotTerminating, BestEffort, NotBestEffort, PriorityClass, CrossNamespacePodAffinity]
        operator: { type: string, enum: [In, NotIn, Exists, DoesNotExist] }
        values:
          type: array
          maxItems: 64
          items: { type: string }
    # `scopes` and `scope_selector` sit alongside `hard` and `used` because both
    # narrow which objects the quota counts: reading usage against a limit
    # without them reads a subset of a Namespace as the whole of it, and a list
    # response does exactly that reading.
    KubernetesResourceQuotaSummary:
      type: object
      additionalProperties: false
      required: [hard, used, scopes, scope_selector]
      properties:
        hard: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        used: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        scopes:
          type: array
          items: { type: string }
        scope_selector:
          type: array
          items: { $ref: "#/components/schemas/KubernetesPolicyScopeSelectorRequirement" }
    KubernetesLimitRangeSummary:
      type: object
      additionalProperties: false
      required: [types, item_count]
      properties:
        types:
          type: array
          items: { type: string }
        item_count: { type: integer, minimum: 0 }
    KubernetesLimitRangeItem:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [Container, Pod, PersistentVolumeClaim] }
        max: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        min: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        default: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        default_request: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        max_limit_request_ratio: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
    KubernetesLimitRangeDetail:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KubernetesLimitRangeItem" }
    KubernetesNetworkPolicySummary:
      type: object
      additionalProperties: false
      required: [policy_types, ingress_rules, egress_rules]
      properties:
        pod_selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        policy_types:
          type: array
          items: { type: string, enum: [Ingress, Egress] }
        ingress_rules: { type: integer, minimum: 0 }
        egress_rules: { type: integer, minimum: 0 }
    KubernetesNetworkPolicyIPBlock:
      type: object
      additionalProperties: false
      required: [cidr]
      properties:
        cidr: { type: string, minLength: 1, maxLength: 128 }
        except:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 128 }
    KubernetesNetworkPolicyPeer:
      type: object
      additionalProperties: false
      properties:
        pod_selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        namespace_selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        ip_block: { $ref: "#/components/schemas/KubernetesNetworkPolicyIPBlock" }
    KubernetesNetworkPolicyPort:
      type: object
      additionalProperties: false
      properties:
        protocol: { type: string, enum: [TCP, UDP, SCTP] }
        port: { type: string, maxLength: 63 }
        end_port: { type: integer, minimum: 1, maximum: 65535 }
    KubernetesNetworkPolicyRule:
      type: object
      additionalProperties: false
      properties:
        peers:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyPeer" }
        ports:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyPort" }
    KubernetesNetworkPolicyDetail:
      type: object
      additionalProperties: false
      required: [ingress, egress]
      properties:
        ingress:
          type: array
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyRule" }
        egress:
          type: array
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyRule" }
    KubernetesDisruptionBudgetSummary:
      type: object
      additionalProperties: false
      required: [min_available, max_unavailable, current_healthy, desired_healthy, disruptions_allowed, expected_pods]
      properties:
        selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        min_available: { type: string }
        max_unavailable: { type: string }
        current_healthy: { type: integer }
        desired_healthy: { type: integer }
        disruptions_allowed: { type: integer }
        expected_pods: { type: integer }
    KubernetesPolicyCondition:
      type: object
      additionalProperties: false
      required: [type, status, reason, message, last_transition_time]
      properties:
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        message: { type: string }
        last_transition_time: { $ref: "#/components/schemas/Timestamp" }
    KubernetesDisruptionBudgetDetail:
      type: object
      additionalProperties: false
      required: [unhealthy_pod_eviction_policy, conditions]
      properties:
        unhealthy_pod_eviction_policy: { type: string }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/KubernetesPolicyCondition" }
    KubernetesPriorityClassSummary:
      type: object
      additionalProperties: false
      required: [value, global_default, preemption_policy, description]
      properties:
        value: { type: integer }
        global_default: { type: boolean }
        preemption_policy: { type: string }
        description: { type: string }
    KubernetesPolicyResourceSummary:
      type: object
      additionalProperties: false
      required: [resource, api_version, kind, namespace, name, uid, resource_version, creation_timestamp, labels]
      properties:
        resource: { $ref: "#/components/schemas/KubernetesPolicyResource" }
        api_version: { type: string }
        kind:
          type: string
          enum: [ResourceQuota, LimitRange, NetworkPolicy, PodDisruptionBudget, PriorityClass]
        namespace: { type: string }
        name: { type: string, minLength: 1, maxLength: 253 }
        uid: { type: string }
        resource_version: { type: string }
        creation_timestamp: { $ref: "#/components/schemas/Timestamp" }
        labels:
          type: object
          additionalProperties: { type: string }
        resource_quota: { $ref: "#/components/schemas/KubernetesResourceQuotaSummary" }
        limit_range: { $ref: "#/components/schemas/KubernetesLimitRangeSummary" }
        network_policy: { $ref: "#/components/schemas/KubernetesNetworkPolicySummary" }
        disruption_budget: { $ref: "#/components/schemas/KubernetesDisruptionBudgetSummary" }
        priority_class: { $ref: "#/components/schemas/KubernetesPriorityClassSummary" }
      oneOf:
        - required: [resource_quota]
        - required: [limit_range]
        - required: [network_policy]
        - required: [disruption_budget]
        - required: [priority_class]
    KubernetesPolicyResourceDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesPolicyResourceSummary"
        - type: object
          required: [annotations]
          properties:
            annotations:
              type: object
              additionalProperties: { type: string }
            # No `resource_quota_detail`: a quota's only detail field was its
            # scopeSelector, which now travels with the summary.
            limit_range_detail: { $ref: "#/components/schemas/KubernetesLimitRangeDetail" }
            network_policy_detail: { $ref: "#/components/schemas/KubernetesNetworkPolicyDetail" }
            disruption_budget_detail: { $ref: "#/components/schemas/KubernetesDisruptionBudgetDetail" }
    KubernetesPolicyResourcePage:
      type: object
      additionalProperties: false
      required: [resources, continue_token, resource_version, remaining_item_count]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/KubernetesPolicyResourceSummary" }
        continue_token: { type: string }
        resource_version: { type: string }
        remaining_item_count: { type: [integer, "null"], minimum: 0 }
    KubernetesResourceQuotaSpecInput:
      type: object
      additionalProperties: false
      required: [hard]
      properties:
        hard:
          type: object
          minProperties: 1
          maxProperties: 64
          additionalProperties: { type: string, minLength: 1 }
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [Terminating, NotTerminating, BestEffort, NotBestEffort, PriorityClass, CrossNamespacePodAffinity]
        scope_selector:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/KubernetesPolicyScopeSelectorRequirement" }
    KubernetesLimitRangeSpecInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/KubernetesLimitRangeItem" }
    KubernetesNetworkPolicySpecInput:
      type: object
      additionalProperties: false
      required: [policy_types]
      properties:
        pod_selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        policy_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [Ingress, Egress] }
        ingress:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyRule" }
        egress:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyRule" }
    KubernetesDisruptionBudgetSpecInput:
      type: object
      additionalProperties: false
      required: [selector]
      properties:
        selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        min_available: { type: string, maxLength: 16 }
        max_unavailable: { type: string, maxLength: 16 }
        unhealthy_pod_eviction_policy: { type: string, enum: [IfHealthyBudget, AlwaysAllow] }
    KubernetesPriorityClassSpecInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: integer, maximum: 1000000000 }
        global_default: { type: boolean, default: false }
        preemption_policy: { type: string, enum: [PreemptLowerPriority, Never] }
        description: { type: string, maxLength: 1024 }
    KubernetesPriorityClassUpdateInput:
      type: object
      additionalProperties: false
      required: [global_default]
      properties:
        description: { type: string, maxLength: 1024 }
        global_default: { type: boolean }
    KubernetesCreatePolicyResourceRequest:
      type: object
      additionalProperties: false
      required: [name, confirm]
      properties:
        name: { type: string, minLength: 1, maxLength: 253 }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        resource_quota: { $ref: "#/components/schemas/KubernetesResourceQuotaSpecInput" }
        limit_range: { $ref: "#/components/schemas/KubernetesLimitRangeSpecInput" }
        network_policy: { $ref: "#/components/schemas/KubernetesNetworkPolicySpecInput" }
        disruption_budget: { $ref: "#/components/schemas/KubernetesDisruptionBudgetSpecInput" }
        priority_class: { $ref: "#/components/schemas/KubernetesPriorityClassSpecInput" }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
      oneOf:
        - required: [resource_quota]
        - required: [limit_range]
        - required: [network_policy]
        - required: [disruption_budget]
        - required: [priority_class]
    KubernetesUpdatePolicyResourceRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        resource_quota: { $ref: "#/components/schemas/KubernetesResourceQuotaSpecInput" }
        limit_range: { $ref: "#/components/schemas/KubernetesLimitRangeSpecInput" }
        network_policy: { $ref: "#/components/schemas/KubernetesNetworkPolicySpecInput" }
        disruption_budget: { $ref: "#/components/schemas/KubernetesDisruptionBudgetSpecInput" }
        priority_class: { $ref: "#/components/schemas/KubernetesPriorityClassUpdateInput" }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
      oneOf:
        - required: [resource_quota]
        - required: [limit_range]
        - required: [network_policy]
        - required: [disruption_budget]
        - required: [priority_class]
    KubernetesDeletePolicyResourceRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    KubernetesPolicyMutationResult:
      type: object
      additionalProperties: false
      required: [resource, dry_run]
      properties:
        resource: { $ref: "#/components/schemas/KubernetesPolicyResourceDetail" }
        dry_run: { type: boolean }
    KubernetesPolicyDeleteResult:
      type: object
      additionalProperties: false
      required: [deleted, dry_run, target]
      properties:
        deleted: { type: boolean }
        dry_run: { type: boolean }
        target: { type: string }
    KubernetesSecretSummary:
      type: object
      additionalProperties: false
      required:
        - namespace
        - name
        - uid
        - resource_version
        - creation_timestamp
        - labels
        - type
        - data_keys
        - data_bytes
        - immutable
      properties:
        namespace: { type: string, minLength: 1, maxLength: 63 }
        name: { type: string, minLength: 1, maxLength: 253 }
        uid: { type: string }
        resource_version: { type: string }
        creation_timestamp: { $ref: "#/components/schemas/Timestamp" }
        labels:
          type: object
          additionalProperties: { type: string }
        type:
          type: string
          description: Kubernetes Secret 类型，例如 Opaque 或 kubernetes.io/tls。
        data_keys:
          type: array
          items: { type: string }
          description: 只有键名。取值不在列表响应中。
        data_bytes: { type: integer, format: int64, minimum: 0 }
        immutable: { type: boolean }
    KubernetesSecretDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesSecretSummary"
        - type: object
          required: [annotations, data]
          properties:
            annotations:
              type: object
              additionalProperties: { type: string }
            data:
              type: object
              description: >-
                取值使用标准带填充 Base64，与 Kubernetes 存储它们的方式一致；
                是否可解释为文本由调用方判断。
              additionalProperties: { type: string, format: byte }
    KubernetesSecretPage:
      type: object
      additionalProperties: false
      required: [secrets, continue_token, resource_version, remaining_item_count]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/KubernetesSecretSummary" }
        continue_token: { type: string }
        resource_version: { type: string }
        remaining_item_count: { type: [integer, "null"], minimum: 0 }
    KubernetesHelmRelease:
      type: object
      additionalProperties: false
      required: [namespace, name, revision, status, secret_name, updated]
      properties:
        namespace: { type: string }
        name: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        status:
          type: string
          description: Helm 写在 Release Secret label 上的状态，例如 deployed、failed、superseded。
        secret_name:
          type: string
          description: 存放该修订的 Secret 名，便于直接查看存储本身。
        updated:
          type: string
          format: date-time
          description: 该修订的 Secret 创建时间，也就是 Helm 写入这次修订的时间。
    KubernetesHelmReleasePage:
      type: object
      additionalProperties: false
      required: [releases]
      properties:
        releases:
          type: array
          items: { $ref: "#/components/schemas/KubernetesHelmRelease" }
    KubernetesHelmReleaseDetail:
      allOf:
        - $ref: "#/components/schemas/KubernetesHelmRelease"
        - type: object
          additionalProperties: false
          required:
            - description
            - chart_name
            - chart_version
            - app_version
            - chart_description
            - notes
            - values
            - manifest
            - manifest_truncated
          properties:
            description: { type: string }
            chart_name: { type: string }
            chart_version: { type: string }
            app_version: { type: string }
            chart_description: { type: string }
            first_deployed: { type: string, format: date-time }
            last_deployed: { type: string, format: date-time }
            notes:
              type: string
              description: Chart 渲染出的 NOTES.txt。
            values:
              type: object
              additionalProperties: true
              description: >-
                安装或升级该 Release 时使用的 values。常包含凭证，
                因此该接口要求 cluster.secret.read。
            manifest:
              type: string
              description: Chart 渲染出的清单；超过上限时被截断。
            manifest_truncated: { type: boolean }
    HelmRepository:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - url
        - username
        - has_credentials
        - ca_certificate_provided
        - insecure_skip_tls_verify
        - enabled
        - created_at
        - updated_at
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        url:
          type: string
          format: uri
          description: 仓库根地址，`index.yaml` 位于其下。只接受 http 与 https。
        username: { type: string, maxLength: 200 }
        has_credentials:
          type: boolean
          description: 是否配置了口令。口令本身任何接口都不返回。
        ca_certificate_provided:
          type: boolean
          description: 是否配置了自定义 CA。
        ca_certificate_pem:
          type: string
          description: >-
            自定义 CA 的 PEM 原文。它是公开证书而不是机密，且会被原样返回：
            读不回它的编辑表单也保不住它——保存时提交一个空字段就等于清除了没人想删的 CA。
        insecure_skip_tls_verify:
          type: boolean
          description: 是否跳过 TLS 校验。它是一次明确且可审计的选择，不是静默回退。
        enabled:
          type: boolean
          description: 关闭后不再用于新的安装；已安装的 Release 不受影响。
        signature_policy:
          $ref: "#/components/schemas/HelmSignaturePolicy"
        signing_keys:
          type: array
          description: >-
            该仓库的 Chart 允许由哪些 PGP 公钥签名。以指纹与身份返回而不是 armor 原文：
            「这里信任哪些密钥」问的是这个。
          items: { $ref: "#/components/schemas/HelmSigningKey" }
        public_keyring:
          type: string
          description: >-
            存储的 ASCII-armored PGP 公钥原文。公钥不是机密，且管理员在三把密钥中替换
            一把时必须能编辑现有内容，因此与口令不同，它会被原样返回。
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HelmSignaturePolicy:
      type: string
      enum: [disabled, verify_if_present, required]
      description: >-
        该仓库对 Chart 来源证明的要求。索引里的 digest 只说明仓库正在提供它自己发布的内容，
        不说明是谁生产的；Helm 在归档旁发布 `<chart>-<version>.tgz.prov`——一份注明归档
        SHA-256 的 PGP 明文签名文档——校验它同时证明了两件事：平台信任的密钥签署了这份摘要表，
        且手上的归档正是表中所写的那一份。

        `disabled` 不取也不校验；`verify_if_present` 在仓库发布 `.prov` 时校验、未发布时放行，
        它是发布方尚在推进签名时的过渡状态而不是安全边界（能替换归档的一方也能删掉它旁边的文件）；
        `required` 拒绝一切无法归因到该仓库密钥的归档，安装与浏览同样适用。
    HelmSigningKey:
      type: object
      additionalProperties: false
      required: [fingerprint, key_id, identities]
      properties:
        fingerprint:
          type: string
          description: 密钥指纹。它是 PGP 密钥中唯一能标识自身的部分——用户 ID 是密钥所有者自己写的自由文本。
        key_id: { type: string }
        identities:
          type: array
          items: { type: string }
    HelmChartSignature:
      type: object
      additionalProperties: false
      required: [policy, verified, unsigned]
      properties:
        policy: { $ref: "#/components/schemas/HelmSignaturePolicy" }
        verified:
          type: boolean
          description: 该仓库密钥环上的某把密钥签署了一份注明此归档 SHA-256 的摘要表。
        unsigned:
          type: boolean
          description: >-
            仓库没有为这个版本发布来源证明。`verify_if_present` 下这是被放行的情形，
            界面据此说明原因，而不是显示一个没有解释的「未验证」。
        signed_by:
          type: array
          items: { type: string }
        key_id: { type: string }
        digest:
          type: string
          description: >-
            归档的 SHA-256，带算法前缀。`verified` 为真时它是发布方签署的那一个，
            否则只是本 Server 算出的值——区别就在 `verified`。
        file_name:
          type: string
          description: 已签名摘要表中匹配到的文件名。来源证明按文件名绑定摘要，因此匹配到哪个名字也是被证明的一部分。
    HelmRepositoryPage:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          items: { $ref: "#/components/schemas/HelmRepository" }
    HelmRepositoryRequest:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        url:
          type: string
          format: uri
          maxLength: 2000
          description: 绝对的 http 或 https 地址，不得内嵌凭证。
        username: { type: string, maxLength: 200 }
        password:
          type: string
          format: password
          maxLength: 1000
          nullable: true
          description: >-
            三态字段：不传保留已存储的口令，传空字符串清除，传值替换。写入后不再返回。
        ca_certificate_pem:
          type: string
          maxLength: 65536
          description: >-
            私有仓库使用的自定义 CA，PEM 编码；留空表示使用系统信任库。
            它是完整提交的：提交空字符串即清除已配置的 CA。
        insecure_skip_tls_verify: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
        signature_policy:
          allOf: [{ $ref: "#/components/schemas/HelmSignaturePolicy" }]
          default: disabled
        public_keyring:
          type: string
          maxLength: 262144
          description: >-
            ASCII-armored PGP 公钥。与口令不同，它是完整提交与返回的：公钥不是机密，
            而在多把密钥中增删一把必须提交全部内容。`disabled` 之外的策略要求至少一把密钥——
            没有密钥的策略在 `required` 下会拒绝一切 Chart，在 `verify_if_present` 下
            会放行一切 Chart，而界面上看起来仍然像在校验。
    HelmChartSummary:
      type: object
      additionalProperties: false
      required: [name, version, app_version, description, icon_url, deprecated, version_count]
      properties:
        name: { type: string }
        version: { type: string }
        app_version: { type: string }
        description: { type: string }
        icon_url: { type: string }
        keywords:
          type: array
          items: { type: string }
        deprecated: { type: boolean }
        version_count:
          type: integer
          description: 该 Chart 在索引中发布过的版本数量。
    HelmChartPage:
      type: object
      additionalProperties: false
      required: [repository_id, charts, total, fetched_at, stale]
      properties:
        repository_id: { $ref: "#/components/schemas/UUID" }
        charts:
          type: array
          items: { $ref: "#/components/schemas/HelmChartSummary" }
        total:
          type: integer
          description: 应用搜索与数量上限之前的 Chart 总数。
        fetched_at:
          type: string
          format: date-time
          description: >-
            仓库最后一次确认这份索引的时间——无论是发来了新的一份，还是回答它没有变化。
        stale:
          type: boolean
          description: >-
            该列表来自 Server 的磁盘副本，因为仓库当前读不到。目录仍然可用，
            但内容是 `fetched_at` 那一刻的；不说明这一点，「Chart 不见了」与
            「这份列表是上周的」在界面上完全一样。
    HelmChartVersionSummary:
      type: object
      additionalProperties: false
      required: [version, app_version, description, deprecated, digest]
      properties:
        version: { type: string }
        app_version: { type: string }
        description: { type: string }
        created: { type: string, format: date-time }
        deprecated: { type: boolean }
        digest: { type: string }
    HelmChartVersionPage:
      type: object
      additionalProperties: false
      required: [repository_id, chart, versions]
      properties:
        repository_id: { $ref: "#/components/schemas/UUID" }
        chart: { type: string }
        versions:
          type: array
          items: { $ref: "#/components/schemas/HelmChartVersionSummary" }
    HelmChartDependency:
      type: object
      additionalProperties: false
      required: [name, version, repository, condition]
      properties:
        name: { type: string }
        version: { type: string }
        repository: { type: string }
        condition: { type: string }
    HelmChartDetail:
      type: object
      additionalProperties: false
      required:
        - repository_id
        - name
        - version
        - app_version
        - description
        - icon_url
        - home
        - deprecated
        - type
        - values
        - readme
        - values_schema
        - signature
      properties:
        repository_id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        version: { type: string }
        app_version: { type: string }
        description: { type: string }
        icon_url: { type: string }
        home: { type: string }
        sources:
          type: array
          items: { type: string }
        keywords:
          type: array
          items: { type: string }
        deprecated: { type: boolean }
        type: { type: string }
        values:
          type: string
          description: >-
            Chart 自带的 values.yaml 原文。以文本返回而不是解析后的对象，
            因为其中的注释就是一半的文档。超过上限时被截断。
        readme:
          type: string
          description: Chart 打包的 README.md；没有则为空。超过上限时被截断。
        values_schema:
          type: string
          description: >-
            Chart 打包的 values.schema.json 原文；没有则为空。它是 Chart 作者对
            「什么是合法配置」的声明，Server 在安装抵达集群之前按它校验一次，
            因此把它交给需要满足它的那个编辑器，而不是留给一次拒绝去揭示。
        signature:
          $ref: "#/components/schemas/HelmChartSignature"
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/HelmChartDependency" }
    HelmChartFilePage:
      type: object
      additionalProperties: false
      required: [repository_id, chart, version, files, file_count, truncated]
      properties:
        repository_id: { $ref: "#/components/schemas/UUID" }
        chart: { type: string }
        version:
          type: string
          description: 实际解析到的 Chart 版本，读取单个文件时应当带上它。
        files:
          type: array
          description: >-
            Chart 归档中的全部文件，含 `charts/` 下的子 Chart，按路径排序。
            文件内容不在这里：一个带打包子 Chart 的归档可能有数百个文件，
            而其中绝大多数不会被打开，因此内容由单独的接口按文件读取。
          items: { $ref: "#/components/schemas/HelmChartFileEntry" }
        file_count:
          type: integer
          description: 归档中的文件总数，即施加列表上限之前的数量。
        truncated:
          type: boolean
          description: 文件列表因超过上限而被截断。
    HelmChartFileEntry:
      type: object
      additionalProperties: false
      required: [path, size, text]
      properties:
        path:
          type: string
          description: 文件在归档中的路径，例如 `templates/deployment.yaml`。
        size: { type: integer, description: 文件的字节数。 }
        text:
          type: boolean
          description: >-
            该文件可以按文本展示。判定依据是文件头部的内容而不是扩展名——
            Chart 可以用任意名字打包任意内容。
    HelmChartFileDetail:
      type: object
      additionalProperties: false
      required: [repository_id, chart, version, path, size, text, content, truncated]
      properties:
        repository_id: { $ref: "#/components/schemas/UUID" }
        chart: { type: string }
        version: { type: string }
        path: { type: string }
        size: { type: integer, description: 文件的字节数，截断前的真实长度。 }
        text: { type: boolean }
        content:
          type: string
          description: 文件原文；非文本文件为空字符串。
        truncated:
          type: boolean
          description: 内容因超过上限而被截断，`size` 仍是文件的真实长度。
    HelmReleaseReport:
      type: object
      additionalProperties: false
      required:
        - name
        - namespace
        - revision
        - status
        - dry_run
        - description
        - chart_name
        - chart_version
        - app_version
        - chart_description
        - notes
        - manifest
        - manifest_truncated
        - notes_truncated
        - deleted
        - hooks_disabled
      description: >-
        Helm 在这次操作之后对该 Release 的说明。dry-run 也会产生一份：其中的字段描述
        「将会写入什么」，`manifest` 就是待批准的渲染结果。
      properties:
        name: { type: string }
        namespace: { type: string }
        revision: { type: integer, format: int64 }
        status: { type: string }
        dry_run:
          type: boolean
          description: 该报告描述的是一次未写入的变更。
        description: { type: string }
        chart_name: { type: string }
        chart_version: { type: string }
        app_version: { type: string }
        chart_description: { type: string }
        first_deployed: { type: string, format: date-time }
        last_deployed: { type: string, format: date-time }
        notes: { type: string }
        manifest:
          type: string
          description: Chart 渲染出的清单；超过上限时被截断。
        manifest_truncated: { type: boolean }
        notes_truncated: { type: boolean }
        deleted:
          type: boolean
          description: 由卸载写入；其余字段描述被移除的那个修订。
        hooks_disabled:
          type: boolean
          description: >-
            该修订跳过了 Chart 的 hook。跳过 hook 装出来的 Release 已经不是 Chart 描述的
            那个，所以这个事实跟着修订走，而不只跟着请求走。
    HelmReleaseOperationStage:
      type: string
      enum: ["", resolving_chart, validating_values, executing]
      description: >-
        操作当前所处的阶段。一次 Release 变更不是一个动作而是一小段流水线：Server 解析并下载
        Chart，按 Chart 自带的 values.schema.json 校验 values，然后把整体交给集群渲染与写入。
        其中任何一段都可能是慢的那一段，因此阶段是被上报的，而不是由输入推断出来的。空字符串
        表示操作刚被接受，还没有进入任何阶段。
    HelmReleaseOperationEvent:
      type: object
      additionalProperties: false
      required: [seq, at, stage, message]
      description: 操作账目中的一行，按发生顺序排列。
      properties:
        seq:
          type: integer
          format: int64
          description: >-
            该行在这次操作里的序号，从 1 开始且不重复。把已经读到的最大序号作为 `after` 传回，
            就只会拿到这之后发生的行。
        at: { type: string, format: date-time }
        stage: { $ref: "#/components/schemas/HelmReleaseOperationStage" }
        message:
          type: string
          description: >-
            这一行的内容。`executing` 阶段的内容是 Helm 自己的日志原文，由 Agent 在操作进行
            当中转发回来；空字符串表示该行只是宣布进入了这个阶段。
    HelmReleaseOperationFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      description: >-
        操作没有完成它要做的事的原因。code 与 message 与同步接口会返回的错误一致：一个失败的
        操作就是一次迟到的错误响应。
      properties:
        code: { type: string }
        message: { type: string }
    HelmReleaseOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - cluster_id
        - namespace
        - release_name
        - action
        - dry_run
        - status
        - stage
        - events
        - event_cursor
        - events_truncated
        - started_at
      description: >-
        一次 Release 变更正在发生的全过程。安装、升级、回滚与卸载都不在一次 HTTP 请求里完成：
        它们下载 Chart、渲染、写入应用拥有的每个对象，并且通常还要等这些对象就绪，正常情况下
        就是几分钟。所以请求只负责启动操作并返回它的身份，这里是它的账目。

        记录保存在 Server 进程内，保留一段时间后丢弃。它的价值只等于它所描述的那次操作：操作
        结束并被读取之后，真正留下来的是 Release 本身、它的修订历史与审计记录。Server 重启会
        丢失账目，但不会丢失操作——执行它的是 Agent。
      properties:
        id: { type: string, description: 32 位十六进制字符。 }
        cluster_id: { $ref: "#/components/schemas/UUID" }
        namespace: { type: string }
        release_name: { type: string }
        action:
          type: string
          enum: [install, upgrade, rollback, uninstall]
        dry_run:
          type: boolean
          description: 该操作不写入任何东西，只渲染并报告将要应用的内容。
        chart: { type: string }
        chart_version:
          type: string
          description: 请求指定的版本；为空表示「仓库发布的最新版本」，实际解析到的版本在报告里。
        status:
          type: string
          enum: [running, succeeded, failed]
        stage: { $ref: "#/components/schemas/HelmReleaseOperationStage" }
        events:
          type: array
          description: >-
            账目本身，或者——当请求带了 `after` 时——它之后发生的那部分。列表接口返回的摘要中
            恒为空数组：回到一次操作只需要身份与状态，完整账目是另一个请求的事。
          items: { $ref: "#/components/schemas/HelmReleaseOperationEvent" }
        event_cursor:
          type: integer
          format: int64
          description: >-
            这次操作到目前为止产生的最大行号，无论那一行是否还被保留。下次请求把它作为 `after`
            传回即可只取增量。
        events_truncated:
          type: boolean
          description: >-
            账目过长，中间被丢弃了一部分。保留的是开头与结尾——开头说明这次操作要做什么，
            结尾说明它做成了没有。
        report: { $ref: "#/components/schemas/HelmReleaseReport" }
        failure: { $ref: "#/components/schemas/HelmReleaseOperationFailure" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    HelmReleaseOperationResult:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation: { $ref: "#/components/schemas/HelmReleaseOperation" }
    HelmReleaseOperationPage:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          items: { $ref: "#/components/schemas/HelmReleaseOperation" }
    HelmChartReleaseRequest:
      type: object
      additionalProperties: false
      required: [repository_id, chart]
      description: >-
        安装与升级共同的部分：装什么、用什么 values、以及一次操作如何执行。Release 名不在这里，
        因为安装由请求正文给出，升级由 URL 给出；两处都能命名会让「以哪个为准」变成一个必须回答
        的问题。
      properties:
        repository_id: { $ref: "#/components/schemas/UUID" }
        chart: { type: string, minLength: 1, maxLength: 253 }
        version:
          type: string
          maxLength: 128
          description: Chart 版本；省略表示仓库发布的最新版本，实际使用的版本在返回中给出。
        values:
          type: string
          maxLength: 1048576
          description: 操作者编辑后的 values 文档（YAML）。留空表示使用 Chart 自带默认值。
        create_namespace: { type: boolean, default: false }
        wait:
          type: boolean
          default: false
          description: 等待 Release 拥有的对象就绪后再返回，上限为 timeout_seconds。
        atomic:
          type: boolean
          default: false
          description: 失败时回滚到操作前的状态。它隐含等待。
        disable_hooks:
          type: boolean
          default: false
          description: 跳过 Chart 的 hook。该事实会记录在修订上。
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600 }
        max_history: { type: integer, minimum: 0, maximum: 100 }
        description: { type: string, maxLength: 256 }
        dry_run: { type: boolean, default: false }
        confirm:
          type: boolean
          description: 非 dry-run 时必须为 true。
    HelmInstallReleaseRequest:
      allOf:
        - $ref: "#/components/schemas/HelmChartReleaseRequest"
        - type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 53
              description: Release 名。Helm 自己的规则：DNS-1123 子域，且不超过 53 个字符。
    HelmUpgradeReleaseRequest:
      allOf:
        - $ref: "#/components/schemas/HelmChartReleaseRequest"
        - type: object
          additionalProperties: false
          properties:
            reset_values:
              type: boolean
              default: false
              description: 丢弃上一次的 values，回到 Chart 默认值再合并本次提交的内容。
            reuse_values:
              type: boolean
              default: false
              description: 沿用上一次的 values 再合并本次提交的内容。与 reset_values 互斥。
    HelmRollbackReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: 目标修订号；省略或 0 表示当前修订的上一个。
        wait: { type: boolean, default: false }
        disable_hooks: { type: boolean, default: false }
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600 }
        max_history: { type: integer, minimum: 0, maximum: 100 }
        description: { type: string, maxLength: 256 }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    HelmUninstallReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        keep_history:
          type: boolean
          default: false
          description: 删除对象但保留修订历史。保留下来的历史正是之后回滚所需要的。
        wait: { type: boolean, default: false }
        disable_hooks: { type: boolean, default: false }
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600 }
        description: { type: string, maxLength: 256 }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    KubernetesCreateSecretRequest:
      type: object
      additionalProperties: false
      required: [name, confirm]
      properties:
        name: { type: string, minLength: 1, maxLength: 253 }
        type:
          type: string
          enum:
            - ""
            - Opaque
            - kubernetes.io/dockerconfigjson
            - kubernetes.io/basic-auth
            - kubernetes.io/ssh-auth
            - kubernetes.io/tls
          description: >-
            创建后不可修改；空字符串按 Opaque 处理。
            kubernetes.io/service-account-token 不接受：它由 Kubernetes 为 ServiceAccount 签发。
        labels:
          type: object
          additionalProperties: { type: string }
          description: app.kubernetes.io/managed-by=zke-server 不接受，该标签标识 ZKE 自身的对象。
        annotations:
          type: object
          additionalProperties: { type: string }
        data:
          type: object
          description: 取值使用标准带填充 Base64。解码后总大小不超过 1 MiB。
          additionalProperties: { type: string, format: byte }
        immutable: { type: boolean, default: false }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    KubernetesUpdateSecretRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, data, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        data:
          type: object
          description: >-
            整体替换：本次未提交的键会从对象中移除。取值使用标准带填充 Base64。
            type 不在请求中，Kubernetes 在创建后不允许修改它。
          additionalProperties: { type: string, format: byte }
        immutable:
          type: boolean
          description: 省略时保留当前值；设为 true 后 Kubernetes 不允许恢复为 false。
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    KubernetesDeleteSecretRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    KubernetesConfigMapSummary:
      type: object
      additionalProperties: false
      required:
        - namespace
        - name
        - uid
        - resource_version
        - creation_timestamp
        - labels
        - data_keys
        - binary_data_keys
        - data_bytes
        - binary_data_bytes
        - immutable
      properties:
        namespace: { type: string, minLength: 1, maxLength: 63 }
        name: { type: string, minLength: 1, maxLength: 253 }
        uid: { type: string }
        resource_version: { type: string }
        creation_timestamp: { $ref: "#/components/schemas/Timestamp" }
        labels:
          type: object
          additionalProperties: { type: string }
        data_keys:
          type: array
          items: { type: string }
        binary_data_keys:
          type: array
          items: { type: string }
        data_bytes: { type: integer, format: int64, minimum: 0 }
        binary_data_bytes: { type: integer, format: int64, minimum: 0 }
