          const: true
    ReenrollmentRequest:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          const: true
        endpoint_profile_id:
          $ref: "#/components/schemas/UUID"
    UpdateScopedResourceRequest:
      type: object
      additionalProperties: false
      required: [name, status, confirm]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        status:
          type: string
          enum: [active, suspended]
