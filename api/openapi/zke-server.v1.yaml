        username:
          type: string
        display_name:
          type: string
          maxLength: 253
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 1024
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 253
    SetUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status, confirm]
      properties:
        status:
          type: string
