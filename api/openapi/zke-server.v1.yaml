          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [RBAC]
      operationId: deleteRoleBinding
      description: >-
        删除一条授权关系。删除等于一次性收回该角色授予的全部权限，因此要求调用者
        本人在全局持有该角色的每一项权限，否则返回 403 `permission_revocation`
        并列出越界的权限名——收回自己没有的权限与授予自己没有的权限同样越权。

        另外禁止删除授予调用者自身的绑定（409 `self_unbind_forbidden`），以及
        由非全局管理员移除全局管理员、或移除最后一个全局管理员。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RoleBindingID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirmation"
      responses:
        "200":
          description: RoleBinding 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: "null"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
