            所有 PersistentVolume 的 `spec.capacity.storage` 之和，不区分阶段：
            Released 卷仍然占用后端存储。
        status_counts:
          $ref: "#/components/schemas/KubernetesOverviewStatusCounts"
    KubernetesClusterPersistentVolumeClaimOverview:
      type: object
      additionalProperties: false
