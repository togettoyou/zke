        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
    put:
      tags: [Resources]
      operationId: updateKubernetesSecretYAML
      description: |
        以严格单文档 YAML 替换一个 Secret，要求 `cluster.secret.manage`。除 URL 身份与
        `metadata.uid`、`metadata.resourceVersion` 核对外，还拒绝改变 `type`、拒绝写入
        已 immutable 的 Secret、拒绝为对象添加 ZKE 的 managed-by 标签。请求正文不写入
        审计记录。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/SecretName"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/KubernetesYAMLDryRun"
        - $ref: "#/components/parameters/KubernetesYAMLConfirm"
        - $ref: "#/components/parameters/KubernetesYAMLFieldManager"
      requestBody:
        $ref: "#/components/requestBodies/KubernetesYAMLManifest"
      responses:
        "200": { $ref: "#/components/responses/KubernetesYAMLMutationSuccess" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/helm/repositories:
    get:
      tags: [Helm]
      operationId: listHelmRepositories
      description: |
        列出平台上的 Chart 仓库目录。要求 `helm.repository.read`。

        目录是平台级的：Chart 是软件来源，不是某个 Project 的基础设施，而“能否把某个
        Chart 装进某个 Cluster”由 Cluster 权限决定，与它来自哪个仓库无关。

        仓库凭证只写不读。任何接口都不会返回口令，读取方只会看到 `has_credentials`
        说明是否配置过。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Chart 仓库列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmRepositoryPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
    post:
      tags: [Helm]
      operationId: createHelmRepository
      description: |
        新增一个 Chart 仓库。要求 `helm.repository.manage`。

        `url` 必须是绝对的 http 或 https 地址，且不得内嵌凭证；私有仓库的用户名与口令走
        独立字段，口令写入后不再返回。审计只记录仓库名与标识，不记录凭证。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmRepositoryRequest" }
      responses:
        "201":
          description: 仓库已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmRepository" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/helm/repositories/{repository_id}:
    get:
      tags: [Helm]
      operationId: getHelmRepository
      description: 读取一个 Chart 仓库的配置，要求 `helm.repository.read`。不返回凭证。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HelmRepositoryID"
      responses:
        "200":
          description: Chart 仓库
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmRepository" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
    put:
      tags: [Helm]
      operationId: updateHelmRepository
      description: |
        更新一个 Chart 仓库，要求 `helm.repository.manage`。

        `password` 是三态字段：不传表示保留已存储的口令，传空字符串表示清除，传值表示替换。
        更新后该仓库的索引缓存立即作废，避免改正地址后仍然看到旧结果。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/HelmRepositoryID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmRepositoryRequest" }
      responses:
        "200":
          description: 仓库已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmRepository" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
    delete:
      tags: [Helm]
      operationId: deleteHelmRepository
      description: |
        删除一个 Chart 仓库，要求 `helm.repository.manage`。

        没有任何对象引用它：Release 自带安装时使用的 Chart，因此删除仓库不影响已安装的
        Release，只是新的安装不能再从它选择 Chart。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/HelmRepositoryID"
      responses:
        "204": { description: 仓库已删除 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/helm/repositories/{repository_id}/charts:
    get:
      tags: [Helm]
      operationId: listHelmCharts
      description: |
        列出一个仓库发布的 Chart，每个只返回最新版本，要求 `helm.repository.read`。

        Server 把每个仓库的 `index.yaml` 存在磁盘上（`data/helm/<repository_id>/`），
        并在内存中保留解析结果；过期后用条件请求向仓库确认，未变更的索引只花一次 304。
        `fetched_at` 是仓库最后一次确认这份索引的时间；仓库读不到时返回磁盘副本并置
        `stale`。`total` 是过滤与分页之前的 Chart 总数。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HelmRepositoryID"
        - name: search
          in: query
          description: 按 Chart 名、描述与关键字做不区分大小写的包含匹配。
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          description: 单次返回的 Chart 数量上限，默认与上限均为 200。
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Chart 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmChartPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/helm/repositories/{repository_id}/index-refresh:
    post:
      tags: [Helm]
      operationId: refreshHelmChartIndex
      description: |
        丢弃该仓库索引的服务端缓存，重新拉取一次，并返回刷新后的 Chart 列表。
        要求 `helm.repository.read`。

        Server 会缓存每个仓库的 `index.yaml`，因此刚发布的 Chart 不会立刻出现。这条接口是显式
        重读的入口：它无条件重新拉取索引——不带 If-None-Match，因为发起它的人正是在说不信任
        手上这份，而条件请求会让仓库回 304 并原样留下它。它不改变任何存储状态，也不丢弃已缓存
        的 Chart 包（一个版本的内容不会变），所以要求的是读权限而不是管理权限。

        参数与 Chart 列表一致，便于刷新之后直接拿到当前搜索条件下的结果。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/HelmRepositoryID"
        - name: search
          in: query
          description: 按 Chart 名、描述与关键字做不区分大小写的包含匹配。
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          description: 单次返回的 Chart 数量上限，默认与上限均为 200。
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: 刷新后的 Chart 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmChartPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/helm/repositories/{repository_id}/charts/{chart_name}:
    get:
      tags: [Helm]
      operationId: getHelmChart
      description: |
        下载一个 Chart 版本并返回安装前需要阅读的内容：Chart 自带的 values.yaml 原文、
        README 与元数据，以及它会一并安装的子 Chart。要求 `helm.repository.read`。

        归档里有哪些文件不在这里返回，而是单独一条接口（`.../files`）：多数人读完 README
        就去安装，从不打开那棵树，而判定几百个归档成员各是什么不该由这个请求替他们承担。

        values 以文本原样返回而不是解析后的对象，因为其中的注释就是一半的文档。省略
        `version` 表示仓库发布的最新版本。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HelmRepositoryID"
        - $ref: "#/components/parameters/HelmChartName"
        - name: version
          in: query
          description: Chart 版本；省略表示最新版本。
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Chart 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmChartDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/helm/repositories/{repository_id}/charts/{chart_name}/files:
    get:
      tags: [Helm]
      operationId: listHelmChartFiles
      description: |
        列出 Chart 归档中的全部文件，含 `charts/` 下的子 Chart，按路径排序。
        要求 `helm.repository.read`。

        与 Chart 详情分开的原因是代价的归属：多数人打开一个 Chart 只读 README，而列表要
        判定每一个归档成员是不是文本。Server 会把解析后的归档在内存里留几分钟，所以读完详情
        再打开文件浏览器不会多下载一次归档。

        文件内容不在这里，由 `.../file?path=…` 按文件读取。省略 `version` 表示仓库发布的
        最新版本；返回的 `version` 是实际解析到的版本，后续读取单个文件应当带上它。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HelmRepositoryID"
        - $ref: "#/components/parameters/HelmChartName"
        - name: version
          in: query
          description: Chart 版本；省略表示最新版本。
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Chart 文件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmChartFilePage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/helm/repositories/{repository_id}/charts/{chart_name}/file:
    get:
      tags: [Helm]
      operationId: getHelmChartFile
      description: |
        返回 Chart 归档中的一个文件原文，要求 `helm.repository.read`。

        `.../files` 已经列出了归档中的全部文件，这条接口是读取其中一个。之所以分开：
        一个带打包子 Chart 的归档可能有数百个文件，把它们的内容都放进列表里，等于为了显示
        一棵目录树而把整个归档下载到浏览器。

        `path` 与归档自身的成员名精确匹配，不做任何拼接，因此不存在可被穿越的路径。非文本
        文件返回空的 `content` 与 `text: false`；超过上限的文件会被截断并标注，`size`
        仍是文件的真实长度。省略 `version` 表示仓库发布的最新版本。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HelmRepositoryID"
        - $ref: "#/components/parameters/HelmChartName"
        - name: path
          in: query
          required: true
          description: 文件在归档中的路径，例如 `templates/deployment.yaml`。
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: version
          in: query
          description: Chart 版本；省略表示最新版本。
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Chart 文件内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmChartFileDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/helm/repositories/{repository_id}/charts/{chart_name}/versions:
    get:
      tags: [Helm]
      operationId: listHelmChartVersions
      description: |
        列出一个 Chart 在仓库索引中发布过的全部版本，按版本从新到旧返回。
        要求 `helm.repository.read`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HelmRepositoryID"
        - $ref: "#/components/parameters/HelmChartName"
      responses:
        "200":
          description: Chart 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmChartVersionPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/helm-releases:
    get:
      tags: [Resources]
      operationId: listHelmReleases
      description: |
        列出目标 Namespace 中的 Helm 应用（Release），每个 Release 只返回存储中最新的一次
        修订，与 `helm list` 的收敛方式一致。

        Helm 3 把每次修订存成一个 `helm.sh/release.v1` 类型的 Secret，Release 名、修订号与
        状态在该 Secret 的 label 上，因此列表不解压任何 Release 负载。安装、升级、回滚与卸载
        是同一路径下的写入接口，权限要求更长一档；渲染与写入由目标集群的 Agent 用 Helm 自己的
        引擎完成，Server 不代写 Release Secret。

        该接口读取 Secret，因此同时要求 `cluster.read` 与 `cluster.secret.read`，kube-* 与
        Agent Namespace 还需对应的独立 Namespace 权限；每次调用都会写入与 Secret 列表一致的
        审计记录。若 Namespace 中的修订 Secret 超过一次盘点上限，返回 422
        `helm_release_inventory_truncated` 而不是给出可能选错最新修订的部分结果。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
      responses:
        "200":
          description: Helm Release 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesHelmReleasePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
    post:
      tags: [Resources]
      operationId: installHelmRelease
      description: |
        在目标 Cluster 的 Namespace 中安装一个 Chart。

        Chart 由「仓库 + 名称 + 版本」指定，而不是 URL：可安装的来源是管理员维护的目录，
        接口不接受任意地址。渲染与写入由该 Cluster 的 Agent 用 Helm 自己的引擎完成，
        Server 只负责取 Chart、组装 values 与鉴权。

        权限是一组而不是一个：`cluster.read`、`cluster.helm.manage`、
        `cluster.resource.create`、`cluster.resource.update` 与 `cluster.secret.manage`
        同时要求，kube-* 与 Agent Namespace 另需对应的独立 Namespace 权限。Chart 渲染出的
        对象若指向别的 Namespace 会被 Agent 拒绝；若包含集群级对象（CRD、ClusterRole 等），
        还需要 `cluster.manage`，否则 Agent 会指名拒绝。

        `dry_run` 只渲染不写入，用于提交前预览；非 dry-run 必须显式 `confirm`。两者写入不同
        的审计动作。

        接口返回 202 与一个操作身份，而不是等到装完再回答：一次安装要下载 Chart、渲染、写入
        应用拥有的每个对象，并且默认还要等它们就绪，正常情况下就是几分钟。进展、日志与最终
        结果都从 `helm-operations` 读取。重复提交同一个 `Idempotency-Key` 返回已经在跑的那次
        操作，而不是再装一次；同一个 key 用于另一个请求会被拒绝。审计在操作结束时写入，记录的
        是它的结果。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmInstallReleaseRequest" }
      responses:
        "202":
          description: 操作已受理，正在执行；用返回的操作身份读取它的进展与结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmReleaseOperationResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "424": { $ref: "#/components/responses/FailedDependency" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/helm-releases/{release_name}:
    get:
      tags: [Resources]
      operationId: getHelmRelease
      description: |
        读取一个 Helm Release 的某次修订：Chart 名称与版本、appVersion、状态与描述、部署时间、
        渲染出的 NOTES，以及安装或升级时使用的 values。省略 revision 时读取存储中最新的一次修订。

        values 常常包含密码一类的凭证，这也是该接口要求 `cluster.secret.read` 的原因：返回的是
        Release Secret 的内容本身，而不是它的摘要。渲染出的 manifest 超过上限时会被截断，
        并由 `manifest_truncated` 说明。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/HelmReleaseName"
        - name: revision
          in: query
          description: 要读取的修订号；省略表示存储中最新的一次修订。
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Helm Release 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesHelmReleaseDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
    put:
      tags: [Resources]
      operationId: upgradeHelmRelease
      description: |
        升级一个已安装的 Release：用新的 Chart 版本或新的 values 生成下一个修订。

        `reset_values` 与 `reuse_values` 互斥，都不设置表示本次提交的 values 完整替换上一次
        的。权限、预演与确认规则与安装一致。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/HelmReleaseName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmUpgradeReleaseRequest" }
      responses:
        "202":
          description: 操作已受理，正在执行；用返回的操作身份读取它的进展与结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmReleaseOperationResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "424": { $ref: "#/components/responses/FailedDependency" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
    delete:
      tags: [Resources]
      operationId: uninstallHelmRelease
      description: |
        卸载一个 Release，删除它拥有的对象。

        `keep_history` 决定是否保留修订历史：保留下来的历史正是之后回滚所需要的，
        不保留则连同对象一起删除，之后无法回滚。

        权限为 `cluster.read`、`cluster.helm.manage`、`cluster.resource.delete` 与
        `cluster.secret.manage`；kube-* 与 Agent Namespace 另需独立 Namespace 权限。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/HelmReleaseName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmUninstallReleaseRequest" }
      responses:
        "202":
          description: 操作已受理，正在执行；用返回的操作身份读取它的进展与结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmReleaseOperationResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "424": { $ref: "#/components/responses/FailedDependency" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/helm-releases/{release_name}/rollback:
    post:
      tags: [Resources]
      operationId: rollbackHelmRelease
      description: |
        把一个 Release 回滚到存储中仍然保留的某个修订。`revision` 省略或为 0 表示回到当前
        修订的上一个，与 `helm rollback` 不带参数的行为一致。

        回滚会重放该修订记录下来的对象，因此与升级答复同一组权限。被 `--history-max` 清理
        掉的修订不存在，接口也不会假装它们还在。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/HelmReleaseName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelmRollbackReleaseRequest" }
      responses:
        "202":
          description: 操作已受理，正在执行；用返回的操作身份读取它的进展与结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmReleaseOperationResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "424": { $ref: "#/components/responses/FailedDependency" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/Timeout" }
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/helm-operations:
    get:
      tags: [Resources]
      operationId: listHelmReleaseOperations
      description: |
        列出调用者自己在该 Namespace 中启动、且尚未被遗忘的 Release 变更操作，按开始时间从新
        到旧返回。

        它存在的理由只有一个：Console 被关掉或刷新之后，正在进行的那次部署的身份只存在于那个
        页面的内存里，否则就再也找不回来了。返回的是摘要——身份、状态与阶段——不含账目与报告。

        只能读到自己启动的操作。操作的报告里带有渲染出的清单，其中可能包含 Chart 生成的
        Secret；限制成「启动它的那个人」意味着这里不会泄露任何它没有在启动时就已经返回过的
        东西，这也是这两个接口不写审计的原因——变更本身由写入接口在结束时记一次。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
      responses:
        "200":
          description: 正在进行或刚刚结束的操作
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmReleaseOperationPage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/helm-operations/{operation_id}:
    get:
      tags: [Resources]
      operationId: getHelmReleaseOperation
      description: |
        读取一次 Release 变更操作的完整账目：它走到了哪个阶段、Server 与集群分别报告了什么、
        以及结束之后的报告或失败原因。Console 在部署进行期间反复读取它。

        `executing` 阶段的每一行是 Helm 自己的日志原文，由目标集群的 Agent 在操作进行当中
        转发回来，因此「正在等待哪些对象就绪」是能看见的，而不是只能等。

        这个接口按增量读取：把上一次响应的 `event_cursor` 作为 `after` 传回，只会拿到这之后
        发生的行。一次部署可能产生几百行日志，而调用方每秒问一次，全量重发是这套设计唯一会
        额外付出的代价，`after` 就是用来不付它的。

        只能读到自己启动的操作；不属于自己的、已经过期的与从不存在的，都回答 404。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - name: operation_id
          in: path
          required: true
          description: 写入接口返回的操作身份。
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
        - name: after
          in: query
          required: false
          description: >-
            已经读到的最大行号（上一次响应的 `event_cursor`）。只返回它之后发生的行；省略或 0
            表示要完整账目。超过末尾的值表示「没有新的」，不是错误。
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: 操作账目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/HelmReleaseOperationResult" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/helm-releases/{release_name}/revisions:
    get:
      tags: [Resources]
      operationId: listHelmReleaseRevisions
      description: |
        列出一个 Helm Release 在存储中保留的修订历史，按修订号从新到旧返回。Helm 每次修订一个
        Secret，因此这里给出的就是存储实际保留的内容：被 `--history-max` 清理掉的修订不再存在，
        接口也不会假装它们还在。仅返回修订号、状态与写入时间，不返回 values。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/HelmReleaseName"
      responses:
        "200":
          description: Helm Release 修订历史
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesHelmReleasePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
