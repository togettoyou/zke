    MetricsQueryCatalog:
      type: object
      additionalProperties: false
      required: [queries]
      properties:
        queries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - title
              - kind
              - unit
              - dimensions
              - requires_namespace
              - supports_namespace
              - supports_top
              - requires_top
              - requires_component
            properties:
              name:
                type: string
              title:
                type: string
              kind:
                type: string
                enum: [range, instant]
              unit:
                type: string
                enum:
                  [
                    millicores,
                    bytes,
                    bytes_per_second,
                    ops_per_second,
                    seconds,
                    count,
                    ratio,
                  ]
              dimensions:
                type: array
                description: 除集群身份外，该查询返回的序列标签。
                items:
                  type: string
              requires_namespace:
                type: boolean
              supports_namespace:
                type: boolean
                description: |
                  该查询可以按 Namespace 收窄。对不支持的查询传 `namespace` 会被拒绝而不是忽略，
                  否则调用方会把集群级数字当成 Namespace 级的读。
              supports_top:
                type: boolean
              requires_top:
                type: boolean
                description: |
                  该查询必须给出 `top`。Pod 维度属于这一类：一个集群的 Pod 数量比节点高出几个量级，
                  “全部 Pod”既画不出也没人问，边界写在契约里比交给序列上限截断更清楚。
              requires_component:
                type: string
                description: |
                  该查询依赖的采集组件。空表示只依赖每次安装都会配置的 kubelet 端点。
                  缺少对应组件的集群在这里返回空结果，而“空”本身与“集群很闲”无法区分，
                  因此把依赖如实告诉客户端，而不是让它呈现一张没有解释的空图。
                enum: ["", kube-state-metrics, node-exporter]
    MetricsQueryResult:
      type: object
      additionalProperties: false
      required:
        - query
        - title
        - expression
        - kind
        - unit
        - start
        - end
        - step_seconds
        - cluster_id
        - cluster_name
        - series
        - truncated
        - partial
        - issues
      properties:
        query:
          type: string
        title:
          type: string
        expression:
          type: string
          description: 实际图表查询的可移植 MetricsQL；省略由 Server 强制注入的 `zke_cluster_id`。
        kind:
          type: string
          enum: [range, instant]
        unit:
          type: string
          enum:
            [millicores, bytes, bytes_per_second, ops_per_second, seconds, count, ratio]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        step_seconds:
          type: integer
          description: 瞬时查询为 0。
        cluster_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: 本次查询描述的集群，原样回显，便于确认图表读的是哪一个。
        cluster_name:
          type: string
          description: 展示属性，不能替代 `cluster_id` 作为数据身份。
        truncated:
          type: boolean
          description: 序列数超过上限而被截断。
        partial:
          type: boolean
          description: |
            返回结果没有覆盖请求的全部范围。`issues` 说明原因。
            读图的人如果分不清真实低谷和被拒绝的批次，会从同一张图得出相反的结论。
        issues:
          type: array
          description: |
            请求范围与返回结果之间的差异。`no_data` 只是说明，不会使结果 `partial`；
            `throttled` 与 `series_truncated` 会。被限流的集群只报 `throttled`，
            不再另报一次 `no_data`——空结果已经由限流解释了。
          items:
            type: object
            additionalProperties: false
            required: [cluster_id, cluster_name, reason, detail]
            properties:
              cluster_id:
                type: string
                description: 属于整体而非某个集群的问题为空字符串。
              cluster_name:
                type: string
              reason:
                type: string
                enum: [no_data, throttled, series_truncated]
              detail:
                type: string
                description: |
                  对 `throttled` 表示触碰的是哪一项预算（`sample_rate` 或 `cardinality`）。
                  不携带正文、标签值或存储后端的消息。
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [cluster_id, cluster_name, labels, points]
            properties:
              cluster_id:
                $ref: "#/components/schemas/UUID"
              cluster_name:
                type: string
                description: 展示属性，由 Server 按当前归属补齐；数据身份始终是 cluster_id。
              labels:
                type: object
                additionalProperties:
                  type: string
              points:
                type: array
                description: |
                  `[unix_seconds, value]` 数组，`value` 为 `null` 表示该步长没有采样。
                  客户端必须按断点绘制，不得跨空洞连线。
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    oneOf:
                      - type: number
                      - type: "null"
    MetricsExploreRequest:
      type: object
      additionalProperties: false
      required: [cluster_id, queries]
      properties:
        cluster_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: |
            目标集群。表达式只决定读哪些序列，集群始终由这里决定，并由 Server 强制写进
            每一个选择器。
        kind:
          type: string
          enum: [range, instant]
          default: range
          description: 区间查询还是瞬时查询。瞬时查询忽略 `start` 与 `step_seconds`。
        start:
          type: string
          format: date-time
          description: >-
            区间查询的起点。会向前对齐到 step_seconds 的整数倍，与指标存储回答范围查询所用的网格一致；
            响应中的 start 是实际生效的起点。
        end:
          type: string
          format: date-time
        step_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        queries:
          type: array
          minItems: 1
          maxItems: 5
          description: |
            要执行的表达式。上限存在的原因有两个：一条表达式的成本无法从文本预测，
            而共享坐标轴上超过几条曲线之后图本身也不再可读。
          items:
            type: object
            additionalProperties: false
            required: [ref_id, expression]
            properties:
              ref_id:
                type: string
                minLength: 1
                maxLength: 16
                description: |
                  调用方给这一行起的标识，会原样回显，用来把结果对回发起它的那一行，
                  而不依赖数组顺序。同一请求内必须唯一。
              expression:
                type: string
                minLength: 1
                maxLength: 4096
                description: |
                  MetricsQL 表达式，语法见 VictoriaMetrics 文档。写在其中的
                  `zke_cluster_id` 条件会被 Server 删除并替换为当前目标集群。
    MetricsExploreResult:
      type: object
      additionalProperties: false
      required:
        - cluster_id
        - cluster_name
        - kind
        - start
        - end
        - step_seconds
        - queries
        - issues
      properties:
        cluster_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: 本次查询描述的集群，原样回显。
        cluster_name:
          type: string
          description: 展示属性，不能替代 `cluster_id` 作为数据身份。
        kind:
          type: string
          enum: [range, instant]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        step_seconds:
          type: integer
          description: 瞬时查询为 0。
        issues:
          type: array
          description: |
            与单条表达式无关、属于目标集群本身的问题。目前只有 `throttled`：
            Server 正在拒绝该集群的上报时，下面每张图里的空洞都是 Server 造成的。
          items:
            type: object
            additionalProperties: false
            required: [cluster_id, cluster_name, reason, detail]
            properties:
              cluster_id:
                type: string
              cluster_name:
                type: string
              reason:
                type: string
                enum: [no_data, throttled, series_truncated]
              detail:
                type: string
        queries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - ref_id
              - expression
              - effective_expression
              - result_type
              - series
              - truncated
              - duration_ms
              - warning
              - error
            properties:
              ref_id:
                type: string
              expression:
                type: string
                description: 调用方书写的表达式，原样回显。
              effective_expression:
                type: string
                description: |
                  实际执行的表达式，即注入集群过滤条件之后的形式，由 VictoriaMetrics
                  的解析器重新输出，因此是规范化的写法而不是逐字节的原文。表达式被拒绝
                  时为空。它只会提到调用方刚刚通过鉴权的那个集群。
              result_type:
                type: string
                enum: ["", matrix, vector, scalar, string]
              truncated:
                type: boolean
                description: 序列数超过上限而被截断。
              duration_ms:
                type: integer
                description: 该条表达式在存储侧的往返耗时。
              warning:
                type: string
                enum: ["", likely_invalid]
                description: |
                  `likely_invalid` 表示 VictoriaMetrics 认为该表达式含有几乎总是写错的
                  隐式转换（例如 `rate(sum(x))`）。查询照常执行，只是结果多半不是作者
                  想问的那个。
              error:
                description: |
                  该条表达式失败的原因；成功时为 `null`。其余表达式不受影响：
                  第二行的笔误不应该让第一行的图变空。
                oneOf:
                  - type: "null"
                  - type: object
                    additionalProperties: false
                    required: [code, detail]
                    properties:
                      code:
                        type: string
                        enum:
                          [
                            invalid_expression,
                            rejected,
                            storage_unavailable,
                            timeout,
                          ]
                      detail:
                        type: string
                        description: |
                          可以展示给作者的说明。`invalid_expression` 是 Server 对调用方
                          自己那段文本的解释，`rejected` 是存储对同一段文本的解释；两者都
                          不会携带 Server 内部信息。其余取值没有 detail。
              series:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [cluster_id, cluster_name, labels, points]
                  properties:
                    cluster_id:
                      type: string
                    cluster_name:
                      type: string
                    labels:
                      type: object
                      description: |
                        存储返回的全部标签，包含 `__name__`。与具名查询不同，这里不做
                        投影：分组方式由作者决定，丢掉标签会让表格里两行看起来完全一样。
                      additionalProperties:
                        type: string
                    points:
                      type: array
                      description: |
                        `[unix_seconds, value]` 数组，`value` 为 `null` 表示该步长没有采样。
                        客户端必须按断点绘制，不得跨空洞连线。
                      items:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items:
                          oneOf:
                            - type: number
                            - type: "null"
    MetricsSavedQuery:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - owner_user_id
        - owner_display_name
        - visibility
        - name
        - description
        - expression
        - editable
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        owner_user_id:
          type: string
          description: 作者。作者账号被删除后，共享条目会保留但这里为空。
        owner_display_name:
          type: string
          description: 展示属性；作者账号已删除时为空。
        visibility:
          type: string
          enum: [private, project]
        name:
          type: string
        description:
          type: string
        expression:
          type: string
        editable:
          type: boolean
          description: |
            当前调用方是否可以修改或删除该条目。用于隐藏一个只会被拒绝的入口，
            而不是用来决定权限：每条写路径都会重新判定。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MetricsSavedQueryList:
      type: object
      additionalProperties: false
      required: [queries, limit]
      properties:
        queries:
          type: array
          items:
            $ref: "#/components/schemas/MetricsSavedQuery"
        limit:
          type: integer
          description: 单个 Project 可保存的条目总数上限。
    MetricsSavedQueryRequest:
      type: object
      additionalProperties: false
      required: [name, expression, visibility]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            在选择器里显示的名称。共享条目在 Project 内不区分大小写地唯一，私有条目在
            作者自己的范围内唯一——两个人各自保留一个「内存用量」并不冲突，因为谁也看不到
            对方的。
        description:
          type: string
          maxLength: 500
        expression:
          type: string
          minLength: 1
          maxLength: 4096
          description: MetricsQL 表达式。保存时按执行时的同一套规则校验。
        visibility:
          type: string
          enum: [private, project]
          description: |
            `private` 只有作者可见；`project` 对该 Project 内所有可读指标的人可见，
            写入需要 `cluster.metrics.manage`。
    CustomApplication:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - name
        - description
        - url
        - logo_url
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        logo_url:
          type: string
          description: 可选的 HTTP(S) Logo 地址或受支持的 Base64 栅格图片 Data URL；为空时 Console 使用统一的回退图标。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomApplicationList:
      type: object
      additionalProperties: false
      required: [applications, limit]
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/CustomApplication"
        limit:
          type: integer
          description: 单个 Project 可配置的自定义应用总数上限。
    CustomApplicationRequest:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        url:
          type: string
          format: uri
          maxLength: 2048
        logo_url:
          type: string
          maxLength: 65536
          description: 可选。绝对 HTTP(S) Logo 地址最多 2048 字节；JPEG、PNG、WebP、GIF 或 AVIF 的 Base64 Data URL 最多 64 KiB。Server 不主动请求外链地址。
    MetricsCollectorState:
      type: object
      additionalProperties: false
      required:
        - cluster_id
        - installed
        - namespace
        - image
        - desired_image
        - desired_replicas
        - ready_replicas
        - credential_ready
        - throttled
        - throttle_reason
        - throttled_since
        - last_throttled_at
        - active_series
        - max_active_series
        - components
        - scrape_jobs
        - scrape_jobs_truncated
      properties:
        cluster_id:
          $ref: "#/components/schemas/UUID"
        installed:
          type: boolean
          description: 集群中存在由 ZKE 管理的采集组件。同名但不由 ZKE 管理的对象报告为未安装。
        namespace:
          type: string
          description: 采集组件所在的 Namespace，与该集群 Agent 的 Namespace 相同。
        image:
          type: string
          description: 当前运行的镜像；未安装时为空。
        desired_image:
          type: string
          description: 按当前平台配置安装时会使用的镜像，便于发现集群运行的是旧版本。
        desired_replicas:
          type: integer
        ready_replicas:
          type: integer
        credential_ready:
          type: boolean
          description: Agent 持有可供采集组件使用的摄取凭证。只报告事实，不返回凭证本身。
        throttled:
          type: boolean
          description: |
            Server 当前正在拒绝该集群的摄取批次。被拒绝造成的数据空洞与采集组件故障
            在图上完全一样，所以这里必须如实报告，否则操作者会去重启一个正常工作的采集组件。
        throttle_reason:
          type: string
          description: 触碰的预算：`sample_rate` 或 `cardinality`；未限流时为空。
          enum: ["", sample_rate, cardinality]
        throttled_since:
          type: [string, "null"]
          format: date-time
          description: 本次限流的开始时间；未限流时为 null。
        last_throttled_at:
          type: [string, "null"]
          format: date-time
          description: |
            最近一次被限流的时间，限流恢复后仍然保留——否则一个已经恢复的空洞就没有解释了。
        active_series:
          type: integer
          description: |
            该集群活跃时间序列的**估算值**，来自固定大小的概率草图，不是精确计数，
            界面必须按近似值呈现。
        max_active_series:
          type: integer
          description: 估算值所对照的上限。为 0 表示本 Server 没有该集群的预算信息。
        components:
          type: array
          description: |
            一次安装放进集群的每个工作负载各一条，包含采集组件自身。三者作为一体安装与卸载：
            没人抓取的采集目标是浪费，而抓取一个从未安装的目标只会产生持续失败的 job。
            旧版本 Agent 不报告组件，此时为空数组。
          items:
            type: object
            additionalProperties: false
            required:
              - component
              - installed
              - image
              - desired_image
              - desired_replicas
              - ready_replicas
              - unavailable_reason
              - unavailable_message
            properties:
              component:
                type: string
                enum: [collector, kube-state-metrics, node-exporter]
              installed:
                type: boolean
              image:
                type: string
                description: 当前运行的镜像；未安装时为空。
              desired_image:
                type: string
                description: 按当前平台配置安装时会使用的镜像。
              desired_replicas:
                type: integer
                description: DaemonSet 形态的组件（node-exporter）为应调度到的节点数。
              ready_replicas:
                type: integer
              unavailable_reason:
                type: string
                description: |
                  集群**拒绝**了该组件时给出，与“没人安装过”不同。node-exporter 需要
                  host 网络与 hostPath，运行在 baseline 或 restricted Pod Security 级别的
                  Namespace 会拒绝它；ZKE 不会为此改写别人 Namespace 的安全等级，而是如实
                  报告，并且不让它导致整个安装失败——其余链路没有它照常工作。
              unavailable_message:
                type: string
                description: ZKE 自己撰写的说明，不回显集群的原始错误。
        scrape_jobs:
          type: array
          description: |
            仅详情接口填充；列表状态接口返回空数组。认证只报告模式，不返回凭证。
          items:
            $ref: "#/components/schemas/MetricsScrapeJob"
        scrape_jobs_truncated:
          type: boolean
          description: Job 数量超过详情接口的有界响应时为 true。
    MetricsScrapeJob:
      type: object
      additionalProperties: false
      required:
        - job_name
        - source_kind
        - namespace
        - source_name
        - scheme
        - metrics_path
        - port
        - authentication
        - insecure_skip_verify
        - targets
        - targets_truncated
      properties:
        job_name:
          type: string
        source_kind:
          type: string
          enum: [Builtin, Service, EndpointSlice]
          description: |
            标注这个 Job 的开关写在哪个对象上。EndpointSlice 表示写在该 Service 的
            EndpointSlice 上——手工维护的 Endpoints 由 mirroring controller 把注解复制过去。
        namespace:
          type: string
        source_name:
          type: string
        scheme:
          type: string
          enum: [http, https]
        metrics_path:
          type: string
        port:
          type: string
          description: 注解未指定且使用 Endpoints 原始端口时为空。
        authentication:
          type: string
          enum: [none, service-account]
          description: 仅认证模式；不会返回 Token。service-account 只允许 HTTPS。
        insecure_skip_verify:
          type: boolean
        targets:
          type: array
          items: { type: string }
          description: 当前就绪的 EndpointSlice 地址；内置动态 Node Job 可为空。
        targets_truncated:
          type: boolean
          description: 该 Job 的目标超过有界响应时为 true。
