      additionalProperties: false
      required: [namespace, name]
      properties:
        namespace: { type: string, minLength: 1, maxLength: 63 }
        name: { type: string, minLength: 1, maxLength: 253 }
    KubernetesPersistentVolumeClaimCreateInput:
      type: object
      additionalProperties: false
      required: [requested_capacity, access_modes]
      properties:
        requested_capacity: { type: string, minLength: 1 }
        access_modes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [ReadWriteOnce, ReadOnlyMany, ReadWriteMany, ReadWriteOncePod] }
        storage_class_name: { type: [string, "null"], maxLength: 253 }
        volume_name: { type: string, maxLength: 253 }
        volume_mode: { type: string, enum: [Filesystem, Block] }
        selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
    KubernetesStorageClassCreateInput:
      type: object
      additionalProperties: false
      required: [provisioner]
      properties:
        provisioner: { type: string, minLength: 1 }
        parameters:
          type: object
          maxProperties: 512
          additionalProperties: { type: string }
        reclaim_policy: { type: string, enum: [Retain, Delete] }
        volume_binding_mode: { type: string, enum: [Immediate, WaitForFirstConsumer] }
        allow_volume_expansion: { type: boolean, default: false }
        mount_options:
          type: array
          uniqueItems: true
          items: { type: string }
        allowed_topologies:
          type: array
          items: { $ref: "#/components/schemas/KubernetesStorageTopologyTerm" }
    KubernetesCreateStorageResourceRequest:
      type: object
      additionalProperties: false
      required: [name, confirm]
      properties:
        name: { type: string, minLength: 1, maxLength: 253 }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        persistent_volume: { $ref: "#/components/schemas/KubernetesPersistentVolumeCreateInput" }
        persistent_volume_claim: { $ref: "#/components/schemas/KubernetesPersistentVolumeClaimCreateInput" }
        storage_class: { $ref: "#/components/schemas/KubernetesStorageClassCreateInput" }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
      oneOf:
        - required: [persistent_volume]
        - required: [persistent_volume_claim]
        - required: [storage_class]
    KubernetesPersistentVolumeUpdateInput:
      type: object
      additionalProperties: false
      required: [reclaim_policy]
      properties:
        reclaim_policy: { type: string, enum: [Retain, Delete] }
    KubernetesPersistentVolumeClaimUpdateInput:
      type: object
      additionalProperties: false
      required: [requested_capacity]
