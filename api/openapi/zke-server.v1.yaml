                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ClusterConnectionRevocation"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/clusters/{cluster_id}/connection/reenroll:
    post:
      tags: [Clusters]
      operationId: reenrollClusterConnection
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReenrollmentRequest"
      responses:
        "201":
          description: 原 Cluster 的新一次性接入凭证
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ClusterEnrollment"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /agent-api/v1/enroll:
    post:
      tags: [Agent Protocol]
      operationId: enrollAgent
      security:
        - enrollmentToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentEnrollmentRequest"
      responses:
        "200":
          description: 幂等恢复的 Agent 身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AgentEnrollmentResponse"
        "201":
          description: 新签发的 Agent 身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AgentEnrollmentResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /agent-install/v1/manifest:
    get:
      tags: [Agent Protocol]
      operationId: getAgentInstallationManifest
      security:
        - installationToken: []
      responses:
        "200":
          description: Kubernetes 多文档 YAML
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zke_session
    enrollmentToken:
      type: http
      scheme: bearer
      bearerFormat: Agent enrollment token
    installationToken:
      type: http
      scheme: bearer
      bearerFormat: Agent installation token
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RoleID:
      name: role_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RoleBindingID:
      name: role_binding_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ClusterID:
      name: cluster_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    NodeName:
      name: node_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    NamespaceName:
      name: namespace_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 63
    PodName:
      name: pod_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    WorkloadResource:
      name: workload_resource
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/KubernetesWorkloadResource"
    WorkloadName:
      name: workload_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    HPAName:
      name: hpa_name
      in: path
      required: true
      schema:
