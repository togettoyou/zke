      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentEnrollmentRequest"
      responses:
        "200":
          description: 幂等恢复的 Agent 身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AgentEnrollmentResponse"
        "201":
          description: 新签发的 Agent 身份
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AgentEnrollmentResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /agent-install/v1/manifest:
    get:
      tags: [Agent Protocol]
      operationId: getAgentInstallationManifest
      security:
        - installationToken: []
      responses:
        "200":
          description: Kubernetes 多文档 YAML
          content:
            application/yaml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zke_session
    enrollmentToken:
      type: http
      scheme: bearer
      bearerFormat: Agent enrollment token
    installationToken:
      type: http
      scheme: bearer
      bearerFormat: Agent installation token
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RoleID:
      name: role_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RoleBindingID:
      name: role_binding_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ProjectID:
      name: project_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    CustomApplicationID:
      name: application_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    MetricsSavedQueryID:
      name: saved_query_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ClusterID:
      name: cluster_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    AISessionID:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    NodeName:
      name: node_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    NamespaceName:
      name: namespace_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 63
    PodName:
      name: pod_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    WorkloadResource:
      name: workload_resource
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/KubernetesWorkloadResource"
    WorkloadName:
      name: workload_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    HPAName:
      name: hpa_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    VPAName:
      name: vpa_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    KEDAScaledObjectName:
      name: scaled_object_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    ClusterAuthorizationResource:
      name: authorization_resource
      in: path
      required: true
      schema:
        type: string
        enum: [clusterroles, clusterrolebindings]
    NamespacedAuthorizationResource:
      name: authorization_resource
      in: path
      required: true
      schema:
        type: string
        enum: [serviceaccounts, roles, rolebindings]
    AuthorizationName:
      name: authorization_name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    KubernetesYAMLDryRun:
      name: dry_run
      in: query
      description: 仅调用 Kubernetes API Server DryRun，不持久化变更。
      schema:
        type: boolean
        default: false
    KubernetesYAMLConfirm:
      name: confirm
      in: query
      description: 实际写入必须为 true；dry-run 可省略。
      schema:
        type: boolean
        default: false
    KubernetesYAMLFieldManager:
      name: field_manager
      in: query
      schema:
        type: string
        maxLength: 128
    ResourceListLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    ResourceContinue:
      name: continue
      in: query
      schema: { type: string, maxLength: 4096 }
    ResourceLabelSelector:
      name: label_selector
      in: query
      schema: { type: string, maxLength: 4096 }
    ResourceFieldSelector:
      name: field_selector
      in: query
      schema: { type: string, maxLength: 4096 }
    NetworkResource:
      name: network_resource
      in: path
      required: true
      schema:
