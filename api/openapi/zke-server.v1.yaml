      operationId: rollbackKubernetesWorkload
      description: |
        把目标 Deployment、StatefulSet 或 DaemonSet 回滚到指定修订记录的 Pod 模板。
        只写回 spec.template：对这三类控制器而言，修订正是在 Pod 模板变化时产生的，
