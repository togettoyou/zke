      description: |
        持久化存储按计数与容量总量返回，不返回比例：动态制备下可用容量由后端存储
        决定，Kubernetes 不携带该上限，因此没有可读的分母。
      properties:
        persistent_volumes:
          $ref: "#/components/schemas/KubernetesClusterPersistentVolumeOverview"
        persistent_volume_claims:
          $ref: "#/components/schemas/KubernetesClusterPersistentVolumeClaimOverview"
    KubernetesClusterResourceTotals:
