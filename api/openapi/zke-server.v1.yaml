      schema:
        type: string
        maxLength: 253
    KubernetesVersion:
      name: version
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    KubernetesResource:
      name: resource
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    KubernetesNamespace:
      name: namespace
      in: query
      description: Cluster-scoped 资源为空；Namespaced 列表为空时表示所有 Namespace。
      schema:
        type: string
        maxLength: 63
    EnrollmentID:
      name: enrollment_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    OptionalTenantID:
      name: tenant_id
      in: query
      schema:
        $ref: "#/components/schemas/UUID"
    OptionalProjectID:
      name: project_id
      in: query
      schema:
        $ref: "#/components/schemas/UUID"
    OptionalClusterID:
      name: cluster_id
      in: query
      schema:
        $ref: "#/components/schemas/UUID"
    ListLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ListOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    ListSearch:
      name: q
      in: query
      schema:
        type: string
        maxLength: 253
  requestBodies:
    KubernetesYAMLManifest:
      required: true
      content:
        application/yaml:
          schema:
            type: string
            maxLength: 4194304
    CreateNamedResource:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 253
  responses:
