          type: boolean
          description: status=suspended 时必须为 true
    UpdateClusterRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        status:
          type: string
