        `service`、`endpoint`、`ingress`、`gateway` 或 `gateway_route` 配置。Route 的 `spec` 使用
        Kubernetes 原生 camelCase 字段并按路径类型严格解码，未知字段会被拒绝。实际创建要求显式确认；dry-run 使用
