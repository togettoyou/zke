        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/NamespaceName"
        - $ref: "#/components/parameters/PodName"
      responses:
        "200":
          description: 终端录制元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/KubernetesPodTerminalRecording"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/clusters/{cluster_id}/namespaces/{namespace_name}/pods/{pod_name}/terminal-recordings/{recording_id}:
    get:
      tags: [Resources]
      operationId: getKubernetesPodTerminalRecording
