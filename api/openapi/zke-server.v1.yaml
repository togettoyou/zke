    InvalidRequest:
      description: 输入无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: 未认证或 Session 已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: CSRF 或权限检查失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 目标不存在或不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 幂等、生命周期或安全不变量冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: 请求本身合法，但目标当前状态无法完成该操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FailedDependency:
      description: >-
        请求本身合法，但目标 Cluster 的 Agent 不具备完成它所需的能力，通常是 Agent
        版本过旧。它与「Agent 未连接」不同：后者等一等会好，前者不会。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: 请求正文超过允许大小
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: 请求正文媒体类型不受支持
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: 请求被限流
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 服务暂不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Timeout:
      description: 请求处理超时
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Agent 或目标 Kubernetes API 返回无效或失败的响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    UUID:
      type: string
      format: uuid
    AgentNamespace:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
    Timestamp:
      type: string
      format: date-time
      examples:
        - "2026-07-26T14:30:00+08:00"
    SuccessResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          minimum: 200
          maximum: 299
        message:
          type: string
          const: Success
    ErrorData:
      type: object
      additionalProperties: false
      required: [error_code, request_id]
      properties:
        error_code:
          type: string
          pattern: "^[a-z0-9_]+$"
        request_id:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: string
        data:
          $ref: "#/components/schemas/ErrorData"
    Health:
      type: object
      additionalProperties: true
    SetupStatus:
      type: object
      additionalProperties: false
      required: [required]
      properties:
        required:
          type: boolean
    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 1024
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          maxLength: 1024
    Authentication:
      type: object
      additionalProperties: false
      required: [user, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/UserIdentity"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, expires_at, server_version, capabilities, features]
      properties:
        user:
          $ref: "#/components/schemas/UserIdentity"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        server_version:
          type: string
          maxLength: 128
          description: >-
            运行中的 ZKE Server 构建版本。打 tag 的构建为该 tag，否则为 commit 前缀。
            仅用于展示与排障，不参与任何协议协商。
          examples:
            - "v0.3.1"
            - "ad5797d"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        features:
          $ref: "#/components/schemas/SessionFeatures"
    SessionFeatures:
      type: object
      additionalProperties: false
      required: [aiops]
      description: >-
        本部署启用了哪些可选能力。与调用者身份无关，只说明能力是否存在，
        不描述其配置。Console 用它决定启动器上是否出现对应应用图标。
      properties:
        aiops:
          type: boolean
          description: >-
            AIOps 是否已启用并配置了模型端点。为 false 时 Console 不展示 AIOps 应用。
    Capability:
      type: object
