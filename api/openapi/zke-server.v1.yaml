      type: object
      additionalProperties: false
      required: [scope_name, operator, values]
      properties:
        scope_name:
          type: string
          enum: [Terminating, NotTerminating, BestEffort, NotBestEffort, PriorityClass, CrossNamespacePodAffinity]
        operator: { type: string, enum: [In, NotIn, Exists, DoesNotExist] }
        values:
          type: array
          maxItems: 64
          items: { type: string }
    # `scopes` and `scope_selector` sit alongside `hard` and `used` because both
    # narrow which objects the quota counts: reading usage against a limit
    # without them reads a subset of a Namespace as the whole of it, and a list
    # response does exactly that reading.
    KubernetesResourceQuotaSummary:
      type: object
      additionalProperties: false
      required: [hard, used, scopes, scope_selector]
      properties:
        hard: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        used: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        scopes:
          type: array
          items: { type: string }
        scope_selector:
          type: array
          items: { $ref: "#/components/schemas/KubernetesPolicyScopeSelectorRequirement" }
    KubernetesLimitRangeSummary:
      type: object
      additionalProperties: false
      required: [types, item_count]
      properties:
        types:
          type: array
          items: { type: string }
        item_count: { type: integer, minimum: 0 }
    KubernetesLimitRangeItem:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [Container, Pod, PersistentVolumeClaim] }
        max: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        min: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        default: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        default_request: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
        max_limit_request_ratio: { $ref: "#/components/schemas/KubernetesPolicyQuantityMap" }
    KubernetesLimitRangeDetail:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/KubernetesLimitRangeItem" }
    KubernetesNetworkPolicySummary:
      type: object
      additionalProperties: false
      required: [policy_types, ingress_rules, egress_rules]
      properties:
        pod_selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        policy_types:
          type: array
          items: { type: string, enum: [Ingress, Egress] }
        ingress_rules: { type: integer, minimum: 0 }
        egress_rules: { type: integer, minimum: 0 }
    KubernetesNetworkPolicyIPBlock:
      type: object
      additionalProperties: false
      required: [cidr]
      properties:
        cidr: { type: string, minLength: 1, maxLength: 128 }
        except:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 128 }
    KubernetesNetworkPolicyPeer:
      type: object
      additionalProperties: false
      properties:
        pod_selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        namespace_selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        ip_block: { $ref: "#/components/schemas/KubernetesNetworkPolicyIPBlock" }
    KubernetesNetworkPolicyPort:
      type: object
      additionalProperties: false
      properties:
        protocol: { type: string, enum: [TCP, UDP, SCTP] }
        port: { type: string, maxLength: 63 }
        end_port: { type: integer, minimum: 1, maximum: 65535 }
    KubernetesNetworkPolicyRule:
      type: object
      additionalProperties: false
      properties:
        peers:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyPeer" }
        ports:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyPort" }
    KubernetesNetworkPolicyDetail:
      type: object
      additionalProperties: false
      required: [ingress, egress]
      properties:
        ingress:
          type: array
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyRule" }
        egress:
          type: array
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyRule" }
    KubernetesDisruptionBudgetSummary:
      type: object
      additionalProperties: false
      required: [min_available, max_unavailable, current_healthy, desired_healthy, disruptions_allowed, expected_pods]
      properties:
        selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        min_available: { type: string }
        max_unavailable: { type: string }
        current_healthy: { type: integer }
        desired_healthy: { type: integer }
        disruptions_allowed: { type: integer }
        expected_pods: { type: integer }
    KubernetesPolicyCondition:
      type: object
      additionalProperties: false
      required: [type, status, reason, message, last_transition_time]
      properties:
        type: { type: string }
        status: { type: string }
        reason: { type: string }
        message: { type: string }
        last_transition_time: { $ref: "#/components/schemas/Timestamp" }
    KubernetesDisruptionBudgetDetail:
      type: object
      additionalProperties: false
      required: [unhealthy_pod_eviction_policy, conditions]
      properties:
        unhealthy_pod_eviction_policy: { type: string }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/KubernetesPolicyCondition" }
    KubernetesPriorityClassSummary:
      type: object
      additionalProperties: false
      required: [value, global_default, preemption_policy, description]
      properties:
        value: { type: integer }
        global_default: { type: boolean }
        preemption_policy: { type: string }
        description: { type: string }
    KubernetesPolicyResourceSummary:
      type: object
      additionalProperties: false
      required: [resource, api_version, kind, namespace, name, uid, resource_version, creation_timestamp, labels]
      properties:
        resource: { $ref: "#/components/schemas/KubernetesPolicyResource" }
        api_version: { type: string }
        kind:
          type: string
          enum: [ResourceQuota, LimitRange, NetworkPolicy, PodDisruptionBudget, PriorityClass]
        namespace: { type: string }
        name: { type: string, minLength: 1, maxLength: 253 }
        uid: { type: string }
        resource_version: { type: string }
        creation_timestamp: { $ref: "#/components/schemas/Timestamp" }
        labels:
          type: object
          additionalProperties: { type: string }
        resource_quota: { $ref: "#/components/schemas/KubernetesResourceQuotaSummary" }
        limit_range: { $ref: "#/components/schemas/KubernetesLimitRangeSummary" }
        network_policy: { $ref: "#/components/schemas/KubernetesNetworkPolicySummary" }
        disruption_budget: { $ref: "#/components/schemas/KubernetesDisruptionBudgetSummary" }
        priority_class: { $ref: "#/components/schemas/KubernetesPriorityClassSummary" }
      oneOf:
        - required: [resource_quota]
        - required: [limit_range]
        - required: [network_policy]
        - required: [disruption_budget]
        - required: [priority_class]
    KubernetesPolicyResourceDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesPolicyResourceSummary"
        - type: object
          required: [annotations]
          properties:
            annotations:
              type: object
              additionalProperties: { type: string }
            # No `resource_quota_detail`: a quota's only detail field was its
            # scopeSelector, which now travels with the summary.
            limit_range_detail: { $ref: "#/components/schemas/KubernetesLimitRangeDetail" }
            network_policy_detail: { $ref: "#/components/schemas/KubernetesNetworkPolicyDetail" }
            disruption_budget_detail: { $ref: "#/components/schemas/KubernetesDisruptionBudgetDetail" }
    KubernetesPolicyResourcePage:
      type: object
      additionalProperties: false
      required: [resources, continue_token, resource_version, remaining_item_count]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/KubernetesPolicyResourceSummary" }
        continue_token: { type: string }
        resource_version: { type: string }
        remaining_item_count: { type: [integer, "null"], minimum: 0 }
    KubernetesResourceQuotaSpecInput:
      type: object
      additionalProperties: false
      required: [hard]
      properties:
        hard:
          type: object
          minProperties: 1
          maxProperties: 64
          additionalProperties: { type: string, minLength: 1 }
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [Terminating, NotTerminating, BestEffort, NotBestEffort, PriorityClass, CrossNamespacePodAffinity]
        scope_selector:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/KubernetesPolicyScopeSelectorRequirement" }
    KubernetesLimitRangeSpecInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/KubernetesLimitRangeItem" }
    KubernetesNetworkPolicySpecInput:
      type: object
      additionalProperties: false
      required: [policy_types]
      properties:
        pod_selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        policy_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [Ingress, Egress] }
        ingress:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyRule" }
        egress:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/KubernetesNetworkPolicyRule" }
    KubernetesDisruptionBudgetSpecInput:
      type: object
      additionalProperties: false
      required: [selector]
      properties:
        selector: { $ref: "#/components/schemas/KubernetesWorkloadSelector" }
        min_available: { type: string, maxLength: 16 }
        max_unavailable: { type: string, maxLength: 16 }
        unhealthy_pod_eviction_policy: { type: string, enum: [IfHealthyBudget, AlwaysAllow] }
    KubernetesPriorityClassSpecInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: integer, maximum: 1000000000 }
        global_default: { type: boolean, default: false }
        preemption_policy: { type: string, enum: [PreemptLowerPriority, Never] }
        description: { type: string, maxLength: 1024 }
    KubernetesPriorityClassUpdateInput:
      type: object
      additionalProperties: false
      required: [global_default]
      properties:
        description: { type: string, maxLength: 1024 }
        global_default: { type: boolean }
    KubernetesCreatePolicyResourceRequest:
      type: object
      additionalProperties: false
      required: [name, confirm]
      properties:
        name: { type: string, minLength: 1, maxLength: 253 }
        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        resource_quota: { $ref: "#/components/schemas/KubernetesResourceQuotaSpecInput" }
        limit_range: { $ref: "#/components/schemas/KubernetesLimitRangeSpecInput" }
        network_policy: { $ref: "#/components/schemas/KubernetesNetworkPolicySpecInput" }
        disruption_budget: { $ref: "#/components/schemas/KubernetesDisruptionBudgetSpecInput" }
        priority_class: { $ref: "#/components/schemas/KubernetesPriorityClassSpecInput" }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
      oneOf:
        - required: [resource_quota]
        - required: [limit_range]
        - required: [network_policy]
        - required: [disruption_budget]
        - required: [priority_class]
    KubernetesUpdatePolicyResourceRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        resource_quota: { $ref: "#/components/schemas/KubernetesResourceQuotaSpecInput" }
        limit_range: { $ref: "#/components/schemas/KubernetesLimitRangeSpecInput" }
        network_policy: { $ref: "#/components/schemas/KubernetesNetworkPolicySpecInput" }
        disruption_budget: { $ref: "#/components/schemas/KubernetesDisruptionBudgetSpecInput" }
        priority_class: { $ref: "#/components/schemas/KubernetesPriorityClassUpdateInput" }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
      oneOf:
        - required: [resource_quota]
        - required: [limit_range]
        - required: [network_policy]
        - required: [disruption_budget]
        - required: [priority_class]
    KubernetesDeletePolicyResourceRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    KubernetesPolicyMutationResult:
      type: object
      additionalProperties: false
      required: [resource, dry_run]
      properties:
        resource: { $ref: "#/components/schemas/KubernetesPolicyResourceDetail" }
        dry_run: { type: boolean }
    KubernetesPolicyDeleteResult:
      type: object
      additionalProperties: false
      required: [deleted, dry_run, target]
      properties:
        deleted: { type: boolean }
        dry_run: { type: boolean }
        target: { type: string }
    KubernetesSecretSummary:
      type: object
      additionalProperties: false
      required:
        - namespace
        - name
        - uid
        - resource_version
        - creation_timestamp
        - labels
        - type
        - data_keys
        - data_bytes
        - immutable
      properties:
        namespace: { type: string, minLength: 1, maxLength: 63 }
        name: { type: string, minLength: 1, maxLength: 253 }
        uid: { type: string }
        resource_version: { type: string }
        creation_timestamp: { $ref: "#/components/schemas/Timestamp" }
        labels:
          type: object
          additionalProperties: { type: string }
        type:
          type: string
          description: Kubernetes Secret 类型，例如 Opaque 或 kubernetes.io/tls。
        data_keys:
          type: array
          items: { type: string }
          description: 只有键名。取值不在列表响应中。
        data_bytes: { type: integer, format: int64, minimum: 0 }
        immutable: { type: boolean }
    KubernetesSecretDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesSecretSummary"
        - type: object
          required: [annotations, data]
          properties:
            annotations:
              type: object
              additionalProperties: { type: string }
            data:
              type: object
              description: >-
                取值使用标准带填充 Base64，与 Kubernetes 存储它们的方式一致；
                是否可解释为文本由调用方判断。
              additionalProperties: { type: string, format: byte }
    KubernetesSecretPage:
      type: object
      additionalProperties: false
      required: [secrets, continue_token, resource_version, remaining_item_count]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/KubernetesSecretSummary" }
        continue_token: { type: string }
        resource_version: { type: string }
        remaining_item_count: { type: [integer, "null"], minimum: 0 }
    KubernetesCreateSecretRequest:
      type: object
      additionalProperties: false
      required: [name, confirm]
      properties:
        name: { type: string, minLength: 1, maxLength: 253 }
        type:
          type: string
          enum:
            - ""
            - Opaque
            - kubernetes.io/dockerconfigjson
            - kubernetes.io/basic-auth
            - kubernetes.io/ssh-auth
            - kubernetes.io/tls
          description: >-
            创建后不可修改；空字符串按 Opaque 处理。
            kubernetes.io/service-account-token 不接受：它由 Kubernetes 为 ServiceAccount 签发。
        labels:
          type: object
          additionalProperties: { type: string }
          description: app.kubernetes.io/managed-by=zke-server 不接受，该标签标识 ZKE 自身的对象。
        annotations:
          type: object
          additionalProperties: { type: string }
        data:
          type: object
          description: 取值使用标准带填充 Base64。解码后总大小不超过 1 MiB。
          additionalProperties: { type: string, format: byte }
        immutable: { type: boolean, default: false }
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
    KubernetesUpdateSecretRequest:
      type: object
      additionalProperties: false
      required: [uid, resource_version, data, confirm]
      properties:
        uid: { type: string, minLength: 1, maxLength: 128 }
        resource_version: { type: string, minLength: 1, maxLength: 256 }
        data:
          type: object
          description: >-
            整体替换：本次未提交的键会从对象中移除。取值使用标准带填充 Base64。
            type 不在请求中，Kubernetes 在创建后不允许修改它。
          additionalProperties: { type: string, format: byte }
        immutable:
          type: boolean
          description: 省略时保留当前值；设为 true 后 Kubernetes 不允许恢复为 false。
        dry_run: { type: boolean, default: false }
        confirm: { type: boolean }
