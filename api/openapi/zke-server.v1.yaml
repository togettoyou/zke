        labels:
          type: object
          additionalProperties: { type: string }
        annotations:
          type: object
          additionalProperties: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
        binary_data:
          type: object
          description: 值使用标准带填充 Base64。
          additionalProperties: { type: string, format: byte }
        immutable: { type: boolean, default: false }
        dry_run: { type: boolean, default: false }
