      tags: [Resources]
      operationId: listMetricsSavedQueries
      description: |
        列出该 Project 下调用方可见的已保存 MetricsQL 表达式：项目内共享的全部，加上
        调用方自己的私有条目。别人的私有条目由 SQL 本身排除，而不是读出来之后再过滤。

        条目只保存名称、说明与表达式文本，不保存集群、时间范围，也不携带任何权限。运行时
        由 Console 当前选定的目标集群决定读哪个集群，Server 再把该集群改写进每一个选择器
        ——所以一个人写下、另一个人运行的表达式，描述的始终是运行者本来就可以读的集群。

        要求 `cluster.metrics.read`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: 已保存的查询
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsSavedQueryList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Resources]
      operationId: createMetricsSavedQuery
      description: |
        保存一条表达式。

        `visibility` 为 `private` 时只需 `cluster.metrics.read`；为 `project` 时还需要
        `cluster.metrics.manage`——共享会改变项目里所有人看到的列表，属于策展而不是访问。

        表达式在保存时就要通过与执行时相同的改写校验，否则错误只会在别人第一次从选择器里
        点开它时出现，而那里没有任何东西能解释它。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricsSavedQueryRequest"
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsSavedQuery"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/projects/{project_id}/metrics/saved-queries/{saved_query_id}:
    put:
      tags: [Resources]
      operationId: updateMetricsSavedQuery
      description: |
        整体替换一条已保存的表达式。

        私有条目只有作者本人可以改；共享条目需要 `cluster.metrics.manage`。改变可见范围
        时，改变前与改变后的状态都必须是调用方可写的——只校验其中一侧，就等于允许在同一个
        请求里把共享条目改成私有后再编辑，或者反过来把私有条目发布出去。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/MetricsSavedQueryID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricsSavedQueryRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsSavedQuery"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Resources]
      operationId: deleteMetricsSavedQuery
      description: |
        删除一条已保存的表达式。权限与更新相同：私有条目属于作者，共享条目属于
        `cluster.metrics.manage`。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/MetricsSavedQueryID"
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/projects/{project_id}/clusters:
    get:
      tags: [Resources]
      operationId: listClusters
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ListLimit"
        - $ref: "#/components/parameters/ListOffset"
        - $ref: "#/components/parameters/ListSearch"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, suspended]
      responses:
        "200":
          description: Project Cluster 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [clusters, pagination]
                        properties:
                          clusters:
                            type: array
                            items:
                              $ref: "#/components/schemas/ClusterAggregate"
                          pagination:
                            $ref: "#/components/schemas/Pagination"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/clusters/{cluster_id}:
    get:
      tags: [Resources]
      operationId: getCluster
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: Cluster 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ClusterAggregate"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Resources]
      operationId: updateCluster
      description: |
        重命名 Cluster，并在 `active` 与 `suspended` 之间切换。停用会断开 Agent 连接，
        但不撤销任何身份或凭证，恢复后 Agent 以原身份自动重连；停用需要 `confirm: true`。
        `pending` 与 `active` 由 Agent 连接状态决定，不能由此接口设置；停用中的 Cluster
        恢复后回到 `pending`，直到 Agent 重新连接。

        Cluster 名称在其 Project 内唯一，比较时忽略大小写；名称被占用时返回 409
        `cluster_name_conflict`。停用不释放名称，删除才释放——删除会移除记录本身。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClusterRequest"
      responses:
        "200":
          description: Cluster 名称已更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Cluster"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Resources]
      operationId: deleteCluster
      description: |
        删除 Cluster 及其 Agent 身份与凭证——记录被真正移除，不可恢复，名称随之释放。
        临时冻结请改用 `PUT` 将 `status` 置为 `suspended`：Agent 被断开但身份保留。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Confirmation"
      responses:
        "200":
          description: Cluster 已删除，内部接入身份和凭证已移除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Cluster"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/clusters/{cluster_id}/overview:
    get:
      tags: [Resources]
      operationId: getKubernetesClusterOverview
      description: |
        通过目标 Cluster 的在线 Agent 聚合 Node、Namespace、Pod、PersistentVolume、
        PersistentVolumeClaim 以及 Deployment、StatefulSet、DaemonSet、Job、CronJob
        的实时摘要。调用需要 `cluster.read`；Warning Event 使用独立的
        `cluster.event.read` 权限和 Event API，不包含在本响应中。

        各部分通过多个有并发上限的 Kubernetes 查询组成，因此结果是最终一致快照，
        不是同一个 Kubernetes `resourceVersion` 下的原子视图。每一部分最多读取 10000
        个对象；部分查询失败或达到上限时仍返回 200，并通过 `partial: true` 和 `issues`
        标明不完整部分。只有所有部分都失败时，接口才返回错误响应。

        一份完整快照在 Server 内按 Cluster 缓存 15 秒，窗口内的重复请求返回同一份
        结果，`generated_at` 因此可能早于当前时间。含失败部分的结果不进入缓存，
        只达到条目上限的结果会进入。缓存按 Cluster 定键而与调用者无关：本响应描述的是
        Cluster 本身，且每个请求都独立校验该 Cluster 的 `cluster.read`。

        CPU 使用 millicores，内存与存储使用 bytes。请求量依据 Kubernetes 调度语义计算
        非终态 Pod 的 requests，包含 init container、restartable init container、
        Pod-level resources 和 overhead；不代表实时利用率。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: Cluster 实时概览；可能是显式标记的部分结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/KubernetesClusterOverview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/observability/metrics/queries:
    get:
      tags: [Resources]
      operationId: listObservabilityMetricsQueries
      description: |
        列出本 Server 提供的具名指标查询。Console 只能调用这些查询，不能提交
        PromQL：作用域过滤是查询模板的一部分，而不是对用户输入的事后改写。

        该目录描述系统能力，不包含任何集群数据，因此只要求已认证会话。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 可用的指标查询目录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsQueryCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/observability/metrics/query:
    get:
      tags: [Resources]
      operationId: runObservabilityMetricsQuery
      description: |
        执行一个具名指标查询。每次查询针对一个集群：`cluster_id` 必填，Server 校验
        调用者在 `cluster.metrics.read` 上确实可以读取它，再把它作为强制过滤
        （`zke_cluster_id="<id>"` 精确匹配）注入查询模板，调用方参数无法覆盖。

        一次一个集群，与容器服务操作一个集群是同一个理由：把两个集群的曲线加在一起
        得到的是一个不存在的数，把它们画在共享坐标轴上则是把两个问题塞进一张图。

        目标集群不可读时返回 403，且不区分“不存在”与“不属于你”——区分它们会让这个
        接口变成探测范围外集群 ID 的手段。

        缺失采样点在响应中显式为 `null`，不做插值：数据空洞是采集中断的证据，补齐会
        把中断显示成平线。时间戳为秒级 Unix 时间，数值已按 `unit` 换算。

        `namespace` 与 `top` 是否可用由查询目录声明。对不支持的查询传 `namespace`、
        或对 `requires_top` 的查询省略 `top`，都返回 400 而不是忽略该参数。
      security:
        - sessionCookie: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            maxLength: 128
        - name: cluster_id
          in: query
          required: true
          description: 目标集群。每次查询只描述一个集群。
          schema:
            $ref: "#/components/schemas/UUID"
        - name: namespace
          in: query
          schema:
            type: string
            maxLength: 63
        - name: start
          in: query
          description: >-
            范围查询的起点。会向前对齐到 step_seconds 的整数倍，与指标存储回答范围查询所用的网格一致；
            响应中的 start 是实际生效的起点。
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
        - name: step_seconds
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 86400
        - name: top
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: 查询结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsQueryResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/observability/metrics/explore:
    post:
      tags: [Resources]
      operationId: exploreObservabilityMetrics
      description: |
        执行调用方自己书写的 MetricsQL 表达式，一次请求最多 5 条。

        与具名查询不同，表达式由用户书写；作用域因此不是模板的一部分，而是由 Server
        改写出来的。Server 用 VictoriaMetrics 自己的解析器解析表达式，把其中每一个
        序列选择器都改写为携带 `zke_cluster_id="<cluster_id>"`，并且删除调用方自己写
        在表达式里的同名条件——是替换而不是求交：把别人的表达式连同过滤条件一起粘过来
        的人，应该看到自己集群的结果，而不是一张需要解释十分钟的空图。改写后的表达式会
        原样返回（`effective_expression`），因为这是 Server 唯一一处重写用户查询的地方，
        看不到的改写就是无法核对的改写。

        改写不是唯一一道防线。请求同时把同一个条件作为 `extra_label` 交给存储，由存储对
        它解析出的每一个选择器再施加一次；改写后的表达式还会被重新解析校验，任何一个选择
        器没有携带该条件都会被拒绝执行。

        目标集群必填，Server 校验调用方在 `cluster.metrics.read` 上确实可以读取它，与
        具名查询同一条判权路径。表达式只决定读哪些序列，永远不能决定读哪个集群。

        成本与具名查询用同一套边界：时间范围、步长、点数上限、序列上限完全一致，另外限制
        单次请求的表达式条数与同一调用方的并发请求数，超出时返回 429。

        单条表达式的失败（语法错误、存储拒绝、超时）写在该条自己的 `error` 中，其余表达式
        照常返回结果：第二行的笔误不应该让第一行的图变空。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricsExploreRequest"
      responses:
        "200":
          description: 查询结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsExploreResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /api/v1/clusters/{cluster_id}/metrics-collector:
    get:
      tags: [Resources]
      operationId: getClusterMetricsCollector
      description: |
        报告目标集群中采集组件的当前状态。答案来自集群本身而不是 Server 的记录：
        重要的是那里现在跑着什么，Server 侧的标记会在有人手工删除 Deployment 后失真。

        采集组件安装在该集群的 Agent Namespace 内，由 Agent 自身创建与删除，
        摄取凭证也由 Agent 生成，从不经过 Server。要求 `cluster.metrics.read`；
        安装和删除仍分别由 POST、DELETE 以 `cluster.metrics.manage` 保护。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: 采集组件状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsCollectorState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
    post:
      tags: [Resources]
      operationId: installClusterMetricsCollector
      description: |
        在目标集群中安装采集组件。Server 只下发配置（镜像、抓取间隔、缓冲上限），
        对象由 Agent 按固定形状创建，因此这条接口不能用来在 Agent Namespace 里运行
        任意工作负载。

        镜像与拉取策略取自平台配置。重复安装是幂等的：已存在的摄取凭证不会被替换，
        运行中的采集组件不会因此丢失连接。同名但不由 ZKE 管理的对象会被拒绝而不是接管。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: 安装后的采集组件状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/MetricsCollectorState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
    delete:
      tags: [Resources]
      operationId: uninstallClusterMetricsCollector
      description: |
        从目标集群中移除采集组件及其摄取凭证。删除顺序与安装相反，凭证最后删除：
        不留下一个没有采集组件仍然可用的令牌。同名但不由 ZKE 管理的对象会被拒绝。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: 移除后的采集组件状态
          content:
            application/json:
