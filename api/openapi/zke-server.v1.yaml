    MetricsQueryCatalog:
      type: object
      additionalProperties: false
      required: [queries]
      properties:
        queries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - title
              - kind
              - unit
              - dimensions
              - requires_namespace
              - supports_namespace
              - supports_top
              - requires_top
              - requires_component
            properties:
              name:
                type: string
              title:
                type: string
              kind:
                type: string
                enum: [range, instant]
              unit:
                type: string
                enum: [millicores, bytes, bytes_per_second, count, ratio]
              dimensions:
                type: array
                description: 除集群身份外，该查询返回的序列标签。
                items:
                  type: string
              requires_namespace:
                type: boolean
              supports_namespace:
                type: boolean
                description: |
                  该查询可以按 Namespace 收窄。对不支持的查询传 `namespace` 会被拒绝而不是忽略，
                  否则调用方会把集群级数字当成 Namespace 级的读。
              supports_top:
                type: boolean
              requires_top:
                type: boolean
                description: |
                  该查询必须给出 `top`。Pod 维度属于这一类：一个集群的 Pod 数量比节点高出几个量级，
                  “全部 Pod”既画不出也没人问，边界写在契约里比交给序列上限截断更清楚。
              requires_component:
                type: string
                description: |
                  该查询依赖的采集组件。空表示只依赖每次安装都会配置的 kubelet 端点。
                  缺少对应组件的集群在这里返回空结果，而“空”本身与“集群很闲”无法区分，
                  因此把依赖如实告诉客户端，而不是让它呈现一张没有解释的空图。
                enum: ["", kube-state-metrics, node-exporter]
    MetricsQueryResult:
      type: object
      additionalProperties: false
      required:
        - query
        - title
        - kind
        - unit
        - start
        - end
        - step_seconds
        - cluster_id
        - cluster_name
        - series
        - truncated
        - partial
        - issues
      properties:
        query:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [range, instant]
        unit:
          type: string
          enum: [millicores, bytes, bytes_per_second, count, ratio]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        step_seconds:
          type: integer
          description: 瞬时查询为 0。
        cluster_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: 本次查询描述的集群，原样回显，便于确认图表读的是哪一个。
        cluster_name:
          type: string
          description: 展示属性，不能替代 `cluster_id` 作为数据身份。
        truncated:
          type: boolean
          description: 序列数超过上限而被截断。
        partial:
          type: boolean
          description: |
            返回结果没有覆盖请求的全部范围。`issues` 说明原因。
            读图的人如果分不清真实低谷和被拒绝的批次，会从同一张图得出相反的结论。
        issues:
          type: array
          description: |
            请求范围与返回结果之间的差异。`no_data` 只是说明，不会使结果 `partial`；
            `throttled` 与 `series_truncated` 会。被限流的集群只报 `throttled`，
            不再另报一次 `no_data`——空结果已经由限流解释了。
          items:
            type: object
            additionalProperties: false
            required: [cluster_id, cluster_name, reason, detail]
            properties:
              cluster_id:
                type: string
                description: 属于整体而非某个集群的问题为空字符串。
              cluster_name:
                type: string
              reason:
                type: string
                enum: [no_data, throttled, series_truncated]
              detail:
                type: string
                description: |
                  对 `throttled` 表示触碰的是哪一项预算（`sample_rate` 或 `cardinality`）。
                  不携带正文、标签值或存储后端的消息。
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [cluster_id, cluster_name, labels, points]
            properties:
              cluster_id:
                $ref: "#/components/schemas/UUID"
              cluster_name:
                type: string
                description: 展示属性，由 Server 按当前归属补齐；数据身份始终是 cluster_id。
              labels:
                type: object
                additionalProperties:
                  type: string
              points:
                type: array
                description: |
                  `[unix_seconds, value]` 数组，`value` 为 `null` 表示该步长没有采样。
                  客户端必须按断点绘制，不得跨空洞连线。
                items:
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    oneOf:
                      - type: number
                      - type: "null"
    MetricsCollectorState:
      type: object
      additionalProperties: false
      required:
        - cluster_id
        - installed
        - namespace
        - image
        - desired_image
        - desired_replicas
        - ready_replicas
        - credential_ready
        - throttled
        - throttle_reason
        - throttled_since
        - last_throttled_at
        - active_series
        - max_active_series
        - components
      properties:
        cluster_id:
          $ref: "#/components/schemas/UUID"
        installed:
          type: boolean
          description: 集群中存在由 ZKE 管理的采集组件。同名但不由 ZKE 管理的对象报告为未安装。
        namespace:
          type: string
          description: 采集组件所在的 Namespace，与该集群 Agent 的 Namespace 相同。
        image:
          type: string
          description: 当前运行的镜像；未安装时为空。
        desired_image:
          type: string
          description: 按当前平台配置安装时会使用的镜像，便于发现集群运行的是旧版本。
        desired_replicas:
          type: integer
        ready_replicas:
          type: integer
        credential_ready:
          type: boolean
          description: Agent 持有可供采集组件使用的摄取凭证。只报告事实，不返回凭证本身。
        throttled:
          type: boolean
          description: |
            Server 当前正在拒绝该集群的摄取批次。被拒绝造成的数据空洞与采集组件故障
            在图上完全一样，所以这里必须如实报告，否则操作者会去重启一个正常工作的采集组件。
        throttle_reason:
          type: string
          description: 触碰的预算：`sample_rate` 或 `cardinality`；未限流时为空。
          enum: ["", sample_rate, cardinality]
        throttled_since:
          type: [string, "null"]
          format: date-time
          description: 本次限流的开始时间；未限流时为 null。
        last_throttled_at:
          type: [string, "null"]
          format: date-time
          description: |
            最近一次被限流的时间，限流恢复后仍然保留——否则一个已经恢复的空洞就没有解释了。
        active_series:
          type: integer
          description: |
            该集群活跃时间序列的**估算值**，来自固定大小的概率草图，不是精确计数，
            界面必须按近似值呈现。
        max_active_series:
          type: integer
          description: 估算值所对照的上限。为 0 表示本 Server 没有该集群的预算信息。
        components:
          type: array
          description: |
            一次安装放进集群的每个工作负载各一条，包含采集组件自身。三者作为一体安装与卸载：
            没人抓取的采集目标是浪费，而抓取一个从未安装的目标只会产生持续失败的 job。
            旧版本 Agent 不报告组件，此时为空数组。
          items:
            type: object
            additionalProperties: false
            required:
              - component
              - installed
              - image
              - desired_image
              - desired_replicas
              - ready_replicas
              - unavailable_reason
              - unavailable_message
            properties:
              component:
                type: string
                enum: [collector, kube-state-metrics, node-exporter]
              installed:
                type: boolean
              image:
                type: string
                description: 当前运行的镜像；未安装时为空。
              desired_image:
                type: string
                description: 按当前平台配置安装时会使用的镜像。
              desired_replicas:
                type: integer
                description: DaemonSet 形态的组件（node-exporter）为应调度到的节点数。
              ready_replicas:
                type: integer
              unavailable_reason:
                type: string
                description: |
                  集群**拒绝**了该组件时给出，与“没人安装过”不同。node-exporter 需要
                  host 网络与 hostPath，运行在 baseline 或 restricted Pod Security 级别的
                  Namespace 会拒绝它；ZKE 不会为此改写别人 Namespace 的安全等级，而是如实
                  报告，并且不让它导致整个安装失败——其余链路没有它照常工作。
              unavailable_message:
                type: string
                description: ZKE 自己撰写的说明，不回显集群的原始错误。
    KubernetesClusterOverview:
