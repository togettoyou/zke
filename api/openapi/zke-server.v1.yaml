          $ref: "#/components/schemas/Timestamp"
    KubernetesPodSummary:
      type: object
      additionalProperties: false
      required:
        - api_version
        - kind
        - namespace
        - name
        - uid
        - resource_version
        - creation_timestamp
        - labels
        - phase
        - reason
        - ready
        - node_name
        - pod_ip
        - restart_count
        - images
      properties:
        api_version:
          type: string
          const: v1
        kind:
          type: string
          const: Pod
        namespace:
          type: string
          maxLength: 63
        name:
          type: string
          maxLength: 253
        uid:
          type: string
        resource_version:
          type: string
        creation_timestamp:
          $ref: "#/components/schemas/Timestamp"
        deletion_timestamp:
          $ref: "#/components/schemas/Timestamp"
        labels:
          type: object
          additionalProperties:
            type: string
        phase:
          type: string
          enum: [Pending, Running, Succeeded, Failed, Unknown, ""]
        reason:
          type: string
        ready:
          type: boolean
        node_name:
          type: string
        pod_ip:
          type: string
        restart_count:
          type: integer
          format: int64
          minimum: 0
        images:
          type: array
          items:
            type: string
        controller:
          $ref: "#/components/schemas/KubernetesPodOwnerReference"
    KubernetesPodDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesPodSummary"
        - type: object
          required:
            - annotations
            - owner_references
            - message
            - nominated_node_name
            - service_account_name
            - scheduler_name
            - priority_class_name
            - runtime_class_name
            - restart_policy
            - dns_policy
            - host_network
            - host_ips
            - pod_ips
            - qos_class
            - containers
            - init_containers
            - ephemeral_containers
            - conditions
          properties:
            annotations:
              type: object
              additionalProperties:
                type: string
            owner_references:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesPodOwnerReference"
            message:
              type: string
            nominated_node_name:
              type: string
            service_account_name:
              type: string
            scheduler_name:
              type: string
            priority_class_name:
              type: string
            runtime_class_name:
              type: string
            restart_policy:
              type: string
            dns_policy:
              type: string
            host_network:
              type: boolean
            host_ips:
              type: array
              items:
                type: string
            pod_ips:
              type: array
              items:
                type: string
            start_time:
              $ref: "#/components/schemas/Timestamp"
            qos_class:
              type: string
            containers:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesPodContainer"
            init_containers:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesPodContainer"
            ephemeral_containers:
              type: array
              description: 已通过 Kubernetes Ephemeral Containers 能力加入 Pod 的调试容器。
              items:
                $ref: "#/components/schemas/KubernetesPodContainer"
            conditions:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesPodCondition"
    KubernetesPodPage:
      type: object
      additionalProperties: false
      required: [pods, continue_token, resource_version, remaining_item_count]
      properties:
        pods:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesPodSummary"
        continue_token:
          type: string
          description: Kubernetes 原生 opaque continuation token；空字符串表示没有下一页。
        resource_version:
          type: string
        remaining_item_count:
          type: [integer, "null"]
          minimum: 0
    KubernetesDescribe:
      type: object
      additionalProperties: false
      required: [target, family, events, findings, degraded_sections]
      properties:
        target:
          $ref: "#/components/schemas/KubernetesDescribeTarget"
        family:
          type: string
          enum: [pod, workload, node, storage, networking, autoscaling, policy, generic]
          description: |
            对象所属的家族投影。pod、workload、node、storage、networking、autoscaling 与 policy 返回对应详情与诊断结果；
            generic 表示该类型尚无家族规则，只返回身份与 Event。
        pod:
          $ref: "#/components/schemas/KubernetesPodDetail"
        workload:
          $ref: "#/components/schemas/KubernetesWorkloadDetail"
        node:
          $ref: "#/components/schemas/KubernetesNodeDetail"
        node_resources:
          $ref: "#/components/schemas/KubernetesDescribeNodeResources"
        storage:
          $ref: "#/components/schemas/KubernetesStorageResourceDetail"
        networking:
          $ref: "#/components/schemas/KubernetesNetworkingResourceDetail"
        service_endpoints:
          $ref: "#/components/schemas/KubernetesDescribeServiceEndpoints"
        ingress_backends:
          $ref: "#/components/schemas/KubernetesDescribeIngressBackends"
        gateway_status:
          $ref: "#/components/schemas/KubernetesDescribeGatewayStatus"
        autoscaler:
          $ref: "#/components/schemas/KubernetesHPADetail"
        vertical_pod_autoscaler:
          $ref: "#/components/schemas/KubernetesVPADetail"
        keda_scaled_object:
          $ref: "#/components/schemas/KubernetesKEDADetail"
        autoscaler_target:
          $ref: "#/components/schemas/KubernetesDescribeRelatedObject"
        policy:
          $ref: "#/components/schemas/KubernetesPolicyResourceDetail"
        policy_status:
          $ref: "#/components/schemas/KubernetesDescribePolicyStatus"
        related:
          $ref: "#/components/schemas/KubernetesDescribeRelated"
        events:
          $ref: "#/components/schemas/KubernetesDescribeEvents"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeFinding"
        degraded_sections:
          type: array
          description: |
            请求了但没有拿到的部分。为空表示结果完整；静默丢弃某一部分会被读成
            “这里没有问题”，因此缺失必须显式说明。
          items:
            type: string
            enum: [events, events.related, related, related.persistent_volume_claims, node.resources, service.endpoints, ingress.backends, ingress.endpoints, autoscaler.target]
    KubernetesDescribeServiceEndpoints:
      type: object
      additionalProperties: false
      required:
        - endpoint_slices
        - endpoints
        - ready_endpoints
        - serving_endpoints
        - terminating_endpoints
        - truncated
      properties:
        endpoint_slices: { type: integer, format: int64, minimum: 0 }
        endpoints: { type: integer, format: int64, minimum: 0 }
        ready_endpoints: { type: integer, format: int64, minimum: 0 }
        serving_endpoints: { type: integer, format: int64, minimum: 0 }
        terminating_endpoints: { type: integer, format: int64, minimum: 0 }
        truncated:
          type: boolean
          description: EndpointSlice 列表还有下一页；端点计数为下限，不用于生成缺失端点结论。
    KubernetesDescribeIngressBackends:
      type: object
      additionalProperties: false
      required: [items, truncated, services_truncated, endpoint_slices_truncated]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeIngressBackend"
        truncated:
          type: boolean
          description: Ingress 引用的唯一 Service/端口组合超过本次最多处理的 20 个。
        services_truncated:
          type: boolean
          description: Namespace 的 Service 清单还有下一页；未出现的 Service 状态为未知而非不存在。
        endpoint_slices_truncated:
          type: boolean
          description: 相关 EndpointSlice 还有下一页；端点计数为下限且不生成缺失端点结论。
    KubernetesDescribeIngressBackend:
      type: object
      additionalProperties: false
      required:
        - service_name
        - port_name
        - port_number
        - references
        - endpoint_state_available
        - endpoint_slices
        - endpoints
        - ready_endpoints
        - findings
      properties:
        service_name: { type: string }
        port_name: { type: string }
        port_number: { type: integer, format: int32 }
        references:
          type: array
          items: { type: string }
        service_found:
          type: boolean
          description: 未出现表示 Service 清单被截断，无法确认该 Service 是否存在。
        port_found:
          type: boolean
          description: 仅在 Service 已找到时出现。
        endpoint_state_available:
          type: boolean
        endpoint_slices: { type: integer, format: int64, minimum: 0 }
        endpoints: { type: integer, format: int64, minimum: 0 }
        ready_endpoints: { type: integer, format: int64, minimum: 0 }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeFinding"
    KubernetesDescribeGatewayStatus:
      type: object
      additionalProperties: false
      required: [listeners]
      properties:
        listeners:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeGatewayListenerStatus"
    KubernetesDescribeGatewayListenerStatus:
      type: object
      additionalProperties: false
      required: [name, attached_routes, findings]
      properties:
        name: { type: string }
        attached_routes: { type: integer, format: int32, minimum: 0 }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeFinding"
    KubernetesDescribePolicyStatus:
      type: object
      additionalProperties: false
      required: [quota_usage]
      properties:
        quota_usage:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribePolicyQuotaUsage"
    KubernetesDescribePolicyQuotaUsage:
      type: object
      additionalProperties: false
      required: [resource, used, hard, exhausted]
      properties:
        resource: { type: string }
        used: { type: string }
        hard: { type: string }
        exhausted: { type: boolean }
    KubernetesDescribeNodeResources:
      type: object
      additionalProperties: false
      required:
        - cpu_allocatable_millis
        - cpu_requested_millis
        - memory_allocatable_bytes
        - memory_requested_bytes
        - pod_allocatable
        - non_terminal_pods
        - truncated
      properties:
        cpu_allocatable_millis:
          type: integer
          format: int64
          minimum: 0
        cpu_requested_millis:
          type: integer
          format: int64
          minimum: 0
        memory_allocatable_bytes:
          type: integer
          format: int64
          minimum: 0
        memory_requested_bytes:
          type: integer
          format: int64
          minimum: 0
        pod_allocatable:
          type: integer
          format: int64
          minimum: 0
        non_terminal_pods:
          type: integer
          format: int64
          minimum: 0
        truncated:
          type: boolean
          description: Pod 列表还有下一页；requests 为下限，不用于生成比例结论。
    KubernetesDescribeRelated:
      type: object
      additionalProperties: false
      required: [controllers, pods, persistent_volume_claims, truncated]
      description: |
        工作负载与运行它的 Pod 之间的对象。两组分开的原因是它们回答不同的问题：
        Deployment 的 ReplicaSet 是「Pod 还没被创建出来」的记录位置（配额或准入策略在 Pod
        存在之前就拒绝了它），Pod 则记录创建之后发生的一切。
      properties:
        controllers:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeRelatedObject"
        pods:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeRelatedObject"
        persistent_volume_claims:
          type: array
          description: 工作负载 Pod 模板引用的 PVC；Pending 的排在前面并携带 PVCPending 结论。
          items:
            $ref: "#/components/schemas/KubernetesDescribeRelatedObject"
        truncated:
          type: boolean
          description: 工作负载拥有或引用的关联对象多于本次返回；不保证被省略的对象均为健康状态。
    KubernetesDescribeRelatedObject:
      type: object
      additionalProperties: false
      required: [kind, name, uid, namespace, status, ready, findings]
      properties:
        kind:
          type: string
        name:
          type: string
        uid:
          type: string
        namespace:
          type: string
        status:
          type: string
          description: 对象对自身的概括：Pod/PVC 的 phase，ReplicaSet 或 Job 的副本计数。
        ready:
          type: boolean
        findings:
          type: array
          description: 按该对象所属家族的规则得出的结论。工作负载的失败原因通常在这里，而不在工作负载自身。
          items:
            $ref: "#/components/schemas/KubernetesDescribeFinding"
    KubernetesDescribeTarget:
      type: object
      additionalProperties: false
      required: [api_version, kind, namespace, name, uid, resource_version]
      description: |
        实际被描述的对象，取自集群中的活对象而非请求参数：以请求名称配上另一个对象的
        Event，比没有 describe 更糟。
      properties:
        api_version:
          type: string
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
        uid:
          type: string
        resource_version:
          type: string
    KubernetesDescribeEvents:
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeEvent"
        truncated:
          type: boolean
          description: 集群中属于该对象的 Event 多于本次窗口。
        omitted:
          type: string
          enum: [unsupported_scope, unavailable]
          description: |
            Event 为空的原因，仅在并非“确实没有 Event”时出现。
            unsupported_scope：Cluster 级对象，不猜测 Event 所在 Namespace；
            unavailable：Event 读取本身失败，对象部分仍然有效。
    KubernetesDescribeEvent:
      type: object
      additionalProperties: false
      required: [uid, name, type, reason, message, count, source, regarding]
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          type: string
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
          format: int32
        source:
          type: string
          description: 上报者，取 source.component 或 reportingController。
        container:
          type: string
          description: |
            Event 指向的容器，取自 involvedObject.fieldPath 中的
            `spec.containers{name}`；对象级 Event 没有该字段。
        regarding:
          $ref: "#/components/schemas/KubernetesDescribeEventSubject"
        first_seen:
          $ref: "#/components/schemas/Timestamp"
        last_seen:
          $ref: "#/components/schemas/Timestamp"
    KubernetesDescribeEventSubject:
      type: object
      additionalProperties: false
      required: [kind, name, uid]
      description: |
        Event 所指向的对象。工作负载的 describe 会把工作负载、其下控制器与 Pod 的 Event 合成
        一条时间线，「某个容器起不来」这句话必须说明是哪个 Pod 的。
      properties:
        kind:
          type: string
        name:
          type: string
        uid:
          type: string
    KubernetesDescribeFinding:
      type: object
      additionalProperties: false
      required: [code, severity, evidence]
      description: |
        对象没有按预期运行的一条原因。只携带稳定 code 与上游原文，不携带服务端自撰的解释：
        面向用户的措辞属于 Console，而在 Kubernetes 消息之上再编一层说明，正是 describe
        开始说出集群从未说过的话的方式。evidence 指明结论的来源，便于跳转与复核。
      properties:
        code:
          type: string
          enum:
            - PodUnschedulable
            - ImagePullFailure
            - ContainerConfigError
            - CrashLoopBackOff
            - ContainerTerminated
            - OOMKilled
            - VolumeMountFailure
            - ProbeFailure
            - PVCPending
            - WorkloadProgressStalled
            - ReplicaCreateRejected
            - WorkloadFailed
            - NodeNotReady
            - NodeMemoryPressure
            - NodeDiskPressure
            - NodePIDPressure
            - NodeNetworkUnavailable
            - NodeSchedulingDisabled
            - NodeCPURequestsHigh
            - NodeMemoryRequestsHigh
            - NodePodCapacityHigh
            - ServiceNoEndpoints
            - ServiceNoReadyEndpoints
            - ServiceLoadBalancerPending
            - IngressAddressPending
            - IngressControllerRejected
            - IngressBackendServiceNotFound
            - IngressBackendPortNotFound
            - IngressBackendNoEndpoints
            - IngressBackendNoReadyEndpoints
            - GatewayAddressPending
            - GatewayNotAccepted
            - GatewayNotProgrammed
            - GatewayNotReady
            - GatewayListenerNotAccepted
            - GatewayListenerNotProgrammed
            - GatewayListenerConflicted
            - GatewayListenerReferencesInvalid
            - GatewayRouteUnattached
            - GatewayRouteNotAccepted
            - GatewayRouteReferencesInvalid
            - GatewayRoutePartiallyInvalid
            - HPAStatusStale
            - HPAUnableToScale
            - HPAMetricsUnavailable
            - HPAScalingLimited
            - VPAStatusStale
            - VPARecommendationUnavailable
            - VPAConfigurationUnsupported
            - VPANoPodsMatched
            - VPALowConfidence
            - KEDANotReady
            - KEDAFallbackActive
            - ResourceQuotaExhausted
            - PDBNoDisruptionsAllowed
        severity:
          type: string
          enum: [warning]
          description: findings 只报告问题，因此只有一个级别。
        scope:
          type: string
          description: 结论所属容器；对象级结论没有该字段。
        reason:
          type: string
          description: Kubernetes 原始 reason。
        message:
          type: string
          description: 上游消息原文，未经改写。
        exit_code:
          type: integer
          format: int32
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/KubernetesDescribeEvidence"
    KubernetesDescribeEvidence:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [Condition, ContainerState, Event, ObjectStatus]
        name:
          type: string
          description: Condition 类型、容器名、Event UID，或对象状态字段名。
    KubernetesPodExecSessionRequest:
      type: object
      additionalProperties: false
      required: [uid, container, columns, rows, confirm]
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 256
          description: 当前 Pod UID；Agent 在打开 Exec 前再次校验。
        container:
          type: string
          minLength: 1
          maxLength: 63
        columns:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4096
        rows:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4096
        confirm:
          const: true
        record_output:
          type: boolean
          default: false
          description: |
            显式选择仅录制服务端返回的 stdout/stderr；不录制 stdin、Cookie、票据或认证头。
            设为 true 还需要 cluster.pod.terminal_recording.create 权限。
    ClusterTerminalSessionRequest:
      type: object
      additionalProperties: false
      required: [columns, rows, confirm]
      properties:
        columns:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4096
        rows:
          type: integer
          format: uint32
          minimum: 1
          maximum: 4096
        confirm:
          const: true
    KubernetesPodExecSession:
      type: object
      additionalProperties: false
      required: [session_id, expires_at, websocket_path, subprotocol]
      properties:
        session_id:
          $ref: "#/components/schemas/UUID"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        websocket_path:
          type: string
        subprotocol:
          type: string
          const: zke.pod-exec.v1
        recording_id:
          $ref: "#/components/schemas/UUID"
    KubernetesPodLogFrame:
      description: application/x-ndjson 每行一个对象；最后一行必须是 end 帧。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type:
              const: chunk
            data:
              type: string
              format: byte
        - type: object
          additionalProperties: false
          required: [type, result, bytes, limit_reached]
          properties:
            type:
              const: end
            result:
              type: string
              enum: [succeeded, limit_reached, timeout, canceled, access_revoked, failed]
            reason:
              type: string
            message:
              type: string
            bytes:
              type: integer
              format: uint64
            limit_reached:
              type: boolean
    KubernetesPodTerminalRecordingFrame:
      type: object
      additionalProperties: false
      required: [offset_ms, stream, data]
      properties:
        offset_ms:
          type: integer
          format: int64
          minimum: 0
        stream:
          type: string
          enum: [stdout, stderr]
        data:
          type: string
          format: byte
    KubernetesPodTerminalRecording:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - cluster_id
        - namespace
        - pod_name
        - pod_uid
        - container
        - columns
        - rows
        - started_at
        - ended_at
        - expires_at
        - result
        - exit_code
        - output_bytes
        - recording_bytes
        - truncated
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        user_id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: 会话运行时集群所属租户。集群已删除且录像晚于删除写入时缺省。
        project_id:
          allOf:
            - $ref: "#/components/schemas/UUID"
          description: 会话运行时集群所属项目。缺省条件同 tenant_id。
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
          description: 会话运行时的集群名称快照，用于集群删除后仍可读。
        namespace:
          type: string
        pod_name:
          type: string
        pod_uid:
          type: string
        container:
          type: string
        columns:
          type: integer
          format: uint32
        rows:
          type: integer
          format: uint32
        started_at:
          $ref: "#/components/schemas/Timestamp"
        ended_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        result:
          type: string
          enum: [succeeded, output_limit, timeout, canceled, failed]
        exit_code:
          type: integer
          format: int32
        output_bytes:
          type: integer
          format: uint64
        recording_bytes:
          type: integer
          format: uint64
        truncated:
          type: boolean
        frames:
          type: array
          description: 列表响应省略；详情响应返回按时间顺序排列的输出帧。
          items:
            $ref: "#/components/schemas/KubernetesPodTerminalRecordingFrame"
    KubernetesPodAccessSessionRequest:
      type: object
      additionalProperties: false
      required: [uid, port, session_duration_seconds, confirm]
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 256
          description: 当前 Pod UID；Agent 在建立传输前再次校验。
        port:
          type: integer
          format: uint32
          minimum: 1
          maximum: 65535
          description: Pod 内监听的单个 HTTP 端口。
        session_duration_seconds:
          type: integer
          format: int64
          enum: [900, 1800, 3600]
          description: 用户选择的访问会话最长持续秒数；同时受 Server 配置的最大时长限制。
        replace_existing:
          type: boolean
          description: 同一 Pod 已有待激活地址或访问会话时，是否明确结束旧入口并创建新地址；省略时为 false。
        confirm:
          const: true
    KubernetesPodAccessSession:
      type: object
      additionalProperties: false
      required: [access_url, activation_expires_at, session_expires_in_seconds]
      properties:
        access_url:
          type: string
          format: uri
          description: 位于独立 Pod Access Origin 的一次性激活地址。
        activation_expires_at:
          $ref: "#/components/schemas/Timestamp"
        session_expires_in_seconds:
          type: integer
          format: int64
          minimum: 1
          description: 激活成功后访问会话的最长持续秒数。
    KubernetesPodExecClientMessage:
      description: |
        WebSocket 客户端消息。type=stdin 时 data 为必填 Base64；type=resize 时
        columns 和 rows 必填；type=close_stdin 不携带其他字段。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type:
              const: stdin
            data:
              type: string
              format: byte
        - type: object
          additionalProperties: false
          required: [type, columns, rows]
          properties:
            type:
              const: resize
            columns:
              type: integer
              minimum: 1
              maximum: 4096
            rows:
              type: integer
              minimum: 1
              maximum: 4096
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              const: close_stdin
    KubernetesPodExecServerMessage:
      description: |
        WebSocket 服务端消息。stdout/stderr 的 data 是 Base64；exit 是唯一终止帧，
        携带退出码、结果、输出字节数和是否命中输出上限。
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, data]
          properties:
            type:
              type: string
              enum: [stdout, stderr]
            data:
              type: string
              format: byte
        - type: object
          additionalProperties: false
          required: [type, result]
          properties:
            type:
              const: exit
            result:
              type: string
              enum: [ok, invalid_argument, unauthenticated, forbidden, not_found, conflict, resource_exhausted, unavailable, timeout, canceled, internal]
            exit_code:
              type: integer
              format: int32
            reason:
              type: string
            message:
              type: string
            output_bytes:
              type: integer
              format: uint64
              minimum: 0
            output_limit_reached:
              type: boolean
        - type: object
          additionalProperties: false
          required: [type, recording_id, recording_saved]
          properties:
            type:
              const: recording
            recording_id:
              $ref: "#/components/schemas/UUID"
            recording_saved:
              type: boolean
    KubernetesDeletePodRequest:
      type: object
      additionalProperties: false
      required: [uid, confirm]
      properties:
        dry_run:
          type: boolean
          default: false
        confirm:
          type: boolean
          description: 实际删除必须为 true；dry-run 可以为 false。
        uid:
          type: string
          minLength: 1
          maxLength: 128
          description: 当前 Pod UID，防止误删同名重建对象。
        resource_version:
          type: string
          maxLength: 256
        grace_period_seconds:
          type: [integer, "null"]
          minimum: 0
        propagation_policy:
          type: string
          enum: ["", orphan, background, foreground]
    KubernetesNodeAddress:
      type: object
      additionalProperties: false
      required: [type, address]
      properties:
        type:
          type: string
        address:
          type: string
    KubernetesNodeTaint:
      type: object
      additionalProperties: false
      required: [key, value, effect]
      properties:
        key:
          type: string
        value:
          type: string
        effect:
          type: string
        time_added:
          $ref: "#/components/schemas/Timestamp"
    KubernetesNodeCondition:
      type: object
      additionalProperties: false
      required:
        - type
        - status
        - reason
        - message
        - last_heartbeat_time
        - last_transition_time
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        message:
          type: string
        last_heartbeat_time:
          $ref: "#/components/schemas/Timestamp"
        last_transition_time:
          $ref: "#/components/schemas/Timestamp"
    KubernetesNodeDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/KubernetesNodeSummary"
        - type: object
          required:
            - labels
            - annotations
            - provider_id
            - pod_cidr
            - pod_cidrs
            - addresses
            - taints
            - conditions
            - architecture
            - boot_id
            - machine_id
            - system_uuid
          properties:
            labels:
              type: object
              additionalProperties:
                type: string
            annotations:
              type: object
              additionalProperties:
                type: string
            provider_id:
              type: string
            pod_cidr:
              type: string
            pod_cidrs:
              type: array
              items:
                type: string
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeAddress"
            taints:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeTaint"
            conditions:
              type: array
              items:
                $ref: "#/components/schemas/KubernetesNodeCondition"
            architecture:
              type: string
            boot_id:
              type: string
            machine_id:
              type: string
            system_uuid:
              type: string
    AgentEndpointProfile:
      type: object
      additionalProperties: false
      required: [id, name, registration_url, quic_address, registration_ca_certificate_pem, enabled, status, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string, minLength: 1, maxLength: 128 }
        registration_url: { type: string, format: uri }
        quic_address: { type: string }
        registration_ca_certificate_pem: { type: string }
        enabled: { type: boolean }
        status: { type: string, enum: [ready, disabled, unavailable] }
        revision: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AgentEndpointProfileWrite:
      type: object
      additionalProperties: false
      required: [name, registration_url, quic_address, registration_ca_certificate_pem, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        registration_url: { type: string, format: uri }
        quic_address: { type: string }
        registration_ca_certificate_pem: { type: string }
        enabled: { type: boolean }
    WorkloadSettings:
      type: object
      additionalProperties: false
      required: [image, image_pull_policy, cpu_request, memory_request, cpu_limit, memory_limit]
      description: |
        ZKE 装进目标集群的一个工作负载：跑哪个镜像，以及最多能占用集群多少资源。
      properties:
        image: { type: string, maxLength: 512 }
        image_pull_policy: { type: string, enum: [Always, IfNotPresent, Never] }
        cpu_request:
          type: string
          maxLength: 32
          description: |
            容器上的 Kubernetes 数量，例如 `50m`。空字符串表示不在容器上设置该项——
            Kubernetes 没有别的方式表达「不限制」，把预算交给目标 Namespace 的
            LimitRange 时就留空。限制不能低于对应的请求。
        memory_request: { type: string, maxLength: 32 }
        cpu_limit: { type: string, maxLength: 32 }
        memory_limit: { type: string, maxLength: 32 }
    PlatformSettings:
      type: object
      additionalProperties: false
      required: [default_endpoint_profile_id, workloads, cluster_terminal_session_ttl_seconds, revision, updated_at]
      properties:
        default_endpoint_profile_id: { $ref: "#/components/schemas/UUID" }
        workloads:
          type: object
          additionalProperties: { $ref: "#/components/schemas/WorkloadSettings" }
          description: |
            按工作负载名索引，当前为 `agent`、`cluster-terminal`、`collector`、
            `kube-state-metrics`、`node-exporter`。名单由 Server 声明：后续新增的工作
            负载会直接出现在这里，不改变本结构。指标采集的三个名字与集群内组件状态
            上报使用的名字相同。
        cluster_terminal_session_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: Cluster Terminal Pod 存续时长，创建新会话时读取，无需重启 Server。
        revision: { type: integer, minimum: 1 }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    PlatformSettingsUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision]
      description: |
        增量更新：只写出现在请求里的工作负载与字段，其余保持已存储的值。平台配置按分区
        分别保存，整体覆盖会让一次保存带上操作者当前并未查看的值。
      properties:
        workloads:
          type: object
          additionalProperties: { $ref: "#/components/schemas/WorkloadSettings" }
          description: 本次要修改的工作负载。未列出的工作负载保持不变；名字未被 Server 声明会被拒绝。
        cluster_terminal_session_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: 省略表示不修改。
        expected_revision: { type: integer, minimum: 1 }
    ClusterEnrollment:
      type: object
      additionalProperties: false
      required: [id, cluster_name, token, expires_at, endpoint_profile_id, agent_namespace]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        token:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        endpoint_profile_id:
          $ref: "#/components/schemas/UUID"
        agent_namespace:
          $ref: "#/components/schemas/AgentNamespace"
    ClusterEnrollmentRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - project_id
        - cluster_name
        - created_by_user_id
        - status
        - expires_at
        - created_at
        - endpoint_profile_id
        - endpoint_profile_revision
        - agent_namespace
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          $ref: "#/components/schemas/UUID"
        project_id:
          $ref: "#/components/schemas/UUID"
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        created_by_user_id:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
          enum: [active, consumed, expired, revoked]
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        consumed_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        endpoint_profile_id:
          $ref: "#/components/schemas/UUID"
        endpoint_profile_revision:
          type: integer
          minimum: 1
        agent_namespace:
          $ref: "#/components/schemas/AgentNamespace"
    ClusterInstallation:
      type: object
      additionalProperties: false
      required:
        - id
        - cluster_name
        - expires_at
        - manifest_path
        - token
        - endpoint_profile_id
        - agent_namespace
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        manifest_path:
          type: string
        token:
          type: string
        endpoint_profile_id:
          $ref: "#/components/schemas/UUID"
        agent_namespace:
          $ref: "#/components/schemas/AgentNamespace"
    ClusterConnectionRevocation:
      type: object
      additionalProperties: false
      required: [cluster_id, connection_status, revoked_at, already_revoked]
      properties:
        cluster_id:
          $ref: "#/components/schemas/UUID"
        connection_status:
          type: string
          const: revoked
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
        already_revoked:
          type: boolean
    AgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [csr_pem, agent_version, protocol_version]
      properties:
        csr_pem:
          type: string
          description: PEM 编码的 ECDSA P-256 PKCS#10 CSR
        agent_version:
          type: string
          minLength: 1
          maxLength: 128
        protocol_version:
          type: string
          const: v1
    AgentEnrollmentResponse:
      type: object
      additionalProperties: false
      required:
        - cluster_id
        - agent_id
        - certificate_pem
        - certificate_expires_at
      properties:
        cluster_id:
          $ref: "#/components/schemas/UUID"
        agent_id:
          $ref: "#/components/schemas/UUID"
        certificate_pem:
          type: string
        certificate_expires_at:
          $ref: "#/components/schemas/Timestamp"
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_type
        - scope_type
        - action
        - target_type
        - result
        - request_id
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        actor_type:
          type: string
          enum: [user, agent, system]
        actor_user_id:
          $ref: "#/components/schemas/UUID"
        actor_user_name:
          type: string
          description: >-
            事件写入时该用户的用户名。审计记录不对用户、Tenant、Project 或 Cluster
            建立外键，因此这些对象被删除后其 ID 不再可解析；随事件一同记录的名称是
            该记录此后唯一可读的身份依据。
        actor_agent_id:
          $ref: "#/components/schemas/UUID"
        scope_type:
          type: string
          enum: [global, tenant, project, cluster]
        tenant_id:
          $ref: "#/components/schemas/UUID"
        tenant_name:
          type: string
          description: 事件写入时该 Tenant 的名称。
        project_id:
          $ref: "#/components/schemas/UUID"
        project_name:
          type: string
          description: 事件写入时该 Project 的名称。
        cluster_id:
          $ref: "#/components/schemas/UUID"
        cluster_name:
          type: string
          description: 事件写入时该 Cluster 的名称。
        action:
          type: string
        target_type:
          type: string
        target_id:
          $ref: "#/components/schemas/UUID"
        target_name:
          type: string
          description: >-
            事件写入时目标对象的名称。Session、RoleBinding、Agent 与凭证没有名称，
            此字段为空。
        result:
          type: string
          enum: [succeeded, failed, denied]
        request_id:
          type: string
        actor_ip:
          type: string
          description: >-
            发起请求的客户端地址。仅在事件来自用户驱动的 HTTP 请求时记录；
            system 与 agent 发起者、以及在存储事务内写入的事件为空。
        detail:
          type: object
          additionalProperties:
            type: string
          description: >-
            `result` 的结构化原因，键为稳定标识符。例如授权拒绝会记录 `scope_type`，
            以及在实际校验的权限与路由声明的权限不一致时记录 `requested_permission`。
            不承载请求或响应正文、凭证与 Kubernetes 对象内容。
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AuditAction:
      type: object
      additionalProperties: false
      required: [name, group]
      properties:
        name:
          type: string
          description: 写入审计事件 `action` 字段的取值，可直接用作过滤条件。
        group:
          type: string
          enum:
            [
              auth,
              user,
              role,
              role_binding,
              tenant,
              project,
              cluster,
              platform,
              kubernetes_resource,
              denied,
            ]
          description: >-
            所属族。由 Server 声明而非由名称拆分得出——`cluster.delete` 与
            `cluster.enrollment.create` 同族但层级不同，按点号切分会得到错误的分组。
            `denied` 组是鉴权拒绝时记录的权限名，其事件的 `result` 恒为 `denied`。
    AuditTargetType:
      type: string
      description: >-
        写入审计事件 `target_type` 字段的取值，可直接用作过滤条件。与 `action` 一样是
        服务端拥有的封闭词表，客户端不应自行枚举。它描述事件针对的对象类型，与事件所属的
        `scope_type` 不同：`cluster.enrollment.create` 定域于 Project，目标却是 Enrollment。
      enum:
        - user
        - session
        - role
        - role_binding
        - tenant
        - project
        - cluster
        - agent
        - agent_credential
        - enrollment
        - audit_event
        - kubernetes_resource
        - platform_settings
        - agent_endpoint_profile
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [audit_events, pagination]
      properties:
        audit_events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"
